# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# dist/ staleness check
# =============================================================================
# dist/ holds the manifests rendered from src/ (ADR-011) and is what ArgoCD syncs: it must never be
# edited by hand. Re-renders every dist/ with `scripts/dist:render --all` and fails when the
# result differs from what is committed.
#
# Events:      push, pull_request, merge_group (on projects/, catalog/helm/ and this workflow)
# Permissions: contents: read
# =============================================================================

name: 🏗️ dist/ Staleness Check
on:
  push:
    paths:
      - "projects/*/**"
      - "catalog/helm/**"
      - ".github/workflows/push,pull_request.dist-staleness-check.yaml"
  pull_request:
    paths:
      - "projects/*/**"
      - "catalog/helm/**"
      - ".github/workflows/push,pull_request.dist-staleness-check.yaml"
  merge_group: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dist-staleness:
    name: ✅ Verify rendered manifests are up to date
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⬇️ Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Render with the helm and kustomize pinned in .mise.toml (helm 3), not the ones shipped by the
      # runner image: a newer helm renders some Cilium values differently and made every PR fail.
      - name: 🛠️ Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: false

      - name: ⬇️ Install helm and kustomize
        run: mise install helm kustomize

      - name: 🏗️ Re-render all dist/ directories
        run: scripts/dist:render --all

      - name: 🔍 Fail if any dist/ file is stale
        run: |
          if ! git diff --exit-code -- 'projects/*/dist/**'; then
            echo ""
            echo "::error ::One or more dist/ directories are out of sync with their src/ sources."
            echo "::error ::Run 'scripts/dist:render --all' locally and commit the result."
            exit 1
          fi

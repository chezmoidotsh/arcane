# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Sync GitHub labels
# =============================================================================
# Makes the repository labels match .github/labels.yaml. `prune: true` deletes any label that is
# not in the file, so the file is the single source of truth. Runs on a change to the file, daily
# (to undo manual edits) and on demand.
#
# Events:      push (main, on the labels file), schedule, workflow_dispatch
# Permissions: issues: write
# =============================================================================

name: 🏷️ Sync Github labels

on:
  push:
    branches: [main]
    paths:
      [.github/labels.yaml, ".github/workflows/push,schedule.sync-labels.yaml"]
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  labeler:
    name: 🏷️ Labeler
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: 🏷️ Sync Github labels with the definition
        uses: brpaz/action-label-syncer@32e516ae73bbf7c7c0548897be07080795336e15 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yaml
          prune: true

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Post-mortem follow-up
# =============================================================================
# Opens an issue for every overdue action item of the post-mortems of docs/incidents/
# (.github/scripts/postmortem-followup.py). Daily, and on demand.
#
# Events:      schedule, workflow_dispatch
# Permissions: contents: read, issues: write
# =============================================================================

name: 📋 Post-mortem followup

on:
  schedule:
    - cron: "13 7 * * *" # daily at 07:13 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  followup:
    name: 📋 Open issues for overdue post-mortem actions
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: 📋 Run postmortem:followup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./.github/scripts/postmortem-followup.py

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Wiki — publish docs/ to the GitHub Wiki of the repository
# =============================================================================
# docs/ is the source of truth, written with relative links so it reads well in Git. On every push to
# main that touches it (and on demand), the pages (except those listed in docs/.wiki-legacy) are
# copied by `scripts/wiki:publish` with their links rewritten for the wiki, then mirrored to the wiki
# repository. Runs are serialized (cancel-in-progress: false) so two publications never race on the
# wiki repository.
#
#   publish — prepare the pages and mirror them to the wiki
#
# One-time setup: the wiki must be enabled (Settings > Features > Wikis) and initialized (one
# page created by hand in the UI), otherwise the wiki repository does not exist yet.
#
# Secrets:     none (the job token is used)
# Permissions: contents: write (pushes to the wiki repository)
# =============================================================================

name: 📚 Wiki

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/wiki:publish
      - .github/workflows/push,workflow_dispatch.wiki.yaml
  workflow_dispatch: {}

concurrency:
  group: wiki
  cancel-in-progress: false

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # publish — prepare the pages and mirror them to the wiki
  # ---------------------------------------------------------------------------
  publish:
    name: 📚 Publish docs/ to the wiki
    # A manual run from another branch would overwrite the published wiki with unmerged content.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🧪 Self-test the publication script
        run: scripts/wiki:publish --self-test

      - name: 🔗 Prepare the pages (links rewritten for the wiki)
        run: scripts/wiki:publish docs "${{ runner.temp }}/wiki" --repo "${{ github.repository }}"

      - name: 📤 Publish the pages to the wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5.0.6
        with:
          path: ${{ runner.temp }}/wiki
          # The action's own preprocessing only handles root pages and runs them through remark without GFM or front
          # matter support, which mangles tables, admonitions and front matter. scripts/wiki:publish rewrites the
          # links instead.
          preprocess: false
          disable-empty-commits: true

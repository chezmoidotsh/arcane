# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Lint — rtunk check on the changed files
# =============================================================================
# Runs rtunk (linters and formatters configured in .rtunk/rtunk.yaml) through the axnic/rtunk
# action on every pull request and merge-queue entry: the files changed since the base branch
# only, findings become annotations. The OPA policies are not part of the linter stack: the
# compliance workflows run them against the rendered manifests.
#
# Locally: `mise run lint` (check) and `mise run lint:fix` (apply the safe fixes).
#
# Events:      pull_request, merge_group
# Permissions: contents: read
# =============================================================================

name: 🚨 Lint Everything

on:
  merge_group: {}
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  rtunk:
    name: ✅ Validate code quality
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # Full history is needed by check-mode: changed-since-base.
      - name: ⬇️ Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 🧹 Run rtunk check
        uses: axnic/rtunk@main
        with:
          check-mode: changed-since-base

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Full Compliance — OPA policies and Zot coverage on every dist/
# =============================================================================
# Daily counterpart of push,pull_request.compliance-partial.yaml: checks EVERY dist/ directory
# instead of only the changed ones, so a policy change cannot break an untouched app unnoticed.
# One matrix job per directory: conftest against catalog/opa/policies/, then the Zot registry
# coverage check.
#
# Events:      schedule (daily), workflow_dispatch
# Permissions: contents: read
# =============================================================================

name: 🏛️ Full Compliance

on:
  schedule:
    - cron: "37 3 * * *" # daily at 03:37 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  collect-directories:
    name: Collect all dist/ directories
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.all-dist.outputs.directories }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 📋 Collect all dist/ directories
        id: all-dist
        run: |
          dirs=$(find projects -path '*/dist/**' -name '*.yaml' | sed 's|/[^/]*$||' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "directories=$dirs" >> "$GITHUB_OUTPUT"

  compliance:
    name: ${{ matrix.directory }}
    needs: collect-directories
    if: needs.collect-directories.outputs.directories != '[]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJson(needs.collect-directories.outputs.directories) }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: ⬇️ Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: 🛠️ Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true

      - name: 🧪 OPA policy check
        run: >-
          mise exec conftest --
          conftest test "${{ matrix.directory }}"
          --policy catalog/opa/policies/
          --combine
          --output github

      - name: 🔍 Zot registry coverage check
        run: >-
          .github/scripts/check-zot-coverage.py
          --dist "${{ matrix.directory }}"

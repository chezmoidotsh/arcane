# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# OPA policy tests
# =============================================================================
# Runs the unit tests of the OPA/Rego policies (`opa test`) when a policy changes.
#
# Events:      push (main), pull_request, on catalog/opa/ only
# Permissions: contents: read
# =============================================================================

name: 🧪 OPA Policy Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/push,pull_request.opa-test.yaml"
      - "catalog/opa/**"

  pull_request:
    paths:
      - ".github/workflows/push,pull_request.opa-test.yaml"
      - "catalog/opa/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  opa-test:
    name: Run OPA unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🛠️ Set up mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true

      - name: 🧪 Run opa test
        run: mise exec opa -- opa test catalog/opa/policies/ -v

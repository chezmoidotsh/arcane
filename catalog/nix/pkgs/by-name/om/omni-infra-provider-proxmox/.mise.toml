# =============================================================================
# omni-infra-provider-proxmox — package maintenance
# =============================================================================
#   mise run pkg:update -- <version>   # Bump version + resolve src/vendor/ui hashes
#   mise run pkg:eval                  # Check the package evaluates on every system
#   mise run pkg:build:native          # Build it for this machine's system
#   mise run pkg:build:cross           # Build it for another system in a container (NIX_SYSTEM, default x86_64-linux)
# =============================================================================

[tasks."pkg:update"]
description = "Bump omni-infra-provider-proxmox to <version> and refresh its hashes"
usage = 'arg "<version>" help="Upstream version, e.g. 1.2.3"'
depends = [
  "helpers:pkg:update-hashes omni-infra-provider-proxmox {{usage.version}}",
]

[tasks."pkg:eval"]
description = "Evaluate omni-infra-provider-proxmox for every system exposed by the catalog flake"
depends = ["helpers:pkg:eval omni-infra-provider-proxmox"]

[tasks."pkg:build:native"]
description = "Build omni-infra-provider-proxmox for this machine's system"
depends = ["helpers:pkg:build:native omni-infra-provider-proxmox"]

[tasks."pkg:build:cross"]
description = "Build omni-infra-provider-proxmox for another system (NIX_SYSTEM, default x86_64-linux) inside a container"
depends = ["helpers:pkg:build:cross omni-infra-provider-proxmox"]

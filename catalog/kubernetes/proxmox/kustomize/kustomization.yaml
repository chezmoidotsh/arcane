# Kustomization for the Proxmox VE integration (cloud-controller-manager + CSI plugin)
# Provides the network policies of the proxmox-system namespace
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - network-policy.allow-intra-namespace.yaml
  - network-policy.allow-proxmox-to-kubernetes-api.yaml
  - network-policy.allow-proxmox-to-proxmox-api.yaml

---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# PostgreSQL logs of the CloudNative-PG instances → OTel DB semantic
# conventions (ADR-020). For clusters running CNPG.
patches:
  - path: parser.patch.yaml
    target:
      group: opentelemetry.io
      kind: OpenTelemetryCollector
      name: agent

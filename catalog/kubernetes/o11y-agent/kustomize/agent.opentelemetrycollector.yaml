---
# ─────────────────────────────────────────────────────────────────────────────
# o11y node agent — one OpenTelemetry Collector per node (DaemonSet)
#
#   /var/log/pods (file_log, parsed by format) ────────┐
#   Talos machined + kernel (tcp_log 127.0.0.1:6050) ──┤
#   host_metrics (/hostfs) ────────────────────────────┤─▶ k8s_attributes ─▶ identity ─▶ otlp_http ─▶ o11y appliance
#   kubelet_stats (:10250) ────────────────────────────┤
#   prometheus (ServiceMonitor/PodMonitor/annotations, │
#   targets of this node only, via Target Allocator) ──┘
#
# hostNetwork, for two reasons:
#   - Talos machined (host network namespace) ships its service and kernel
#     logs to a local TCP endpoint (machine.logging.destinations and
#     KmsgLogConfig in the Omni cluster templates): 127.0.0.1:6050, never
#     exposed outside the node.
#   - Scrapes come from the node itself, and Cilium always lets the local host
#     reach the pods of its node (allow-localhost): apps exposing metrics need
#     no ingress rule for the agent. The flip side: CiliumNetworkPolicies do not
#     apply to this pod (host endpoint), its egress is not filtered.
#
# Resource attributes on every signal (OTel semantic conventions):
#   k8s.cluster.name   cluster (K8S_CLUSTER_NAME, set per project)
#   host.name          node name, only on host-level data (host_metrics, Talos
#                      logs): data carrying k8s.node.name or k8s.pod.name
#                      identifies its node through k8s.node.name instead
#   service.name       app.kubernetes.io/name label > workload (deployment,
#                      statefulset, daemonset, cronjob, job) > container > pod;
#                      `hostmetrics`, `kubelet` or the Talos service otherwise
#   k8s.pod.name, k8s.pod.ip, k8s.container.name, k8s.namespace.name and the
#   workload (k8s.deployment.name, …) when the data comes from a pod.
#
# Collector component ids use the snake_case names of 0.16x (file_log,
# k8s_attributes, …); the old ids are deprecated aliases.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: agent
  annotations:
    # After the operator (wave 0): its validating webhook (failurePolicy Fail)
    # must answer before the collector can be created.
    argocd.argoproj.io/sync-wave: "1"
spec:
  mode: daemonset
  # oripathy: type=oci upstream=github.com/open-telemetry/opentelemetry-collector-releases tagPrefix=v digest=false
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
  serviceAccount: o11y-agent
  # Log format of the collector pods (ADR-020).
  podAnnotations:
    o11y.chezmoi.sh/log-format: zap-console
  hostNetwork: true
  priorityClassName: system-node-critical
  tolerations:
    - operator: Exists # every node, control plane included

  targetAllocator:
    enabled: true
    # oripathy: type=oci upstream=github.com/open-telemetry/opentelemetry-operator tagPrefix=v digest=false
    image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.162.0
    serviceAccount: o11y-agent-targetallocator
    # Each agent only scrapes the targets running on its own node.
    allocationStrategy: per-node
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
      # Empty selectors: every ServiceMonitor/PodMonitor of the cluster.
      serviceMonitorSelector: {}
      podMonitorSelector: {}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  env:
    - name: K8S_CLUSTER_NAME
      value: MUST-BE-SET-PER-PROJECT
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: K8S_POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: GOMEMLIMIT
      value: 400MiB

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # root (no capability) to read the root-owned files of /var/log/pods.
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
        type: Directory
    - name: hostfs
      hostPath:
        path: /
        type: Directory
    # file_log offsets and the exporter queue: survive an agent restart or an
    # appliance outage without re-reading or losing logs.
    - name: state
      hostPath:
        path: /var/lib/o11y-agent
        type: DirectoryOrCreate
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer
    - name: state
      mountPath: /var/lib/o11y-agent

  config:
    extensions:
      health_check:
        endpoint: ${env:K8S_POD_IP}:13133
      file_storage:
        directory: /var/lib/o11y-agent
        create_directory: false

    receivers:
      # ── Pod logs ──────────────────────────────────────────────────────────
      file_log/pods:
        include: [/var/log/pods/*/*/*.log]
        # From the beginning of a file the agent has never seen (first start,
        # new pod). Known files resume from the offset kept in file_storage, so
        # a restart neither loses nor re-sends logs. A wiped state directory
        # (node reinstall) re-ships what kubelet still retains.
        start_at: beginning
        include_file_path: true
        include_file_name: false
        storage: file_storage
        operators:
          # CRI format; namespace, pod, uid and container from the file path.
          - type: container
            add_metadata_from_filepath: true

      # ── Talos service and kernel logs (json_lines) ────────────────────────
      tcp_log/talos:
        listen_address: 127.0.0.1:6050
        operators:
          - type: json_parser
            timestamp:
              parse_from: attributes["talos-time"]
              layout_type: gotime
              layout: "2006-01-02T15:04:05.999999999Z07:00"
            severity:
              parse_from: attributes["talos-level"]
          - type: move
            from: attributes.msg
            to: body
          # Kernel messages (KmsgLogConfig) carry their own time in the body,
          # `kern:    info: [2026-09-26T15:16:50.47Z]: text`; talos-time is when
          # Talos forwarded them, so a new destination would date the whole
          # ring buffer (replayed since boot) at the replay time.
          - type: regex_parser
            if: 'body matches "^[a-z]+: +[a-z]+: \\["'
            regex: '^(?P<facility>[a-z]+): +[a-z]+: \[(?P<kmsg_time>[^\]]+)\]: (?P<kmsg_msg>(?s).*)$'
            timestamp:
              parse_from: attributes.kmsg_time
              layout_type: gotime
              layout: "2006-01-02T15:04:05.999999999Z07:00"
          - type: move
            if: 'attributes.kmsg_msg != nil'
            from: attributes.kmsg_msg
            to: body
          - type: remove
            if: 'attributes.kmsg_time != nil'
            field: attributes.kmsg_time

      # ── Node metrics ──────────────────────────────────────────────────────
      host_metrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          load: {}
          memory: {}
          network: {}
          paging: {}
          processes: {}
          system: {}
          filesystem:
            exclude_mount_points:
              match_type: regexp
              mount_points: ["/dev/.*", "/proc/.*", "/sys/.*", "/run/.*", "/var/run/.*", "/var/lib/kubelet/.*", "/var/lib/containerd/.*"]
            exclude_fs_types:
              match_type: strict
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, overlay, proc, pstore, securityfs, selinuxfs, squashfs, sysfs, tracefs, tmpfs]

      # ── Pod/container resource usage, from the kubelet ────────────────────
      kubelet_stats:
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        # Kubelet serving certificates are signed by the cluster CA
        # (rotate-server-certificates + kubelet-serving-cert-approver).
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        collection_interval: 30s
        metric_groups: [node, pod, container, volume]
        extra_metadata_labels: [container.id, k8s.volume.type]

      # ── Prometheus-only applications ──────────────────────────────────────
      # The Target Allocator adds the ServiceMonitor/PodMonitor targets and
      # assigns every target to the agent of its node. The job below adds the
      # pods annotated `prometheus.io/scrape: "true"` (`prometheus.io/port`,
      # optional `prometheus.io/path` and `prometheus.io/scheme`).
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                - action: drop
                  source_labels: [__meta_kubernetes_pod_phase]
                  regex: Pending|Succeeded|Failed|Completed
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                  regex: (https?)
                  target_label: __scheme__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  regex: (.+)
                  target_label: __metrics_path__
                - action: replace
                  source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  regex: (.+);(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                # Same target labels as a PodMonitor, used by
                # groupbyattrs/prometheus below.
                - action: replace
                  source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - action: replace
                  source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - action: replace
                  source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25

      # Pod metadata of this node only (filter.node_from_env_var).
      k8s_attributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.ip
            - k8s.container.name
            - container.image.name
            - container.image.tag
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.cronjob.name
            - k8s.job.name
          labels:
            # Temporary, consumed then dropped by transform/identity.
            - tag_name: app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
          # Declared log format of the pod and of each of its containers
          # (ADR-020), consumed by transform/log-format on the pod logs,
          # dropped from the metrics by resource/no-log-format.
          annotations:
            - tag_name: o11y.log.format
              key: o11y.chezmoi.sh/log-format
              from: pod
            - tag_name: o11y.log.format.$$1
              key_regex: ^o11y\.chezmoi\.sh/log-format\.(.+)$$
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip

      # The Prometheus receiver puts every scraped series of a target under one
      # resource (service.name = job, service.instance.id = address) and keeps
      # the target labels (namespace, pod, container) on the data points. Move
      # them to the resource so k8s_attributes can find the pod (hostNetwork
      # targets included, where the IP does not identify a pod).
      groupbyattrs/prometheus:
        keys: [namespace, pod, container]
      transform/prometheus:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - set(resource.attributes["k8s.namespace.name"], resource.attributes["namespace"]) where resource.attributes["namespace"] != nil
              - set(resource.attributes["k8s.pod.name"], resource.attributes["pod"]) where resource.attributes["pod"] != nil
              - set(resource.attributes["k8s.container.name"], resource.attributes["container"]) where resource.attributes["container"] != nil
              - delete_matching_keys(resource.attributes, "^(namespace|pod|container|server\\.port|url\\.scheme)$")
              # The job name is not a service name: derive it from the pod.
              - delete_key(resource.attributes, "service.name") where resource.attributes["k8s.pod.name"] != nil

      # Talos: service.name from talos-service, `kernel` for kernel messages.
      transform/talos:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(log.attributes["service.name"], log.attributes["talos-service"])
              - set(log.attributes["service.name"], "kernel") where log.attributes["service.name"] == nil and log.attributes["facility"] != nil
              - set(log.attributes["service.name"], "talos") where log.attributes["service.name"] == nil
              - delete_matching_keys(log.attributes, "^talos-(service|time|level)$")
      groupbyattrs/talos:
        keys: [service.name]

      # host.name and service.name, on every pipeline (see the header).
      transform/identity:
        error_mode: ignore
        metric_statements: &identity
          - context: resource
            statements:
              - set(resource.attributes["host.name"], "${env:K8S_NODE_NAME}") where resource.attributes["k8s.node.name"] == nil and resource.attributes["k8s.pod.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["app.kubernetes.io/name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.cronjob.name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.job.name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.container.name"]) where resource.attributes["service.name"] == nil
              - set(resource.attributes["service.name"], resource.attributes["k8s.pod.name"]) where resource.attributes["service.name"] == nil
              - delete_key(resource.attributes, "app.kubernetes.io/name")
        log_statements: *identity

      # ── Pod log parsing (ADR-020) ───────────────────────────────────────
      # The format of a container is the value of its annotation
      # `o11y.chezmoi.sh/log-format.<container>`, else the pod's
      # `o11y.chezmoi.sh/log-format`. routing/log-format sends each batch to
      # the pipeline of its format (one kustomize component of ../parsers
      # each); unannotated containers and `none` are not parsed.
      transform/log-format:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(resource.attributes["o11y.log.format"], resource.attributes[Concat(["o11y.log.format.", resource.attributes["k8s.container.name"]], "")]) where resource.attributes[Concat(["o11y.log.format.", resource.attributes["k8s.container.name"]], "")] != nil
              - delete_matching_keys(resource.attributes, "^o11y\\.log\\.format\\..+")

      # Format parsers put the level token they found in o11y.log.level;
      # this maps it to severity_number (the OTLP gateway of the appliance
      # writes severity_text from it), unless a parser already set one.
      transform/severity:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - log.attributes["o11y.log.level"] != nil
            statements:
              - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(log.attributes["o11y.log.level"], "^(?i)(trace|trc)$")
              - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(log.attributes["o11y.log.level"], "^(?i)(debug|dbg|verbose|\\.|-)$")
              - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(log.attributes["o11y.log.level"], "^(?i)(i|info|inf|information|notice|log|\\*)$")
              - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(log.attributes["o11y.log.level"], "^(?i)(w|warn|warning|wrn|#)$")
              - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(log.attributes["o11y.log.level"], "^(?i)(e|error|err|eror)$")
              - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(log.attributes["o11y.log.level"], "^(?i)(f|fatal|ftl|crit|critical|crt|panic|dpanic|alert|emerg)$")
              - delete_key(log.attributes, "o11y.log.level")

      resource/no-log-format:
        attributes:
          - pattern: ^o11y\.log\.format(\..+)?$$
            action: delete

      resource/hostmetrics:
        attributes:
          - key: service.name
            value: hostmetrics
            action: insert
      resource/kubelet:
        attributes:
          - key: service.name
            value: kubelet
            action: insert
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: ${env:K8S_CLUSTER_NAME}
            action: upsert
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: insert

      batch: {}

    connectors:
      # Routes are appended by the parser components (one per format).
      routing/log-format:
        default_pipelines: [logs/pods/export]
        table: []
      forward/parsed: {}

    exporters:
      otlp_http:
        endpoint: https://data.o11y.chezmoi.sh:4318
        compression: gzip
        sending_queue:
          storage: file_storage

    service:
      extensions: [health_check, file_storage]
      # The collector's own metrics, pushed as OTLP (no self-scrape).
      telemetry:
        resource:
          service.name: o11y-agent
          host.name: ${env:K8S_NODE_NAME}
          k8s.cluster.name: ${env:K8S_CLUSTER_NAME}
        metrics:
          readers:
            - periodic:
                interval: 15000 # milliseconds
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: https://data.o11y.chezmoi.sh:4318/v1/metrics
      pipelines:
        logs/pods:
          receivers: [file_log/pods]
          processors: [memory_limiter, k8s_attributes, transform/identity, transform/log-format]
          exporters: [routing/log-format]
        # logs/parsers/<format>: added by the parser components, from
        # routing/log-format to forward/parsed.
        logs/pods/export:
          receivers: [routing/log-format, forward/parsed]
          processors: [transform/severity, resource/cluster, batch]
          exporters: [otlp_http]
        logs/talos:
          receivers: [tcp_log/talos]
          processors: [memory_limiter, transform/talos, groupbyattrs/talos, transform/identity, resource/cluster, batch]
          exporters: [otlp_http]
        metrics/host:
          receivers: [host_metrics]
          processors: [memory_limiter, resource/hostmetrics, transform/identity, resource/cluster, batch]
          exporters: [otlp_http]
        metrics/kubelet:
          receivers: [kubelet_stats]
          processors: [memory_limiter, k8s_attributes, transform/identity, resource/no-log-format, resource/kubelet, resource/cluster, batch]
          exporters: [otlp_http]
        metrics/prometheus:
          receivers: [prometheus]
          processors: [memory_limiter, groupbyattrs/prometheus, transform/prometheus, k8s_attributes, transform/identity, resource/no-log-format, resource/cluster, batch]
          exporters: [otlp_http]

---
# Helm values of the OpenTelemetry Operator, shared by every cluster running
# the o11y agents (catalog/kubernetes/o11y-agent/). The operator only manages
# the two OpenTelemetryCollector resources of the kustomize base and their
# Target Allocator; auto-instrumentation and sidecar injection are not used.

manager:
  image:
    repository: oci.chezmoi.sh/ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
  # Defaults for collectors/target allocators that don't set their own image.
  # Both collectors of the base pin theirs; these only keep the mirror in use.
  collectorImage:
    repository: oci.chezmoi.sh/ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  targetAllocatorImage:
    repository: oci.chezmoi.sh/ghcr.io/open-telemetry/opentelemetry-operator/target-allocator

  # RBAC of the collectors and of the target allocator is written by hand in
  # the kustomize base (least privilege, reviewable in dist/).
  createRbacPermissions: false

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

admissionWebhooks:
  # The pod webhook only exists for sidecar injection and auto-instrumentation,
  # neither of which is used. Scope it to the operator's own namespace instead
  # of every pod creation of the cluster.
  pods:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: o11y-agent-system
  # Webhook certificate issued by cert-manager (self-signed Issuer created by
  # the chart): `helm template` cannot run the chart's own cert generation.
  certManager:
    enabled: true
  autoGenerateCert:
    enabled: false

---
newtInstances:
  - name: "main-tunnel"
    auth:
      existingSecretName: "newt-credentials"
      keys:
        endpointKey: "PANGOLIN_ENDPOINT"
        idKey: "NEWT_ID"
        secretKey: "NEWT_SECRET"
    # Required for Pangolin private resources: without it Newt only serves
    # public targets and refuses client (Olm) traffic.
    acceptClients: true
    enabled: true

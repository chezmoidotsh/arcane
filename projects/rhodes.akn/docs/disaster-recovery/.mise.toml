# =============================================================================
# rhodes.akn disaster recovery — Mise configuration
# =============================================================================
# Exposes convenience tasks for the mechanical, low-risk parts of openbao.md /
# pocket-id.md that are more than a couple of commands: finding the latest S3
# backup (delegates to the repo-wide `cnpg:backup:latest` file task —
# .mise/tasks/cnpg/backup/latest, generic across any CNPG cluster, not
# rhodes-specific), and patching a Cluster manifest's recovery source.
#
# Deliberately NOT automated: `kubectl apply` of the patched Cluster manifest,
# restoring bootstrap secrets, or of any other manifest that mutates the
# cluster. Those stay manual, explicit steps in the procedure documents
# themselves — they're only ever a couple of commands, not worth wrapping.
# =============================================================================

# -----------------------------------------------------------------------------
# OpenBao Disaster Recovery Tasks
# -----------------------------------------------------------------------------

[tasks."dr:openbao:backup:latest"]
description = "Print the latest openbao-database backup serverName on S3."
usage = '''
arg "<context>" help="Kubernetes context for the target cluster"
complete "context" run="kubectl config get-contexts -o name"
'''
depends = [
  { task = "cnpg:backup:latest", args = [
    "{{usage.context}}",
    "vault",
    "projects/rhodes.akn/src/apps/vault/cnpg.objectstore.yaml",
  ] },
]

[tasks."dr:openbao:patch-recovery"]
description = "Patch cnpg.cluster.yaml's recovery source with a given serverName — does NOT apply."
usage = '''
arg "<server_name>" help="Server name to patch into vault/cnpg.cluster.yaml's recovery source"
'''
depends = [
  { task = "dr:cnpg:patch-recovery-source", args = [
    "../../src/apps/vault/cnpg.cluster.yaml",
    "{{usage.server_name}}",
  ] },
]


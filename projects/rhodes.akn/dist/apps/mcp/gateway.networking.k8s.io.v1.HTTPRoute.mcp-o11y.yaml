---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://o11y.mcp.chezmoi.sh
  name: mcp-o11y
  namespace: mcp
spec:
  hostnames:
  - o11y.mcp.chezmoi.sh
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: mcp.chezmoi.sh-websecure
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kube-system
    sectionName: mcp.chezmoi.sh-websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: vmcp-mcp-o11y
      port: 4483
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

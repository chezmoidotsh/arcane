---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-token
  namespace: mcp
spec:
  data:
  - remoteRef:
      key: rhodes.akn/mcp/o11y/grafana-token
      property: token
    secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: mcp-grafana-token

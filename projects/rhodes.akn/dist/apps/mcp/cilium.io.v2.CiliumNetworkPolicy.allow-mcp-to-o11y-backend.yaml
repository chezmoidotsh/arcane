---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the VictoriaMetrics, VictoriaLogs and VictoriaTraces MCP servers to query the o11y LXC
      appliance (data.o11y.chezmoi.sh, LAN-only). Same destination as Grafana's datasources.
  name: allow-mcp-to-o11y-backend
  namespace: mcp
spec:
  egress:
  - toFQDNs:
    - matchName: data.o11y.chezmoi.sh
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector: {}

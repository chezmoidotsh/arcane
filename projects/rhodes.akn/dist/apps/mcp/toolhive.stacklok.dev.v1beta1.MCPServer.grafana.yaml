---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
  namespace: mcp
spec:
  args:
  - --transport=streamable-http
  - --address=0.0.0.0:8000
  - --disable-query
  - --disable-write
  - --allowed-hosts=*
  env:
  - name: GRAFANA_URL
    value: http://grafana-service.o11y.svc.cluster.local:3000
  groupRef:
    name: o11y
  image: oci.chezmoi.sh/docker.io/grafana/mcp-grafana:2.3.0
  mcpPort: 8000
  podTemplateSpec:
    metadata:
      annotations:
        o11y.chezmoi.sh/log-format: logfmt
  resourceOverrides:
    proxyDeployment:
      podTemplateMetadataOverrides:
        annotations:
          o11y.chezmoi.sh/log-format: json
  secrets:
  - key: token
    name: mcp-grafana-token
    targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  transport: streamable-http

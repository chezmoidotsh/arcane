---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victoriatraces
  namespace: mcp
spec:
  env:
  - name: VT_INSTANCE_ENTRYPOINT
    value: https://data.o11y.chezmoi.sh/traces
  - name: MCP_SERVER_MODE
    value: http
  - name: MCP_LISTEN_ADDR
    value: :8080
  groupRef:
    name: o11y
  image: oci.chezmoi.sh/ghcr.io/victoriametrics-community/mcp-victoriatraces:v1.5.0
  mcpPort: 8080
  podTemplateSpec:
    metadata:
      annotations:
        o11y.chezmoi.sh/log-format: logfmt
  resourceOverrides:
    proxyDeployment:
      podTemplateMetadataOverrides:
        annotations:
          o11y.chezmoi.sh/log-format: json
  transport: streamable-http

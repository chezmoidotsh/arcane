---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-o11y-auth
  namespace: mcp
spec:
  data:
  - remoteRef:
      key: rhodes.akn/mcp/o11y/oidc-client
      property: client_secret
    secretKey: client_secret
  - remoteRef:
      key: rhodes.akn/mcp/o11y/auth-server
      property: hmac
    secretKey: hmac
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: mcp-o11y-auth

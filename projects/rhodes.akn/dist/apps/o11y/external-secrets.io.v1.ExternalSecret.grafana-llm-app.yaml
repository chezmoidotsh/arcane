---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-llm-app
  namespace: o11y
spec:
  data:
  - remoteRef:
      key: rhodes.akn/grafana/api-keys/openrouter
      property: api_key
    secretKey: api_key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: grafana-llm-app
    template:
      data:
        grafana-llm-app.yaml: |
          apiVersion: 1
          apps:
            - type: grafana-llm-app
              disabled: false
              jsonData:
                provider: custom
                openAI:
                  url: https://openrouter.ai/api
                  apiPath: /v1
                models:
                  default: base
                  mapping:
                    base: deepseek/deepseek-v4.1-flash-1017
                    large: mistralai/mistral-large-4-0
                # Reasoning models can exceed the 2 min default on large prompts.
                requestTimeoutSeconds: 300
              secureJsonData:
                openAIKey: "{{ .api_key }}"
      engineVersion: v2
      type: Opaque

---
apiVersion: v1
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: victorialogs
          address:
            socket_address: { address: 127.0.0.1, port_value: 9428 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: victorialogs
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      virtual_hosts:
                        - name: victorialogs
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: o11y-appliance
                                prefix_rewrite: /logs/
                                host_rewrite_literal: data.o11y.chezmoi.sh
                                # Live tail streams for as long as Grafana
                                # keeps it open; the proxy enforces its own
                                # backend timeout on regular queries.
                                timeout: 0s
      clusters:
        - name: o11y-appliance
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: o11y-appliance
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: data.o11y.chezmoi.sh, port_value: 443 }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: data.o11y.chezmoi.sh
              common_tls_context:
                validation_context:
                  trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: data.o11y.chezmoi.sh }
kind: ConfigMap
metadata:
  name: loki-vl-proxy-envoy
  namespace: o11y

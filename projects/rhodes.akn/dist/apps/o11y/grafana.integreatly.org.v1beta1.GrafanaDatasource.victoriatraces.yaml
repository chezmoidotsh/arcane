---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriatraces
  namespace: o11y
spec:
  datasource:
    access: proxy
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        filterBySpanID: false
        filterByTraceID: true
        spanEndTimeShift: 5m
        spanStartTimeShift: -5m
      tracesToMetrics:
        datasourceUid: victoriametrics
        queries:
        - name: Host CPU load
          query: system_cpu_load_average_1m{$__tags}
        spanEndTimeShift: 5m
        spanStartTimeShift: -5m
        tags:
        - key: host.name
    name: VictoriaTraces
    type: tempo
    url: https://data.o11y.chezmoi.sh/traces/select/tempo
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoriatraces-tempo

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Loki-VL-proxy (its Envoy sidecar) to query VictoriaLogs on the o11y LXC appliance
      (data.o11y.chezmoi.sh, LAN-only). Grafana reaches the proxy through allow-intra-namespace.
  name: allow-loki-vl-proxy-to-o11y-backend
  namespace: o11y
spec:
  egress:
  - toFQDNs:
    - matchName: data.o11y.chezmoi.sh
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki-vl-proxy

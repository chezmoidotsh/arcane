---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: o11y
spec:
  datasource:
    access: proxy
    editable: false
    jsonData:
      derivedFields:
      - datasourceUid: victoriatraces-tempo
        matcherRegex: trace_id
        matcherType: label
        name: trace_id
        url: ${__value.raw}
        urlDisplayLabel: View trace
      - datasourceUid: victoriametrics
        matcherRegex: host_name
        matcherType: label
        name: host_name
        url: system_cpu_load_average_1m{host.name="${__value.raw}"}
        urlDisplayLabel: Host metrics
    name: Loki (VictoriaLogs)
    type: loki
    url: http://loki-vl-proxy.o11y.svc:3100
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: loki

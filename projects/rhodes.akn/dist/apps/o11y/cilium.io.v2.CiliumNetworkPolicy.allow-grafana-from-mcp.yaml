---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Grafana MCP server (mcp namespace) to call the Grafana API.
  name: allow-grafana-from-mcp
  namespace: o11y
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: mcp
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP

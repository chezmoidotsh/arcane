---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics-logs
  namespace: o11y
spec:
  datasource:
    access: proxy
    editable: false
    jsonData:
      derivedFields:
      - datasourceUid: victoriatraces-tempo
        matcherRegex: trace_id
        matcherType: label
        name: trace_id
        url: ${__value.raw}
        urlDisplayLabel: View trace
      - datasourceUid: victoriametrics
        matcherRegex: host.name
        matcherType: label
        name: host.name
        url: system_cpu_load_average_1m{host.name="${__value.raw}"}
        urlDisplayLabel: Host metrics
      otelPreset:
        detection:
          severity:
            field: severity_text
            source: manual
            valueCase: string
          traceIdField: trace_id
        enabled: true
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    url: https://data.o11y.chezmoi.sh/logs
  instanceSelector:
    matchLabels:
      dashboards: grafana
  plugins:
  - name: victoriametrics-logs-datasource
    version: 0.34.0
  uid: victorialogs

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics-metrics
  namespace: o11y
spec:
  datasource:
    access: proxy
    editable: false
    isDefault: true
    jsonData:
      httpMethod: POST
    name: VictoriaMetrics
    type: prometheus
    url: https://data.o11y.chezmoi.sh/metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoriametrics

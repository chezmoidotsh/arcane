---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics-metrics
  namespace: o11y
spec:
  datasource:
    access: proxy
    editable: false
    isDefault: true
    name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    url: https://data.o11y.chezmoi.sh/metrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  plugins:
  - name: victoriametrics-metrics-datasource
    version: 1.0.1
  uid: victoriametrics

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    cnpg.io/description: PostgreSQL credentials for openbao-database
    external-secrets.io/description: |
      Generates OpenBao's own CNPG role password locally — no Vault dependency,
      since OpenBao's storage backend IS this Postgres cluster (it can't fetch
      its own credentials from Vault). refreshInterval: "0" means generate once;
      CNPG reconciles the managed role's password whenever this Secret changes.
  labels:
    app.kubernetes.io/name: vault
  name: openbao-database-credentials
  namespace: vault
spec:
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: openbao-database-password
  refreshInterval: "0"
  target:
    name: openbao-database-credentials
    template:
      data:
        password: '{{ .password }}'
        uri: postgresql://openbao:{{ .password }}@openbao-database-rw:5432/openbao
        username: openbao
      engineVersion: v2

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the ArgoCD server to reach Pocket-ID OIDC endpoints at auth.chezmoi.sh for SSO
      login. Uses "cluster", not "ingress": toEntities:ingress on egress breaks Cilium's Gateway
      API hairpin routing (pod reaching its own cluster's Gateway VIP), causing an unconditional
      403 from Envoy regardless of policy content elsewhere. Also avoids toFQDNs, since the
      internal Gateway's LB IP is shared by every *.chezmoi.sh hostname and Cilium's ipcache
      assigns one fqdn identity per IP cluster-wide.
  name: allow-argocd-to-pocket-id
  namespace: argocd
spec:
  egress:
  - toEntities:
    - cluster
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the external-secrets controller to reach OpenBao (vault.chezmoi.sh) to authenticate
      via the Kubernetes auth method and fetch secrets referenced by ExternalSecret resources.
  name: allow-external-secrets-to-vault
  namespace: external-secrets-system
spec:
  egress:
  - toFQDNs:
    - matchName: vault.chezmoi.sh
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets

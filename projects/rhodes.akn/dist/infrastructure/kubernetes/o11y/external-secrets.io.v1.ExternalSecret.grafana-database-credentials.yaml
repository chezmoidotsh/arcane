---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-database-credentials
  namespace: o11y-system
spec:
  data:
  - remoteRef:
      key: rhodes.akn/grafana/database/credentials
      property: username
    secretKey: username
  - remoteRef:
      key: rhodes.akn/grafana/database/credentials
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: grafana-database-credentials
    template:
      data:
        password: '{{ .password }}'
        username: '{{ .username }}'
      engineVersion: v2
      type: Opaque

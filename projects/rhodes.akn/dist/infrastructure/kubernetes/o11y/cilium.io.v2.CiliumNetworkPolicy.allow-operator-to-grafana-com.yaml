---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Grafana Operator to fetch published dashboard JSON from grafana.com
      (grafanaCom.id/revision references, e.g. victoriametrics-overview) -- distinct
      from the operator's own API calls to the in-cluster Grafana instance, which stay
      on the pod network and need no egress policy. Also covers the Grafana instance
      pod itself: a GrafanaDatasource's spec.plugins (e.g. victoriametrics-logs-
      datasource) makes Grafana install that plugin from grafana.com at startup, and a
      failed install is fatal to the whole process, not just a missing feature.
  name: allow-operator-to-grafana-com
  namespace: o11y-system
spec:
  egress:
  - toFQDNs:
    - matchName: grafana.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - grafana-operator
      - grafana

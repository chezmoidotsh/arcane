---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: o11y-system
spec:
  data:
  - remoteRef:
      key: rhodes.akn/grafana/admin/bootstrap-credentials
      property: username
    secretKey: username
  - remoteRef:
      key: rhodes.akn/grafana/admin/bootstrap-credentials
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: grafana-admin-credentials
    template:
      data:
        GF_SECURITY_ADMIN_PASSWORD: '{{ .password }}'
        GF_SECURITY_ADMIN_USER: '{{ .username }}'
      engineVersion: v2
      type: Opaque

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://o11y.chezmoi.sh
  name: grafana
  namespace: o11y-system
spec:
  hostnames:
  - o11y.chezmoi.sh
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: chezmoi.sh-websecure
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: internal
    namespace: kube-system
    sectionName: chezmoi.sh-websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: grafana-service
      port: 3000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

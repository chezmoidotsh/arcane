---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: grafana
  name: grafana
  namespace: o11y-system
spec:
  config:
    auth.generic_oauth:
      allow_sign_up: "true"
      api_url: https://auth.chezmoi.sh/api/oidc/userinfo
      auth_url: https://auth.chezmoi.sh/authorize
      enabled: "true"
      name: Pocket ID
      scopes: openid profile email
      token_url: https://auth.chezmoi.sh/api/oidc/token
      use_pkce: "true"
    database:
      host: grafana-database-rw:5432
      name: grafana
      ssl_mode: disable
      type: postgres
      user: grafana
    feature_toggles:
      enable: grafanaAdvisor
    server:
      root_url: https://o11y.chezmoi.sh
    users:
      auto_assign_org_role: Admin
  deployment:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          containers:
          - env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: GF_SECURITY_ADMIN_USER
                  name: grafana-admin-credentials
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GF_SECURITY_ADMIN_PASSWORD
                  name: grafana-admin-credentials
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: grafana-database-credentials
            - name: GF_INSTALL_PLUGINS
              value: taminomara-hostoverview-panel 1.2.0, digrich-bubblechart-panel
                2.0.1, tim012432-calendarheatmap-panel 1.1.1, zestairlove-compacthostmap-panel
                0.9.2, hpehpc-grafanaclusterview-panel 1.3.2, vaduga-mapgl-panel 2.9.0,
                boazreicher-mosaicplot-panel 1.0.18, nikosc-percenttrend-panel 1.0.8,
                novatec-sdg-panel 4.2.0, grafana-advisor-app 1.0.2, grafana-llm-app
                1.0.8, grafana-assistant-app 2.0.46
            envFrom:
            - secretRef:
                name: grafana-oidc-client
            name: grafana
            volumeMounts:
            - mountPath: /var/lib/grafana/plugins
              name: plugins
          volumes:
          - name: plugins
            persistentVolumeClaim:
              claimName: grafana-plugins
  disableDefaultAdminSecret: true

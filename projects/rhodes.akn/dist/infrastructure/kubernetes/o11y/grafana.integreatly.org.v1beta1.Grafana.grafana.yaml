---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: grafana
  name: grafana
  namespace: o11y-system
spec:
  config:
    auth.generic_oauth:
      allow_sign_up: "true"
      api_url: https://auth.chezmoi.sh/api/oidc/userinfo
      auth_url: https://auth.chezmoi.sh/authorize
      enabled: "true"
      name: Pocket ID
      scopes: openid profile email
      token_url: https://auth.chezmoi.sh/api/oidc/token
      use_pkce: "true"
    database:
      host: grafana-database-rw:5432
      name: grafana
      ssl_mode: disable
      type: postgres
      user: grafana
    server:
      root_url: https://o11y.chezmoi.sh
    users:
      auto_assign_org_role: Admin
  deployment:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          containers:
          - env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: GF_SECURITY_ADMIN_USER
                  name: grafana-admin-credentials
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: GF_SECURITY_ADMIN_PASSWORD
                  name: grafana-admin-credentials
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: grafana-database-credentials
            envFrom:
            - secretRef:
                name: grafana-oidc-client
            name: grafana
  disableDefaultAdminSecret: true

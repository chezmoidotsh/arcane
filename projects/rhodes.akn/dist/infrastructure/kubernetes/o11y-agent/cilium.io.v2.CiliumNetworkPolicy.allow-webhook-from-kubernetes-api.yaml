---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Kubernetes API server to reach the OpenTelemetry Operator admission and
      conversion webhooks (port 9443). Also allows remote-node: BPF masquerade SNATs the
      apiserver's call before it reaches this cross-node webhook (control-plane is
      NoSchedule-tainted), so it lands as remote-node instead of kube-apiserver.
  name: allow-webhook-from-kubernetes-api
  namespace: o11y-agent-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-operator
  ingress:
  - fromEntities:
    - kube-apiserver
    - remote-node
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP

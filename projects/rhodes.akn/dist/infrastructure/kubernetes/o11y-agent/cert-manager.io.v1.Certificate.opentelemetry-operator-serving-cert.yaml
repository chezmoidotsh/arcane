---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: opentelemetry-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry-operator
    app.kubernetes.io/version: 0.162.0
    helm.sh/chart: opentelemetry-operator-0.129.0
  name: opentelemetry-operator-serving-cert
  namespace: o11y-agent-system
spec:
  dnsNames:
  - opentelemetry-operator-webhook.o11y-agent-system.svc
  - opentelemetry-operator-webhook.o11y-agent-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: opentelemetry-operator-selfsigned-issuer
  secretName: opentelemetry-operator-controller-manager-service-cert
  subject:
    organizationalUnits:
    - opentelemetry-operator

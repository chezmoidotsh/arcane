---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Newt to access the Grafana application.
  labels:
    app.kubernetes.io/name: newt
  name: allow-newt-to-grafana
  namespace: newt-system
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: grafana
        io.kubernetes.pod.namespace: o11y-system
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: newt

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    argocd.argoproj.io/description: |
      Cilium Gateway API gateway for rhodes.akn's VLAN5-facing ingress plane. Gets its
      LoadBalancer IP from the "external" CiliumLoadBalancerIPPool — the catch-all default (no
      Service/Gateway needs to opt in), reachable from the home network. See docs/network/ipam.md
      "Cilium LoadBalancer Pools" and "Internal LoadBalancer Pools (talosnet)" for the "internal"
      counterpart. Labeled external-dns.chezmoi.sh/zone=external so external-dns-unifi's
      --gateway-label-filter picks it up as a valid parent for any HTTPRoute attached here,
      regardless of whether that route is also attached to "internal".
  name: external
  namespace: ingress-gateway-system
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      external-dns.chezmoi.sh/zone: external
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: web
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.chezmoi.sh'
    name: chezmoi.sh-websecure
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard.chezmoi.sh-certificate
      mode: Terminate
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.akn.chezmoi.sh'
    name: akn.chezmoi.sh-websecure
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard.chezmoi.sh-certificate
      mode: Terminate

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  # Configure ArgoCD
  - appprojects.yaml
  - main.httproute.yaml
  - oidc-credentials.externalsecret.yaml
  - security/

  # TODO(rhodes.akn): no Tailscale for now — Argotails (remote-cluster
  # Tailscale device discovery) and its addon:tailscale.yaml Helm overlay are
  # dropped. ArgoCD is reachable via main.httproute.yaml (Cilium Gateway,
  # argocd.akn.chezmoi.sh) regardless. Re-add Argotails + the tailscale addon
  # (see amiya.akn's kustomization.yaml history) once Tailscale returns.

helmCharts:
  - repo: https://argoproj.github.io/argo-helm
    name: argo-cd
    # oripathy: type=helm upstream=github.com/argoproj/argo-cd tagPrefix=v
    version: 10.11.1

    releaseName: argocd
    namespace: argocd

    valuesFile: helmvalues/default.yaml
    additionalValuesFiles:
      - helmvalues/hardened.yaml
      - helmvalues/addon:ksops.yaml

images:
  - name: oci.chezmoi.sh/quay.io/argoproj/argocd
    # oripathy: type=oci upstream=github.com/argoproj/argo-cd tagPrefix=v digest=false
    newTag: v3.5.6
  - name: oci.chezmoi.sh/ecr-public.aws.com/docker/library/redis
    # oripathy: type=oci upstream=github.com/redis/redis digest=false
    newTag: 8.10.2-alpine

patches:
  # Log formats of the pods (ADR-020).
  - target: {kind: Deployment, name: argocd-applicationset-controller}
    patch: |-
      kind: Deployment
      metadata: {name: argocd-applicationset-controller}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}
  - target: {kind: Deployment, name: argocd-notifications-controller}
    patch: |-
      kind: Deployment
      metadata: {name: argocd-notifications-controller}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: json}}}}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |-
      kind: Deployment
      metadata: {name: argocd-redis}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: redis}}}}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      kind: Deployment
      metadata: {name: argocd-repo-server}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}
  - target: {kind: Deployment, name: argocd-server}
    patch: |-
      kind: Deployment
      metadata: {name: argocd-server}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      kind: StatefulSet
      metadata: {name: argocd-application-controller}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}
  - target: {kind: Job, name: argocd-redis-secret-init}
    patch: |-
      kind: Job
      metadata: {name: argocd-redis-secret-init}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the ArgoCD server to reach Pocket-ID OIDC endpoints at auth.chezmoi.sh, for the SSO
      login configured in configs.cm.oidc.config. Uses the "ingress" entity (traffic proxied by
      Cilium Gateway API carries the reserved:ingress identity) rather than toFQDNs: the internal
      Gateway's LB IP is shared by every *.chezmoi.sh hostname, and Cilium's ipcache assigns one
      fqdn identity per IP cluster-wide -- whichever toFQDNs rule claims that IP first wins,
      silently denying every other policy trying to reach the same IP under a different hostname
      (e.g. external-secrets reaching vault.chezmoi.sh).
  name: allow-argocd-to-pocket-id
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  egress:
    - toEntities:
        - ingress

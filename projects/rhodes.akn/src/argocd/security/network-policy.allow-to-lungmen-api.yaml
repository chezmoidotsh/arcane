apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the ArgoCD application-controller and server to reach lungmen.akn's Kubernetes API:
      the controller for reconciling the lungmen.akn spoke cluster registration, the server for
      on-demand resource actions (view/delete/etc.) triggered from the UI. Uses a toCIDR rule for
      the talosnet bridge IP rather than the kubernetes.lungmen.akn.chezmoi.sh DNS name (VLAN 2),
      which stays unreachable from rhodes independently of this bridge — same reasoning as
      vault's allow-to-lungmen-api policy, see MIGR-20260801-00.
  name: allow-argocd-to-lungmen-api
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-application-controller
          - argocd-server
  egress:
    - toCIDR:
        - 10.128.0.20/32 # temporary — talosnet bridge, see MIGR-20260801-00. Revert to
        # kubernetes.lungmen.akn.chezmoi.sh once lungmen's DNS cutover lands
        # (issue 1188, PR3)
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

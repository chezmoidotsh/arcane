---
# The upstream plugin-barman-cloud manifest bakes its own SIDECAR_IMAGE secret with a
# fixed upstream reference (ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar-testing).
# The kustomize images: transformer can't reach this -- it only rewrites container image:
# fields, not Secret data values -- so this patch overrides it directly. stringData takes
# precedence over the existing data.SIDECAR_IMAGE at apply time (Kubernetes API behavior),
# no need to touch the base64-encoded value.
# renovate: datasource=docker depName=ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar-testing
apiVersion: v1
kind: Secret
metadata:
  name: plugin-barman-cloud-8tfddg42gf
  namespace: cnpg-system
stringData:
  SIDECAR_IMAGE: oci.chezmoi.sh/ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar-testing:main

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Cluster-wide baseline granting every pod (in every namespace) DNS resolution (egress to
      CoreDNS in kube-system) and reachability from the Cilium Gateway API (ingress carrying
      the reserved:ingress identity — see
      https://docs.cilium.io/en/stable/security/policy/layer3/#entities-based). Apps still need
      their own CiliumNetworkPolicy to open the specific port(s) they actually serve; this
      policy only ensures the identity/DNS plumbing is never the reason a hardened namespace
      can't be reached through the gateway or can't resolve names.

      kube-system pods (Cilium itself, CoreDNS, Proxmox CCM/CSI) are also selected by this
      policy (endpointSelector: {} matches every pod cluster-wide), which would otherwise put
      them into default-deny for both directions with only DNS+ingress-gateway allowed —
      breaking CoreDNS's own ingress and Cilium's/Proxmox's much broader connectivity needs.
      network-policy.allow-kube-system-full.yaml keeps kube-system unrestricted.

      endpointSelector: {} also matches Cilium's own per-node `reserved:health` endpoint (used
      for inter-agent connectivity health checks on port 4240, both TCP and ICMP) — it is a real
      Cilium-managed endpoint, not a namespaced pod, so allow-kube-system-full's namespace-scoped
      selector never covers it. Without the fromEntities/toEntities rule below, every node pair's
      health check is dropped in both directions, which `cilium status` surfaces as failing
      cluster connectivity health.
  name: allow-dns-and-ingress-gateway
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - remote-node
        - health
  ingress:
    - fromEntities:
        - ingress
    - fromEntities:
        - remote-node
        - health

---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Cluster-wide baseline granting every real workload pod (in every namespace) DNS resolution
      (egress to CoreDNS in kube-system) and reachability from the Cilium Gateway API (ingress
      carrying the reserved:ingress identity — see
      https://docs.cilium.io/en/stable/security/policy/layer3/#entities-based). Apps still need
      their own CiliumNetworkPolicy to open the specific port(s) they actually serve; this
      policy only ensures the identity/DNS plumbing is never the reason a hardened namespace
      can't be reached through the gateway or can't resolve names.

      endpointSelector deliberately requires io.kubernetes.pod.namespace to exist, restricting
      this policy to real namespaced pods only — NOT `endpointSelector: {}`. An empty selector
      also matches Cilium's own reserved/special identities (reserved:ingress, reserved:health,
      etc., which have no namespace label). Once ANY user policy matches reserved:ingress at all,
      Cilium's own Gateway API request handling breaks: every Gateway-proxied HTTP request gets
      a bare 403 "Access denied" from Envoy, regardless of what the matching rule's content
      actually is (confirmed empirically during a rhodes.akn DR drill, 2026-07-28 — even a
      selector-only, rule-less match on reserved:ingress was enough to reproduce it). Scoping the
      selector to only match pods with a namespace label avoids touching reserved:ingress (or
      reserved:health) at all.

      kube-system pods (Cilium itself, CoreDNS, Proxmox CCM/CSI) are also selected by this
      policy's DNS/ingress rules, which would otherwise put them into default-deny for both
      directions with only DNS+ingress-gateway allowed — breaking CoreDNS's own ingress and
      Cilium's/Proxmox's much broader connectivity needs.
      network-policy.allow-kube-system-full.yaml keeps kube-system unrestricted.

      The previous version also carried an explicit fromEntities/toEntities rule for
      remote-node/health, on the assumption that reserved:health (Cilium's own per-node
      connectivity health-check endpoint) would otherwise be default-denied by this same
      endpointSelector: {} match. Verified during the same drill that removing it entirely does
      not affect `cilium status`/`cilium-health status` (stayed 3/3 reachable throughout) — this
      cluster's Cilium version does not require an explicit allow for that reserved identity, and
      keeping the rule would just re-introduce the same reserved-identity-matching problem this
      fix addresses. Dropped rather than kept "to be safe".
  name: allow-dns-and-ingress-gateway
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
  ingress:
    - fromEntities:
        - ingress

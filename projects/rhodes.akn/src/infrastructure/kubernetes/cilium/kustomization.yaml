---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Gateway API core CRDs (GatewayClass, Gateway, HTTPRoute, TCPRoute, ...) — Cilium's chart doesn't
  # bundle these.
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml

  - default.l2announcementpolicy.yaml
  - external.ippool.yaml
  - internal.ippool.yaml
  - security/

  # Gateway/HTTPRoute/Certificate live here, not in their own component, because Cilium's Gateway
  # API implementation has no separate per-Gateway pod: traffic is proxied by the same
  # Envoy embedded in cilium-agent (envoy.enabled), which ships as part of this Helm release and is
  # therefore stuck in this release's namespace (kube-system) — there's no chart value to move it.
  - external.gateway.yaml
  - internal.gateway.yaml
  - redirect-http-to-https.httproute.yaml
  - wildcard.chezmoi.sh.certificate.yaml

helmCharts:
  - repo: https://helm.cilium.io/
    name: cilium
    # oripathy: type=helm upstream=github.com/cilium/cilium tagPrefix=v
    version: 1.20.4

    releaseName: cilium
    namespace: kube-system

    valuesFile: helmvalues/default.yaml

patches:
  # Log formats of the pods (ADR-020).
  - target: {kind: DaemonSet, name: cilium-envoy}
    patch: |-
      kind: DaemonSet
      metadata: {name: cilium-envoy}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: bracketed}}}}
  - target: {kind: Deployment, name: cilium-operator}
    patch: |-
      kind: Deployment
      metadata: {name: cilium-operator}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}
  - target: {kind: Deployment, name: hubble-relay}
    patch: |-
      kind: Deployment
      metadata: {name: hubble-relay}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}
  - target: {kind: Deployment, name: hubble-ui}
    patch: |-
      kind: Deployment
      metadata: {name: hubble-ui}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt, o11y.chezmoi.sh/log-format.frontend: none}}}}
  - target: {kind: CronJob, name: hubble-generate-certs}
    patch: |-
      kind: CronJob
      metadata: {name: hubble-generate-certs}
      spec: {jobTemplate: {spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}}}
  - target: {kind: Job, name: hubble-generate-certs-df446b0717}
    patch: |-
      kind: Job
      metadata: {name: hubble-generate-certs-df446b0717}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: logfmt}}}}

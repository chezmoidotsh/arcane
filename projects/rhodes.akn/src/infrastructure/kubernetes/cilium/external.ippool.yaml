apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: external
spec:
  # No serviceSelector: this is the catch-all default. Any Service/Gateway that doesn't
  # explicitly opt into "internal" (see internal.ippool.yaml) lands here automatically.
  blocks:
    - cidr: 10.0.0.64/29 # 6 allowed IPs (10.0.0.65 - 10.0.0.70) — docs/network/ipam.md "Cilium LoadBalancer Pools"

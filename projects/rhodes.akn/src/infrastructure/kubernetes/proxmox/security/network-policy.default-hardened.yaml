---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Default hardened network policy for the proxmox-system namespace that implements a secure
      baseline by denying all traffic except explicitly allowed connections. Permits
      intra-namespace communication and DNS resolution to kube-system, while blocking all other
      traffic by default. Access to the Kubernetes API and the Proxmox VE API is granted by the
      other policies in this directory, not here.
  name: default-hardened
  namespace: proxmox-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: proxmox-system
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: proxmox-system

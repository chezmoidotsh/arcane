---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets-system

helmCharts:
  - repo: https://charts.external-secrets.io/
    name: external-secrets
    # oripathy: type=helm upstream=github.com/external-secrets/external-secrets tagPrefix=v
    version: 2.14.0

    releaseName: external-secrets
    namespace: external-secrets-system

    valuesFile: ../../../../../../catalog/kubernetes/external-secrets/helm/default.helmvalues.yaml
    additionalValuesFiles:
      - ../../../../../../catalog/kubernetes/external-secrets/helm/hardened.helmvalues.yaml

resources:
  - ../../../../../../catalog/kubernetes/external-secrets/kustomize
  - security/

patches:
  - patch: |-
      - op: add
        path: /spec/provider/vault/auth/kubernetes/mountPath
        value: rhodes.akn
      - op: add
        path: /spec/provider/vault/auth/kubernetes/role
        value: rhodes.akn-eso-role
    target:
      kind: ClusterSecretStore
      name: vault.chezmoi.sh

images:
  - name: oci.external-secrets.io/external-secrets/external-secrets
    newName: oci.chezmoi.sh/oci.external-secrets.io/external-secrets/external-secrets
  # chart >= 2.x pulls from ghcr.io instead of oci.external-secrets.io
  - name: ghcr.io/external-secrets/external-secrets
    newName: oci.chezmoi.sh/ghcr.io/external-secrets/external-secrets
    # oripathy: type=oci upstream=github.com/external-secrets/external-secrets tagPrefix=v digest=false
    newTag: v2.14.0

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Lets every external-secrets component (controller, cert-controller, webhook) reach the
      Kubernetes API. Scoped to app.kubernetes.io/instance, not app.kubernetes.io/name — the three
      components each have a different name value, so a name-based selector only ever covered the
      main controller and left cert-controller/webhook silently unable to reach the API.
  name: allow-external-secrets-to-kubernetes-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  egress:
    - toEntities:
        - kube-apiserver

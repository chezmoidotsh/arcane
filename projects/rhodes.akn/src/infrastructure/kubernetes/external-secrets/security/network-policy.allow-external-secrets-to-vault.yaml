apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows external-secrets to reach OpenBao (vault.chezmoi.sh) for Kubernetes-auth login.
      Uses "cluster", not "ingress": toEntities:ingress on egress breaks Cilium's Gateway API
      hairpin routing (pod reaching its own cluster's Gateway VIP), causing an unconditional
      403 from Envoy regardless of policy content elsewhere.
  name: allow-external-secrets-to-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toEntities:
        - cluster

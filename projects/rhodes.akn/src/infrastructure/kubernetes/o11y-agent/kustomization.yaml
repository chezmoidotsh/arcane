---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: o11y-agent-system

helmCharts:
  - repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    name: opentelemetry-operator
    # oripathy: type=helm upstream=github.com/open-telemetry/opentelemetry-helm-charts tagPrefix=opentelemetry-operator-
    version: 0.129.0
    releaseName: opentelemetry-operator
    namespace: o11y-agent-system
    skipTests: true
    valuesFile: ../../../../../../catalog/kubernetes/o11y-agent/helm/opentelemetry-operator.helmvalues.yaml

  # ServiceMonitor/PodMonitor/Probe/ScrapeConfig CRDs only (no
  # prometheus-operator): consumed by the Target Allocator.
  - repo: https://prometheus-community.github.io/helm-charts
    name: prometheus-operator-crds
    # oripathy: type=helm upstream=github.com/prometheus-community/helm-charts tagPrefix=prometheus-operator-crds-
    version: 33.0.2
    releaseName: prometheus-operator-crds
    namespace: o11y-agent-system
    valuesInline:
      crds:
        alertmanagerconfigs: { enabled: false }
        alertmanagers: { enabled: false }
        prometheusagents: { enabled: false }
        prometheuses: { enabled: false }
        prometheusrules: { enabled: false }
        thanosrulers: { enabled: false }

resources:
  - ../../../../../../catalog/kubernetes/o11y-agent/kustomize

patches:
  - target:
      group: opentelemetry.io
      kind: OpenTelemetryCollector
    patch: |-
      - op: replace
        path: /spec/env/0
        value:
          name: K8S_CLUSTER_NAME
          value: rhodes.akn

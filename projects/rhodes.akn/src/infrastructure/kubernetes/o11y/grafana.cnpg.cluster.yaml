---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: grafana-database
  name: grafana-database
spec:
  # Fresh instance -- unlike pocket-id/vault, Grafana never lived on amiya.akn,
  # so this bootstraps from scratch rather than recovering from a backup. Moving
  # Grafana off its default embedded SQLite (which has no persistent volume on
  # this deployment -- every pod restart wipes users/dashboards) is the whole
  # point of this Cluster.
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      # Gives initdb the owner role's password directly, instead of declaring
      # "grafana" a second time under managed.roles -- CNPG docs: managed.roles
      # takes precedence over an initdb-created role of the same name, but in
      # practice (confirmed live) that reconciliation never actually applied
      # the password because the Secret didn't exist yet at the cluster's
      # first bootstrap. This field is CNPG's documented, initdb-time way to
      # set it once, correctly, with no separate reconciler in the loop.
      secret:
        name: grafana-database-credentials
  description: PostgreSQL database dedicated to Grafana
  enablePDB: false
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: default
    major: 18
  instances: 1
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: selfhosted
        serverName: grafana-database
  postgresql:
    parameters:
      # Limit WAL retention to avoid DB crash due to storage bloat
      max_slot_wal_keep_size: 900MB
      max_wal_size: 100MB
  storage:
    size: 250Mi
  walStorage:
    size: 1Gi

---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  # The admin credentials come from our own ExternalSecret (grafana-admin-credentials,
  # sourced from Vault), not the operator's own auto-generated one -- both want to own
  # a Secret of that same name otherwise, which the operator refuses (already owned by
  # another controller).
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: https://o11y.chezmoi.sh
    database:
      # Moves Grafana off its default embedded SQLite -- this deployment has no
      # persistent volume, so every pod restart previously wiped all users,
      # datasources, and dashboards. GF_DATABASE_PASSWORD (below) supplies the
      # password; this section only holds non-secret connection settings.
      type: postgres
      host: grafana-database-rw:5432
      name: grafana
      user: grafana
      ssl_mode: disable
    users:
      # The OIDC client is already group-restricted to the admin group (see
      # stack/pocket-id/grafana.ts) -- anyone who can log in at all is meant
      # to be an admin. role_attribute_path: "'Admin'" (a JMESPath raw-string
      # literal) did not produce that in practice -- the first-ever login
      # still landed as Viewer despite the config rendering correctly on
      # disk -- so auto_assign_org_role is used instead, which needs no
      # claims evaluation at all.
      auto_assign_org_role: Admin
    auth.generic_oauth:
      enabled: "true"
      name: Pocket ID
      auth_url: https://auth.chezmoi.sh/authorize
      token_url: https://auth.chezmoi.sh/api/oidc/token
      api_url: https://auth.chezmoi.sh/api/oidc/userinfo
      scopes: openid profile email
      use_pkce: "true"
      allow_sign_up: "true"
    feature_toggles:
      # Required for the Advisor app plugin (grafana-advisor-app) below -- it's gated
      # behind this toggle even when the plugin itself is installed.
      enable: grafanaAdvisor
  deployment:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          # The hardened default pod securityContext (runAsUser/runAsGroup 10001) means a
          # freshly-provisioned PVC mounts root-owned -- fsGroup chowns it to the container's
          # group at mount time so the plugin installer can actually write to it.
          securityContext:
            fsGroup: 10001
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-oidc-client
              volumeMounts:
                - name: plugins
                  mountPath: /var/lib/grafana/plugins
              # GF_SECURITY_ADMIN_USER/_PASSWORD must be named `env:` entries, not
              # bulk-imported via envFrom: the operator's own API client (used to
              # provision GrafanaDatasource/GrafanaDashboard) reads admin
              # credentials straight off the container's env list by name -- it
              # never looks inside envFrom-referenced secrets, so those would
              # otherwise resolve to an empty user/password and every API call
              # fails with "ensure connectivity and valid credentials".
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-database-credentials
                      key: password
                # All plugins below are Grafana community-signed, so no
                # GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS override is needed. Versions
                # are pinned to what was verified compatible with the deployed Grafana
                # (13.0.1) at evaluation time -- bump deliberately, not blindly.
                #
                # This env entry replaces, not merges with, whatever the operator would
                # otherwise generate here from GrafanaDatasource/GrafanaDashboard
                # spec.plugins declarations (e.g. victoriametrics-logs-datasource,
                # required by datasources/grafana.datasource.victorialogs.yaml) -- any
                # plugin required by a datasource/dashboard CR must also be listed here
                # explicitly, or that CR's plugin silently goes missing at runtime.
                #
                # grafana-assistant-app is intentionally left out for now: it routes
                # through Grafana Cloud's own LLM billing, not the OpenRouter key
                # configured on grafana-llm-app, so there's no visibility/control over
                # its token consumption. Re-add "grafana-assistant-app 2.0.46" below
                # once that's addressed.
                - name: GF_INSTALL_PLUGINS
                  value: >-
                    taminomara-hostoverview-panel 1.2.0,
                    digrich-bubblechart-panel 2.0.1,
                    tim012432-calendarheatmap-panel 1.1.1,
                    zestairlove-compacthostmap-panel 0.9.2,
                    hpehpc-grafanaclusterview-panel 1.3.2,
                    vaduga-mapgl-panel 2.9.0,
                    boazreicher-mosaicplot-panel 1.0.18,
                    nikosc-percenttrend-panel 1.0.8,
                    novatec-sdg-panel 4.2.0,
                    grafana-advisor-app 1.0.2,
                    grafana-llm-app 1.0.8,
                    victoriametrics-logs-datasource 0.31.0
          volumes:
            - name: plugins
              persistentVolumeClaim:
                claimName: grafana-plugins

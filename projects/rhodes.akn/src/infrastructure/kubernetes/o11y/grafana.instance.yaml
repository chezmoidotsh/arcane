---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  # The admin credentials come from our own ExternalSecret (grafana-admin-credentials,
  # sourced from Vault), not the operator's own auto-generated one -- both want to own
  # a Secret of that same name otherwise, which the operator refuses (already owned by
  # another controller).
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: https://o11y.chezmoi.sh
    database:
      # Moves Grafana off its default embedded SQLite -- this deployment has no
      # persistent volume, so every pod restart previously wiped all users,
      # datasources, and dashboards. GF_DATABASE_PASSWORD (below) supplies the
      # password; this section only holds non-secret connection settings.
      type: postgres
      host: grafana-database-rw:5432
      name: grafana
      user: grafana
      ssl_mode: disable
    users:
      # The OIDC client is already group-restricted to the admin group (see
      # stack/pocket-id/grafana.ts) -- anyone who can log in at all is meant
      # to be an admin. role_attribute_path: "'Admin'" (a JMESPath raw-string
      # literal) did not produce that in practice -- the first-ever login
      # still landed as Viewer despite the config rendering correctly on
      # disk -- so auto_assign_org_role is used instead, which needs no
      # claims evaluation at all.
      auto_assign_org_role: Admin
    auth.generic_oauth:
      enabled: "true"
      name: Pocket ID
      auth_url: https://auth.chezmoi.sh/authorize
      token_url: https://auth.chezmoi.sh/api/oidc/token
      api_url: https://auth.chezmoi.sh/api/oidc/userinfo
      scopes: openid profile email
      use_pkce: "true"
      allow_sign_up: "true"
  deployment:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-oidc-client
              # GF_SECURITY_ADMIN_USER/_PASSWORD must be named `env:` entries, not
              # bulk-imported via envFrom: the operator's own API client (used to
              # provision GrafanaDatasource/GrafanaDashboard) reads admin
              # credentials straight off the container's env list by name -- it
              # never looks inside envFrom-referenced secrets, so those would
              # otherwise resolve to an empty user/password and every API call
              # fails with "ensure connectivity and valid credentials".
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-database-credentials
                      key: password

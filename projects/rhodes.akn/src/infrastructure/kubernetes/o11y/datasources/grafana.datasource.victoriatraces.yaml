---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriatraces
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoriatraces-tempo
  datasource:
    name: VictoriaTraces
    # VictoriaTraces implements the Tempo HTTP API (min version v0.9.4,
    # confirmed live) -- gives TraceQL and the Grafana Traces Drilldown plugin,
    # which the plain Jaeger API doesn't support. VictoriaLogs links its
    # trace_id field to this datasource via a plain derivedFields entry
    # (grafana.datasource.victorialogs.yaml), not the OTel preset's own
    # trace-link (Jaeger-only).
    type: tempo
    access: proxy
    url: https://data.o11y.chezmoi.sh/traces/select/tempo
    editable: false

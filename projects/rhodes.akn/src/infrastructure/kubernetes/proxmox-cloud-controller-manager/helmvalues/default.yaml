---
# proxmox-cloud-controller-manager — provides node topology labels and
# providerID that proxmox-csi-plugin relies on for volume scheduling.
# Cilium handles all networking (route/service controllers stay disabled).
# Validated in docs/experiments/20260617-proxmox-csi-ccm/.

config:
  clusters:
    - url: https://pve-01.pve.chezmoi.sh:8006/api2/json
      token_id: "kubernetes-ccm@pve!ccm"
      # TODO(rhodes.akn): token_secret is intentionally left blank here.
      # Per issue #370's bring-up plan, this token is Pulumi-owned end-to-end
      # (Pulumi already needs privileged kubeconfig access to deliver it, so
      # routing it through Vault/ESO would add indirection with no
      # confidentiality benefit — see
      # .agents/sessions/20260720-rhodes-cluster-bringup-planning.md decision
      # #1). CONCRETE GAP: this chart bakes `config.clusters` into its own
      # Secret/<release-name> at Helm-render time (verified: `kustomize build
      # --enable-helm` produces a Secret with token_secret="" baked in) — so
      # setting this value here has no effect once Pulumi is supposed to own
      # it. Resolving this (Pulumi taking ownership of that Secret object
      # without ArgoCD fighting it back to the git-rendered empty value, or
      # excluding it from the rendered output) is exactly what PR#2/PR#5 of
      # the bring-up plan need to land — not solved by this file alone.
      token_secret: ""
      region: homelab

enabledControllers:
  - cloud-node
  - cloud-node-lifecycle

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: node.cloudprovider.kubernetes.io/uninitialized
    operator: Exists

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the external-dns-unifi controller to access the Kubernetes API server to watch
      Services, Ingresses and Gateway API routes for DNS record management.
  name: allow-external-dns-to-kubernetes-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: external-dns-unifi
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # Allow access to API server via host network (common in Talos)
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

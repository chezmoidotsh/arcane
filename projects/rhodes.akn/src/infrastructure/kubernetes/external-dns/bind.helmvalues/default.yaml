# ExternalDNS configuration for the talosnet-dns BIND server (RFC2136/TSIG)
# This configuration sets up ExternalDNS to manage A/TXT records anywhere in the
# chezmoi.sh zone that talosnet-dns serves -- used for split-horizon: the same
# *.chezmoi.sh hostname a cluster already has externally, resolved here to its
# internal (talosnet-only) Gateway IP instead. Scoped to Services/Gateways that
# opt in via the external-dns.alpha.kubernetes.io/zone=internal annotation.

---
# Kubernetes resource kinds ExternalDNS watches for DNS record management.
sources:
  - crd
  - gateway-grpcroute
  - gateway-httproute
  - gateway-tcproute
  - gateway-tlsroute
  - gateway-udproute
  - ingress
  - service

# Distinguishes this instance's TXT ownership records from any other
# external-dns instance/cluster writing into the same zone.
txtOwnerId: external-dns.rhodesakn

rbac:
  create: true
serviceAccount:
  create: true
  name: external-dns-bind

# sync (not upsert-only/create-only): ExternalDNS also deletes records for
# resources that disappear from the cluster.
policy: sync

# Provider configuration -- rfc2136 is a native provider (no webhook sidecar).
# The TSIG secret is injected via env instead of extraArgs, to keep it out of
# the pod spec / process arguments.
provider:
  name: rfc2136

env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: external-dns-bind-secret
        key: tsig-secret

# Kept to host + ownership records only. Broadening this list widens what
# ExternalDNS is authorized to write into the zone without a concrete need
# for it -- the update-policy grant (bind.nix) is scoped to A/TXT for the
# same reason.
managedRecordTypes:
  - A
  - TXT

extraArgs:
  - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
  - --crd-source-kind=DNSEndpoint
  # Only allow objects using external-dns.alpha.kubernetes.io/zone=internal annotation
  - --annotation-filter=external-dns.alpha.kubernetes.io/zone in (internal)
  # talosnet-dns (10.128.0.3) serves chezmoi.sh. The update-policy grant
  # (catalog/proxmox/lxc/talosnet-dns/modules/bind.nix) lets this key update
  # A/TXT records anywhere in the zone -- record type, not name, is what
  # bounds this key's blast radius; it still can't touch NS/SOA/MX/etc.
  # --rfc2136-zone must be the real zone BIND serves (chezmoi.sh); it's what
  # ExternalDNS puts in the `zone` field of every UPDATE/AXFR it sends --
  - --rfc2136-host=10.128.0.3
  - --rfc2136-port=53
  - --rfc2136-zone=chezmoi.sh
  - --rfc2136-tsig-keyname=external-dns.
  - --rfc2136-tsig-secret-alg=hmac-sha256
  # The zone's allow-transfer requires the same TSIG key for AXFR (not just
  # updates) -- without this flag ExternalDNS's pre-sync zone read is
  # unsigned and BIND rejects it.
  - --rfc2136-tsig-axfr

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns-system

generators:
  - |-
    apiVersion: viaduct.ai/v1
    kind: ksops
    metadata:
      name: sopsed-secrets-generator
      annotations:
        config.kubernetes.io/function: |
          exec:
            path: ksops
    files:
      - bind.secret.yaml

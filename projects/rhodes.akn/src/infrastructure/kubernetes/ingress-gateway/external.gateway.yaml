---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    argocd.argoproj.io/description: |
      Cilium Gateway API gateway for rhodes.akn's VLAN5-facing ingress plane. Gets its
      LoadBalancer IP from the "external" CiliumLoadBalancerIPPool — the catch-all default (no
      Service/Gateway needs to opt in), reachable from the home network. See docs/network/ipam.md
      "Cilium LoadBalancer Pools" and "Internal LoadBalancer Pools (talosnet)" for the "internal"
      counterpart.
spec:
  gatewayClassName: cilium
  listeners:
    - name: web
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: chezmoi.sh-websecure
      port: 443
      protocol: HTTPS
      hostname: "*.chezmoi.sh"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard.chezmoi.sh-certificate
    - name: akn.chezmoi.sh-websecure
      port: 443
      protocol: HTTPS
      hostname: "*.akn.chezmoi.sh"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard.chezmoi.sh-certificate

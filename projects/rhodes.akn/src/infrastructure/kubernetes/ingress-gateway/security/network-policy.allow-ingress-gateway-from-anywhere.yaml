apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Cilium-managed Envoy proxy backing any Gateway in this namespace to receive
      traffic on HTTP/80 and HTTPS/443, regardless of source identity. Actual reachability is
      bounded upstream of this policy by which CiliumLoadBalancerIPPool/interface each Gateway's
      LB IP comes from: "external" gets a VLAN5 IP (reachable from the home network), "internal"
      gets a talosnet-only IP (reachable only from other Talos nodes/SDN-attached hosts) — see
      docs/network/ipam.md "Internal LoadBalancer Pools (talosnet)".
  name: allow-ingress-gateway-from-anywhere
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP

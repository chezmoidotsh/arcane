# =============================================================================
# rhodes.akn Pulumi stack - Mise configuration
# =============================================================================
# Cloud + Vault/OpenBao infrastructure for rhodes.akn, managed as a Pulumi stack
# (state in the Garage S3 backend, see Pulumi.yaml).
#
# `[env] _.file` loads PULUMI_STACK and PULUMI_CONFIG_PASSPHRASE from
# .mise/env.yaml — SOPS-encrypted, transparently decrypted by mise using the
# already-configured age key. This is what lets `pulumi` commands run in this
# directory without prompting for a stack name or a passphrase.
# =============================================================================

[tools]
node = "24"

[env]
_.file = "{{ config_root }}/.mise/env.yaml"

# No `--refresh` here: @axnic/pulumi-pocket-id cannot read an OIDC client logo
# back, so a refresh returns an empty asset for it and the Pulumi Node SDK
# fails with "Invalid asset encountered when unmarshaling resource property".
# Re-add `--refresh` once the provider keeps the asset on refresh.
[tasks."pulumi:diff"]
description = "Preview pending changes for the current Pulumi stack"
run = "pulumi preview --parallel 15"
dir = "{{ config_root }}"

[tasks."pulumi:apply"]
description = "Apply pending changes to the current Pulumi stack"
run = ["pulumi up --parallel 15"]
dir = "{{ config_root }}"

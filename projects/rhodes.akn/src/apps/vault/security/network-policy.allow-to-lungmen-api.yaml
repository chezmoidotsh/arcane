apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows OpenBao to reach the lungmen.akn Kubernetes API server for Kubernetes
      auth TokenReview validation. Required when ESO on lungmen.akn authenticates
      to OpenBao via the auth/lungmen.akn backend.
  name: allow-openbao-to-lungmen-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  egress:
    - toCIDR:
        - 10.128.0.19/32 # temporary — talosnet bridge, see MIGR-20260801-00. Revert to
        # the toFQDNs rule (kubernetes.lungmen.akn.chezmoi.sh) once lungmen is
        # recreated under #1072
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

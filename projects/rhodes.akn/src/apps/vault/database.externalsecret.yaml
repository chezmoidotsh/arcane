---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openbao-database-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    external-secrets.io/description: |
      Generates OpenBao's own CNPG role password locally — no Vault dependency,
      since OpenBao's storage backend IS this Postgres cluster (it can't fetch
      its own credentials from Vault). refreshInterval: "0" means generate once;
      CNPG reconciles the managed role's password whenever this Secret changes.
    cnpg.io/description: PostgreSQL credentials for openbao-database
  name: openbao-database-credentials
spec:
  refreshInterval: "0"
  target:
    name: openbao-database-credentials
    template:
      engineVersion: v2
      data:
        username: openbao
        password: "{{ .password }}"
        # NOTE: hostname tracks cnpg.cluster.yaml's metadata.name
        # (openbao-database, no generation suffix yet). Update alongside
        # cnpg.scheduledbackup.yaml's spec.cluster.name if this cluster is
        # ever recreated with a new name — same manual follow-up
        # patch-recovery-source already calls out for that file.
        uri: postgresql://openbao:{{ .password }}@openbao-database-rw:5432/openbao
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: openbao-database-password

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault

labels:
  - pairs:
      app.kubernetes.io/name: vault
    includeTemplates: true
    includeSelectors: true

resources:
  - config.externalsecret.yaml
  - database.externalsecret.yaml
  - main.httproute.yaml
  # TODO(rhodes.akn): no Tailscale for now — an ingress.yaml (Tailscale
  # ingressClass) was dropped. main.httproute.yaml (Cilium Gateway,
  # vault.chezmoi.sh) covers non-Tailscale access.
  - cnpg.cluster.yaml
  - cnpg.objectstore.amiya-akn.yaml
  - cnpg.objectstore.yaml
  - cnpg.scheduledbackup.yaml
  - secretstore.yaml
  - security/

helmCharts:
  - repo: https://openbao.github.io/openbao-helm
    name: openbao
    version: 0.28.3

    releaseName: openbao
    namespace: vault

    valuesFile: openbao.helmvalues/default.yaml

patches:
  - patch: |
      # Use the configuration generated by ESO with some secrets mounted
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: config
          secret:
            defaultMode: 420
            secretName: openbao-config

      # Add the HSM secrets volume containing the tokens
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: hsm-secrets
          secret:
            defaultMode: 420
            secretName: openbao-softhsm-tokens
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: hsm-secrets
          mountPath: /run/secrets/softhsm2
          readOnly: true

      # Add the HSM writable volume where the tokens will be written to
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: hsm-writable
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: hsm-writable
          mountPath: /run/secrets/openbao/pkcs11
    target:
      kind: StatefulSet
      name: openbao

images:
  - name: ghcr.io/chezmoidotsh/flakes/openbao/openbao-softhsm
    newName: oci.chezmoi.sh/ghcr.io/chezmoidotsh/flakes/openbao/openbao-softhsm

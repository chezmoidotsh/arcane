apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: o11y

helmCharts:
  - repo: https://grafana.github.io/helm-charts
    name: grafana-operator
    # oripathy: type=helm upstream=github.com/grafana/grafana-operator tagPrefix=v
    version: v5.25.0
    releaseName: grafana-operator
    namespace: o11y
    valuesFile: ../../../../../catalog/kubernetes/o11y/helm/grafana/default.helmvalues.yaml
  - repo: oci://ghcr.io/reliablyobserve/charts
    name: loki-vl-proxy
    # oripathy: type=helm upstream=github.com/ReliablyObserve/Loki-VL-proxy tagPrefix=v
    version: 2.170.0
    releaseName: loki-vl-proxy
    namespace: o11y
    valuesFile: loki-vl-proxy.helmvalues/default.yaml
    skipTests: true

resources:
  - security/
  - grafana.instance.yaml
  - grafana.plugins.persistentvolumeclaim.yaml
  - grafana.oidc.externalsecret.yaml
  - grafana.admin-credentials.externalsecret.yaml
  - grafana.database.externalsecret.yaml
  - grafana.cnpg.objectstore.yaml
  - grafana.cnpg.cluster.yaml
  - grafana.cnpg.scheduledbackup.yaml
  - grafana.main.httproute.yaml
  - loki-vl-proxy.envoy.configmap.yaml
  - datasources/
  - dashboards/

images:
  - name: ghcr.io/grafana/grafana-operator
    newName: oci.chezmoi.sh/ghcr.io/grafana/grafana-operator
    # oripathy: type=oci upstream=github.com/grafana/grafana-operator tagPrefix=v digest=false
    newTag: v5.25.0
  - name: docker.io/grafana/grafana
    newName: oci.chezmoi.sh/docker.io/grafana/grafana
  - name: ghcr.io/reliablyobserve/loki-vl-proxy
    newName: oci.chezmoi.sh/ghcr.io/reliablyobserve/loki-vl-proxy
    # oripathy: type=oci upstream=github.com/ReliablyObserve/Loki-VL-proxy tagPrefix=v digest=false
    newTag: 2.170.0
  - name: docker.io/envoyproxy/envoy
    newName: oci.chezmoi.sh/docker.io/envoyproxy/envoy
    # oripathy: type=oci upstream=github.com/envoyproxy/envoy tagPrefix=v digest=false
    newTag: v1.40.2

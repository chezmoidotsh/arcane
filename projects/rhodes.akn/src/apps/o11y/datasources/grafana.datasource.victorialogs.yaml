---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  # Renamed from `victorialogs` to set spec.uid (immutable once created), which
  # VictoriaTraces' tracesToLogsV2 points at.
  name: victoriametrics-logs
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victorialogs
  plugins:
    - name: victoriametrics-logs-datasource
      version: 0.34.0
  datasource:
    name: VictoriaLogs
    # Query path confirmed live against the deployed VictoriaLogs version before
    # this datasource is considered done -- see the o11y LXC README's "Known
    # gaps" (VictoriaLogs query path may drift between versions).
    type: victoriametrics-logs-datasource
    access: proxy
    url: https://data.o11y.chezmoi.sh/logs
    editable: false
    jsonData:
      otelPreset:
        enabled: true
        # otelPreset's own trace-link (tracesDatasourceUid) only supports
        # Jaeger-type targets -- omitted here since the traces datasource is
        # Tempo. Severity log-level rules still apply; the trace_id link
        # itself is done via the plain derivedFields entry below instead,
        # which supports any tracing datasource type.
        detection:
          # Field names of VictoriaLogs' native OTLP ingest (fed by the o11y
          # LXC's OTLP gateway, ADR-018); severity_text is upper case.
          traceIdField: trace_id
          severity:
            field: severity_text
            valueCase: string
            source: manual
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "${__value.raw}"
          urlDisplayLabel: View trace
          datasourceUid: victoriatraces-tempo
        # Logs -> metrics: host.name is the join key shared by every signal
        # (service.name differs between logs and metrics, see the o11y LXC
        # README "Labels and fields").
        - name: host.name
          matcherType: label
          matcherRegex: host.name
          url: 'system_cpu_load_average_1m{host.name="${__value.raw}"}'
          urlDisplayLabel: Host metrics
          datasourceUid: victoriametrics

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  # Renamed from `victoriametrics` to set spec.uid: the operator forbids adding
  # a uid to an existing GrafanaDatasource, and correlation links need a fixed
  # one (VictoriaLogs derived fields, VictoriaTraces tracesToMetrics).
  name: victoriametrics-metrics
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoriametrics
  plugins:
    - name: victoriametrics-metrics-datasource
      version: 1.0.1
  datasource:
    name: VictoriaMetrics
    # VictoriaMetrics' own plugin rather than the built-in Prometheus type: it
    # speaks MetricsQL natively (autocomplete, WITH templates, query tracing)
    # and stays PromQL-compatible for dashboards built on Prometheus.
    type: victoriametrics-metrics-datasource
    access: proxy
    url: https://data.o11y.chezmoi.sh/metrics
    isDefault: true
    editable: false

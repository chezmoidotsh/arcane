---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  # Renamed from `victoriametrics` to set spec.uid: the operator forbids adding
  # a uid to an existing GrafanaDatasource, and correlation links need a fixed
  # one (VictoriaLogs derived fields, VictoriaTraces tracesToMetrics).
  name: victoriametrics-metrics
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  uid: victoriametrics
  datasource:
    name: VictoriaMetrics
    # Built-in Prometheus type rather than VictoriaMetrics' own plugin: Metrics
    # Drilldown and the Tempo trace-to-metrics link only accept `prometheus`
    # datasources. VictoriaMetrics serves the Prometheus query API and still
    # evaluates MetricsQL; only the MetricsQL-aware editor is lost.
    type: prometheus
    access: proxy
    url: https://data.o11y.chezmoi.sh/metrics
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

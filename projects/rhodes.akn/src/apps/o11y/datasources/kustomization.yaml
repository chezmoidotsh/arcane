apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hashed name: kustomize rewrites the reference in grafana.instance.yaml
# (see ../kustomizeconfig.yaml), so a change restarts Grafana, which only
# reads provisioning files at startup.
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml

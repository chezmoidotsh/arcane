---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        GF_SECURITY_ADMIN_USER: "{{ .username }}"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: rhodes.akn/grafana/admin/bootstrap-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: rhodes.akn/grafana/admin/bootstrap-credentials
        property: password

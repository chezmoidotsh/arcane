---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: victoriametrics-overview
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # Official VictoriaMetrics single-node dashboard, variant for the
  # VictoriaMetrics datasource plugin (the grafana.com one, 10229, only lists
  # `prometheus` datasources). Pinned to the deployed VictoriaMetrics version.
  url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.155.0/dashboards/vm/victoriametrics.json

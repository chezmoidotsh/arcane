# Loki-VL-proxy: serves the Loki API on top of VictoriaLogs so Grafana's
# built-in Loki datasource (and with it Logs Drilldown) works against the o11y
# LXC appliance.
#
# The proxy drops the path of -backend (ReliablyObserve/loki-vl-proxy#1340),
# while the appliance only exposes VictoriaLogs under /logs/. An Envoy sidecar
# (loki-vl-proxy.envoy.configmap.yaml) listens on 127.0.0.1:9428 and adds the
# prefix. Drop the sidecar and point -backend at
# https://data.o11y.chezmoi.sh/logs once the issue is fixed.
extraArgs:
  backend: http://127.0.0.1:9428
  # The appliance's Caddy only lets /select/* through: /metrics (version
  # probe) and /health answer 403. The version probe only warns.
  backend-compression: none

probe:
  readiness:
    # /ready probes the backend's /health, refused by the appliance (see
    # above): the pod would never become Ready. /alive only checks the process.
    path: /alive

# Cilium policies in security/ instead of the chart's NetworkPolicy, which
# only allows egress to port 9428.
networkPolicy:
  enabled: false

extraContainers:
  - name: envoy
    image: docker.io/envoyproxy/envoy:v1.40.2
    args:
      - --config-path
      - /etc/envoy/envoy.yaml
      - --log-level
      - warn
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    volumeMounts:
      - name: envoy-config
        mountPath: /etc/envoy
        readOnly: true

extraVolumes:
  - name: envoy-config
    configMap:
      name: loki-vl-proxy-envoy

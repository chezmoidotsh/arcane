---
# Provisioning file of grafana-llm-app (mounted in /etc/grafana/provisioning/plugins
# by grafana.instance.yaml), rendered as a whole so the OpenRouter key never sits in
# Git. OpenRouter is OpenAI-compatible: provider "custom" + the /api/v1 base URL.
# The OpenRouter API key is created by hand in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-llm-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: grafana-llm-app
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        grafana-llm-app.yaml: |
          apiVersion: 1
          apps:
            - type: grafana-llm-app
              disabled: false
              jsonData:
                provider: custom
                openAI:
                  url: https://openrouter.ai/api
                  apiPath: /v1
                models:
                  default: base
                  mapping:
                    base: deepseek/deepseek-v4.1-flash-1017
                    large: mistralai/mistral-large-4-0
                # Reasoning models can exceed the 2 min default on large prompts.
                requestTimeoutSeconds: 300
              secureJsonData:
                openAIKey: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: rhodes.akn/grafana/api-keys/openrouter
        property: api_key

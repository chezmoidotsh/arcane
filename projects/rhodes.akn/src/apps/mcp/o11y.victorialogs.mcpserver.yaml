---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: victorialogs
spec:
  # oripathy: type=oci upstream=github.com/VictoriaMetrics-Community/mcp-victorialogs tagPrefix=v digest=false image=victoriametrics/mcp-victorialogs
  image: oci.chezmoi.sh/ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
  transport: streamable-http
  mcpPort: 8080
  groupRef:
    name: o11y
  env:
    - name: VL_INSTANCE_ENTRYPOINT
      value: https://data.o11y.chezmoi.sh/logs
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: ":8080"
    # INFO logs every request with its full JSON result (up to MBs per line), which
    # floods VictoriaLogs and feeds back into the next query. Errors stay logged.
    - name: MCP_LOG_LEVEL
      value: warn

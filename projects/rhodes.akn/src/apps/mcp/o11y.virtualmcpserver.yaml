---
# Validates the tokens issued by the vMCP embedded authorization server (issuer must match
# authServerConfig.issuer below).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: mcp-o11y
spec:
  type: inline
  inline:
    issuer: https://mcp-o11y.chezmoi.sh
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-o11y
spec:
  groupRef:
    name: o11y
  authServerConfig:
    issuer: https://mcp-o11y.chezmoi.sh
    hmacSecretRefs:
      - name: mcp-o11y-auth
        key: hmac
    upstreamProviders:
      - name: pocket-id
        type: oidc
        oidcConfig:
          issuerUrl: https://auth.chezmoi.sh
          clientId: 7a1c0e7e-5f0b-4f43-9c2b-3b6f3a8d1c10
          clientSecretRef:
            name: mcp-o11y-auth
            key: client_secret
          redirectUri: https://mcp-o11y.chezmoi.sh/oauth/callback
          scopes:
            - openid
            - profile
            - email
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: mcp-o11y
      audience: https://mcp-o11y.chezmoi.sh
      resourceUrl: https://mcp-o11y.chezmoi.sh
  outgoingAuth:
    source: discovered

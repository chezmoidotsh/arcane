---
# LAN access to the mcp-o11y vMCP (internal Gateway only). Remote access goes through the private
# Pangolin resource mcp-o11y.chezmoi.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://mcp-o11y.chezmoi.sh
  name: mcp-o11y
spec:
  hostnames:
    - mcp-o11y.chezmoi.sh
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: kube-system
      sectionName: chezmoi.sh-websecure
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: vmcp-mcp-o11y
          port: 4483
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

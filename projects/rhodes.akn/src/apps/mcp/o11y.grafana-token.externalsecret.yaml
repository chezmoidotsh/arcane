---
# Grafana service account token (Viewer role) used by the grafana MCP server. Created by hand in
# Grafana, then stored at this OpenBao path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: mcp-grafana-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: rhodes.akn/mcp/o11y/grafana-token
        property: token

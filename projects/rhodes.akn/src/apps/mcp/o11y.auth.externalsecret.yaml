---
# Pocket-Id client (upstream IdP of the vMCP embedded authorization server) and HMAC secret used to
# sign authorization codes. Both are produced by Pulumi
# (infrastructure/pulumi/stack/pocket-id/mcp-o11y.ts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-o11y-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: mcp-o11y-auth
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: rhodes.akn/mcp/o11y/oidc-client
        property: client_secret
    - secretKey: hmac
      remoteRef:
        key: rhodes.akn/mcp/o11y/auth-server
        property: hmac

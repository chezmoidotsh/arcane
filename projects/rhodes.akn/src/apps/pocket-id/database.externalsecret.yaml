---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pocket-id-database-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    external-secrets.io/description: |
      Generates Pocket-Id's own CNPG role password locally. Pocket-Id has no
      Vault dependency by design (see docs/disaster-recovery/pocket-id.md), so
      this never sources from the real Vault ClusterSecretStore either.
      refreshInterval: "0" means generate once; CNPG reconciles the managed
      role's password whenever this Secret changes.
    cnpg.io/description: PostgreSQL credentials for pocket-id-database
  name: pocket-id-database-pocket-id
spec:
  refreshInterval: "0"
  target:
    name: pocket-id-database-pocket-id
    template:
      engineVersion: v2
      data:
        username: pocket_id
        password: "{{ .password }}"
        # NOTE: hostname tracks cnpg.cluster.yaml's metadata.name
        # (pocket-id-20260530 today). Update alongside
        # cnpg.scheduledbackup.yaml's spec.cluster.name whenever
        # patch-recovery-source renames this cluster — same manual
        # follow-up that script already calls out.
        uri: postgresql://pocket_id:{{ .password }}@pocket-id-20260530-rw:5432/pocket_id
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pocket-id-database-password

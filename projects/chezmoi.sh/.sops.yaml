# SOPS creation rules for chezmoi.sh: only the o11y-datastore LXC is left (step 10 of MIGR-20261114-00).
# There is no root .sops.yaml: each project that encrypts files owns one.
# sops looks for it from the *current directory* upward (not from the file's), so run sops from inside the project.
# path_regex is relative to this file's directory.
creation_rules:
  # Proxmox LXC build-time secrets (dotenv format, baked into image at build time)
  - path_regex: src/infrastructure/proxmox/.+/secrets/.*\.sops\.env$

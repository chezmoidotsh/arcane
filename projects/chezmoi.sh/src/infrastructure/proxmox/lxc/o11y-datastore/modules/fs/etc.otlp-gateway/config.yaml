# ─────────────────────────────────────────────────────────────────────────────
# OTLP gateway — OpenTelemetry Collector configuration
# ─────────────────────────────────────────────────────────────────────────────
# Caddy :4318 /v1/* → this collector → the Victoria stores.
#
# Why it exists: the stores ingest OTLP natively but only as protobuf, while
# some senders emit OTLP/JSON (Proxmox VE's metric server). The receiver accepts
# both encodings; the exporters always send protobuf. The only processing is
# the severity normalisation of the logs and the job/instance labels of the
# metrics.
# ─────────────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318 # Caddy is the only client

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

  # One severity scheme for every sender (o11y-agent, Proxmox VE, anything
  # else speaking OTLP): severity_number is derived from the text when only the
  # text was sent ("warning", "Information", "err", …), then severity_text is
  # rewritten in upper case from the number.
  transform/severity:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^trace")
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(debug|dbg)")
          - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(info|notice)")
          - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^warn")
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^err")
          - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(crit|alert|emerg|fatal|panic)")
          - set(log.severity_text, "TRACE") where log.severity_number >= 1 and log.severity_number <= 4
          - set(log.severity_text, "DEBUG") where log.severity_number >= 5 and log.severity_number <= 8
          - set(log.severity_text, "INFO") where log.severity_number >= 9 and log.severity_number <= 12
          - set(log.severity_text, "WARN") where log.severity_number >= 13 and log.severity_number <= 16
          - set(log.severity_text, "ERROR") where log.severity_number >= 17 and log.severity_number <= 20
          - set(log.severity_text, "FATAL") where log.severity_number >= 21

  # Prometheus-style `job` and `instance` labels, so off-the-shelf dashboards
  # (VictoriaMetrics, Node Exporter Full, …) and vmui's "Explore Prometheus
  # metrics" work. Follows the OTel → Prometheus compatibility mapping: job =
  # [service.namespace/]service.name. instance is host.name (unique per LXC;
  # service.instance.id is often a loopback host:port), falling back to
  # service.instance.id. service.name stays: it is the key shared with logs
  # and traces. Copies only: no extra series.
  transform/job:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["job"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
          - set(resource.attributes["job"], Concat([resource.attributes["service.namespace"], resource.attributes["service.name"]], "/")) where resource.attributes["service.namespace"] != nil and resource.attributes["service.name"] != nil
          - set(resource.attributes["instance"], resource.attributes["service.instance.id"]) where resource.attributes["service.instance.id"] != nil
          - set(resource.attributes["instance"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil

exporters:
  otlphttp/victoriametrics:
    metrics_endpoint: http://127.0.0.1:8428/opentelemetry/v1/metrics
    sending_queue:
      storage: file_storage

  otlphttp/victorialogs:
    logs_endpoint: http://127.0.0.1:9428/insert/opentelemetry/v1/logs
    headers:
      # Every resource attribute would otherwise become a stream field.
      VL-Stream-Fields: service.name,host.name
      # OTLP scope metadata is "unknown" for every log source: noise.
      VL-Ignore-Fields: scope.name,scope.version
    sending_queue:
      storage: file_storage

  otlphttp/victoriatraces:
    traces_endpoint: http://127.0.0.1:10428/insert/opentelemetry/v1/traces
    sending_queue:
      storage: file_storage

extensions:
  # Persists the exporter queues: a store restart does not drop data.
  file_storage:
    directory: /persistent/o11y/otlp-gateway

service:
  extensions: [file_storage]

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/job, batch]
      exporters: [otlphttp/victoriametrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/severity, batch]
      exporters: [otlphttp/victorialogs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victoriatraces]

  # The gateway's own metrics, pushed back through itself.
  telemetry:
    resource:
      host.name: o11y
    metrics:
      readers:
        - periodic:
            interval: 30000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://127.0.0.1:14318/v1/metrics

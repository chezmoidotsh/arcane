# Drop-in for the otelcol-contrib Debian package unit, installed as
# /etc/systemd/system/otelcol-contrib.service.d/override.conf.
[Service]
# The journald receiver runs `journalctl`: the host journal is readable by the
# systemd-journal group only.
SupplementaryGroups=systemd-journal
# file_storage (exporter queue + journald cursor), created owned by the unit user.
StateDirectory=otelcol-contrib

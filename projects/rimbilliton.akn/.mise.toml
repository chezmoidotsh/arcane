# =============================================================================
# Rimbilliton.akn - Mise Configuration
# =============================================================================

[tasks."diagram:generate"]
description = "Generate the architecture diagram for rimbilliton.akn"
# Converts the D2 diagram source to SVG format for documentation
# Input: architecture.d2 (diagram-as-code source)
# Output: docs/assets/architecture-{light,dark}.svg (embedded in the README)
run = [
  "d2 --theme 0 architecture.d2 docs/assets/architecture-light.svg",
  "d2 --theme 200 architecture.d2 docs/assets/architecture-dark.svg",
]
dir = "{{ config_root }}"

# -----------------------------------------------------------------------------
# NixOS host (src/infrastructure/nixos). Run from anywhere: `mise run nixos:<task>`.
# nonix forwards $SSH_AUTH_SOCK to the container, so the key must be in your agent.
# nixos-anywhere is pinned by commit; nixos-rebuild comes from the nixpkgs revision locked in flake.lock.
# -----------------------------------------------------------------------------

[tasks."nixos:oci:install"]
description = "(Re)install the OCI A1 host with nixos-anywhere (DESTRUCTIVE: repartitions the boot volume)"
# Needs `unsecure=true` on the Pulumi stack (SSH closed otherwise). Example: mise run nixos:oci:install ubuntu@<public-ip>
usage = '''
arg "<target>" help="SSH target of the stock Ubuntu instance, user@host"
'''
run = '''
nonix run github:nix-community/nixos-anywhere/b6be7b277b468d55082584441cbef1fed8530eb3 -- --flake ".#rimbilliton-akn-aarch64" --extra-files extra \
  --kexec-extra-flags --kexec-syscall --target-host "$usage_target"
'''
dir = "{{ config_root }}/src/infrastructure/nixos"

[tasks."nixos:oci:update"]
description = "Apply the configuration to the running OCI A1 host over the tailnet"
run = '''
nonix run "github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)#nixos-rebuild" -- switch \
  --flake ".#rimbilliton-akn-aarch64" --target-host root@rimbilliton-akn
'''
dir = "{{ config_root }}/src/infrastructure/nixos"

[tasks."nixos:e2e"]
description = "Rehearse the install on a Proxmox KVM test VM (x86_64, DESTRUCTIVE for the target): mise run nixos:e2e user@host"
usage = '''
arg "<target>" help="SSH target of the test VM, user@host (required)"
'''
run = '''
nonix run github:nix-community/nixos-anywhere/b6be7b277b468d55082584441cbef1fed8530eb3 -- --flake ".#rimbilliton-akn-x86_64" --extra-files extra \
  --build-on remote --target-host "$usage_target"
'''
dir = "{{ config_root }}/src/infrastructure/nixos"

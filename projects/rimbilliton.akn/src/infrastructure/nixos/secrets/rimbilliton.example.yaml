# Template -- copy to rimbilliton.sops.yaml, fill, then `sops --encrypt --in-place`.
# Never commit the plaintext version.
tailscale_authkey: <pulumi stack output tailscaleAuthKey --show-secrets>
restic_password: <openssl rand -base64 32> # keep a copy in OpenBao: losing it = losing the backups
restic_b2_env: |
  AWS_ACCESS_KEY_ID=<pulumi output backupsKeyId>
  AWS_SECRET_ACCESS_KEY=<pulumi output backupsKeySecret --show-secrets>
# Wings node credentials: Panel > Admin > Nodes > <node> > Configuration
wings_uuid: <uuid>
wings_token_id: <token_id>
wings_token: <token>
# Pocket-Id OIDC client used by Pelican's sign-in (created by hand in Pocket-Id)
oauth_pocketid_client_id: <client id>
oauth_pocketid_client_secret: <client secret>

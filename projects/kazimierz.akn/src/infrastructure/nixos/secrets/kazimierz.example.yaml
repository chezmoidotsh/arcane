# Template -- copy to kazimierz.sops.yaml, fill, then `sops --encrypt --in-place`.
# Never commit the plaintext version.
# Tailscale pre-authorized key (7 days, single use) generated by Pulumi: `pulumi stack output tailscaleAuthKey --show-secrets`.
tailscale_authkey: <tskey-auth-...>
# Must stay identical to the current one: it signs Pangolin's sessions and encrypts data in its database.
pangolin_server_secret: <value of `pangolin_server_secret` in the Ansible host_vars>
pangolin_smtp_user: <Mailjet API key>
pangolin_smtp_pass: <Mailjet secret key>
# Zone:Read + DNS:Edit on the chezmoi.sh zone, `pulumi stack output traefikDns01TokenValue --show-secrets`
cloudflare_dns_api_token: <token>

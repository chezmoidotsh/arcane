# =============================================================================
# kazimierz.akn Pulumi stack - Mise configuration
# =============================================================================
# OCI Free Tier infrastructure for kazimierz.akn, managed as a Pulumi stack
# (state in the Garage S3 backend, see Pulumi.yaml).
#
# Stack `kazimierz_akn.live` exists; `.mise/env.yaml` (SOPS-encrypted
# PULUMI_STACK/PULUMI_CONFIG_PASSPHRASE, loaded via `[env] _.file` below,
# mirroring amiya.akn) is set up so these tasks don't prompt.
# `ssh_authorized_keys`/`unsecure` are set. Still needed before `pulumi up`
# can run: OCI provider creds as TF_VAR_tenancy_ocid/TF_VAR_user_ocid/
# TF_VAR_fingerprint/TF_VAR_private_key/TF_VAR_region (see compartments.ts,
# not pulumi config -- git-tracked file), plus `pulumi config set
# cloudflare_zone_id` (see stack/dns.ts). The boot image is resolved live
# from OCI's platform images, no config key needed for it.
#
# `node = "24"` (fuzzy, not an exact patch) overrides the root .mise.toml's
# exact `24.16.0` pin — that specific patch's built-in TypeScript stripping
# refuses .ts files under any node_modules path, breaking the file:-linked
# catalog packages; a later 24.x patch fixed it, so pin loosely instead of to
# a specific version, mirroring amiya.akn's .mise.toml.
# =============================================================================

[tools]
node = "24"

[env]
_.file = "{{ config_root }}/.mise/env.yaml"

[tasks."pulumi:diff"]
description = "Preview pending changes for the current Pulumi stack"
run = "pulumi preview --refresh --parallel 15"
dir = "{{ config_root }}"

[tasks."pulumi:apply"]
description = "Apply pending changes to the current Pulumi stack"
run = ["pulumi up --refresh --parallel 15"]
dir = "{{ config_root }}"

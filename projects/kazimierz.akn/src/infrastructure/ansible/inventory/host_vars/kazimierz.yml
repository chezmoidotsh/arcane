# -------------------------------------------------------------------------
# System Setup Configuration
# -------------------------------------------------------------------------
# Tailscale OAuth client secret (tskey-client-...), not a plain one-time
# auth key -- doesn't expire on its own, mints a fresh short-lived auth key
# via the API on every playbook run instead. Needs the auth_keys scope and
# must be limited to tag:svc-pangolin in the Tailscale admin console.

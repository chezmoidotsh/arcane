---
# Ansible inventory for Kazimierz.AKN VPS
# Host: kazimierz-pangolin (OCI Always Free, eu-paris-1)

all:
  hosts:
    kazimierz:
      ansible_host: kazimierz.akn.chezmoi.sh
      # Stock OCI Ubuntu images reject direct root SSH (a forced-command
      # entry in /root/.ssh/authorized_keys prints a "login as ubuntu"
      # message and disconnects, regardless of sshd_config) -- login as
      # ubuntu and become root instead. Unlike the Hetzner image this
      # replaces, which did allow direct root login.
      ansible_user: ubuntu
      ansible_become: true
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

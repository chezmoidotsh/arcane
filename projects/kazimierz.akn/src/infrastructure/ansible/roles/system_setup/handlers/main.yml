---
# ==============================================================================
# Handlers: system_setup
# ==============================================================================

- name: Enable and start UFW firewall
  community.general.ufw:
    state: enabled
    logging: "on"

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd daemon configuration
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start unattended-upgrades-notify timer
  ansible.builtin.systemd:
    name: unattended-upgrades-notify.timer
    enabled: true
    state: started

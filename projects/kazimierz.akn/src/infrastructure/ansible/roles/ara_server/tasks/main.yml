---
# ==============================================================================
# Role: ara_server
# ==============================================================================
# Purpose:
#   Deploy ARA (Ansible Run Analysis) for playbook execution tracking and
#   visualization, accessible via Tailscale Serve.
#
# Components Configured:
#   - ARA API server running as a native systemd service (Ubuntu's own
#     ara-server package, not a container -- see below)
#   - ARA Ansible callback plugin for automatic run recording
#   - Tailscale Serve for secure HTTPS access to the web interface
#
# Why not the recordsansible/ara-api Docker image:
#   That image only ever gets published for amd64 -- there is no arm64
#   build, so it fails outright ("exec format error") on this Ampere A1
#   host. Ubuntu's own universe repo ships ara-server/python3-ara built for
#   whatever the host's actual architecture is, with a systemd unit
#   included, so a container was never actually necessary here.
#
# Access:
#   - ARA web interface: https://<tailscale-hostname>.ts.net:10000
#   - API endpoint: http://127.0.0.1:<ara_port> (default 8000)
#
# Data Storage:
#   - SQLite database at /opt/ara/ansible.sqlite, owned by the `ara` system
#     user/group the package creates.
#
# Security Considerations:
#   - ARA API bound to 127.0.0.1 only, reached externally through Tailscale
#     Serve.
#   - ALLOWED_HOSTS restricted to localhost and *.ts.net in settings.yaml.
#
# Dependencies:
#   - ara-server / python3-ara packages (Ubuntu universe)
#   - Tailscale daemon (tailscaled.service)
#
# Tags:
#   - ara: All ARA-related tasks
#   - systemd: Systemd unit/drop-in configuration
#   - ansible: Ansible callback configuration
# ==============================================================================

# ==========================================================================
# Cleanup: retire the old Docker-based deployment
# ==========================================================================
# Idempotent no-ops once this has run once -- kept so re-running this role
# against a host still on the old Docker-based unit cleans it up instead of
# leaving two competing listeners on the same port.
- name: Check for the old Docker-based ara systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/ara.service
  register: ara_old_unit_file
  tags:
    - ara
    - systemd

- name: Stop and disable the old Docker-based ara systemd unit
  ansible.builtin.systemd:
    name: ara
    state: stopped
    enabled: false
  when: ara_old_unit_file.stat.exists
  tags:
    - ara
    - systemd

- name: Remove the old Docker-based ara systemd unit file
  ansible.builtin.file:
    path: /etc/systemd/system/ara.service
    state: absent
  when: ara_old_unit_file.stat.exists
  notify:
    - Reload systemd daemon configuration
  tags:
    - ara
    - systemd

- name: Remove the old ara-api Docker container (wrong-architecture image)
  community.docker.docker_container:
    name: ara-api
    state: absent
  when: ara_old_unit_file.stat.exists
  tags:
    - ara

# ==========================================================================
# ARA Server Package Installation
# ==========================================================================
- name: Ensure ara-server package is installed
  ansible.builtin.apt:
    name: ara-server
    state: present
    update_cache: true
  tags:
    - ara

- name: Ensure /opt/ara data directory exists
  ansible.builtin.file:
    path: /opt/ara
    state: directory
    mode: "0750"
    owner: ara
    group: ara
  tags:
    - ara

# ARA_BASE_DIR is read directly via os.environ.get() in ARA's settings.py,
# bypassing dynaconf entirely -- unlike pointing ARA_SETTINGS at a file
# elsewhere, which was tried first and silently didn't take (dynaconf kept
# falling back to its own BASE_DIR/DATABASE_NAME defaults, verified live:
# the configured DATABASE_NAME was never used, three different unintended
# sqlite files appeared under /root and /var/lib/ara-server instead).
# Settings.yaml is colocated with the data it configures for the same
# reason: it's BASE_DIR's own default settings-file location, no override
# indirection involved.
- name: Check if ARA secret key file exists
  ansible.builtin.stat:
    path: /opt/ara/.secret_key
  register: ara_secret_key_file
  tags:
    - ara

- name: Generate ARA secret key
  ansible.builtin.shell: openssl rand -base64 40 | tr -d '\n' > /opt/ara/.secret_key
  when: not ara_secret_key_file.stat.exists
  tags:
    - ara

- name: Ensure ARA secret key file has correct permissions
  ansible.builtin.file:
    path: /opt/ara/.secret_key
    mode: "0600"
    owner: ara
    group: ara
  tags:
    - ara

- name: Read ARA secret key
  ansible.builtin.slurp:
    src: /opt/ara/.secret_key
  register: ara_secret_key_content
  no_log: true
  tags:
    - ara

- name: Set ARA secret key fact
  ansible.builtin.set_fact:
    ara_secret_key: "{{ ara_secret_key_content.content | b64decode | trim }}"
  no_log: true
  tags:
    - ara

- name: Deploy ARA API server settings
  ansible.builtin.template:
    src: ara-settings.yaml.j2
    dest: /opt/ara/settings.yaml
    mode: "0640"
    owner: ara
    group: ara
  notify:
    - Restart ara-server
  tags:
    - ara

- name: Deploy ARA server environment overrides
  ansible.builtin.template:
    src: ara-server-env.j2
    dest: /etc/default/ara-server
    mode: "0644"
  notify:
    - Restart ara-server
  tags:
    - ara

# Runs as root (not become_user: ara). Without the `acl` package installed
# on the target, become_user falls back through setfacl -> chown -> a
# macOS-specific `chmod +a` ACL syntax that fails outright on Linux --
# documented ansible-core behavior, see
# https://github.com/ansible/ansible/issues/74830 and
# https://github.com/ansible/ansible/issues/85503. Simpler to just not use
# become_user for one command; ownership is fixed up below instead, since
# ara-server.service itself runs as the ara user.
- name: Apply ARA database migrations
  ansible.builtin.command: ara-manage migrate
  environment:
    ARA_BASE_DIR: /opt/ara
  register: ara_migrate
  changed_when: "'Applying' in ara_migrate.stdout"
  tags:
    - ara

- name: Ensure /opt/ara stays owned by the ara user after migrations
  ansible.builtin.file:
    path: /opt/ara
    state: directory
    recurse: true
    owner: ara
    group: ara
  tags:
    - ara

- name: Deploy Tailscale Serve systemd drop-in for ara-server
  ansible.builtin.file:
    path: /etc/systemd/system/ara-server.service.d
    state: directory
    mode: "0755"
  tags:
    - ara
    - systemd

- name: Configure Tailscale Serve integration for ara-server
  ansible.builtin.template:
    src: ara-server-tailscale-serve.conf.j2
    dest: /etc/systemd/system/ara-server.service.d/tailscale-serve.conf
    mode: "0644"
  notify:
    - Reload systemd daemon configuration
    - Restart ara-server
  tags:
    - ara
    - systemd

- name: Ensure ara-server systemd service is enabled and started
  ansible.builtin.systemd:
    name: ara-server
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - ara

- name: Wait for ARA API server to be ready and accepting connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ara_port }}"
    timeout: 60
  tags:
    - ara

# ==========================================================================
# ARA Callback Plugin Installation
# ==========================================================================
- name: Ensure python3-ara package is installed for Ansible callback plugin
  ansible.builtin.apt:
    name:
      - python3-ara
    state: present
    update_cache: true
  tags:
    - ara
    - ansible

- name: Ensure /etc/ansible directory exists for global Ansible configuration
  ansible.builtin.file:
    path: /etc/ansible
    state: directory
    mode: "0755"
  tags:
    - ara
    - ansible

- name: Configure Ansible to use ARA callback plugin with HTTP API client
  ansible.builtin.template:
    src: ansible.cfg.j2
    dest: /etc/ansible/ansible.cfg
    mode: "0644"
  tags:
    - ara
    - ansible

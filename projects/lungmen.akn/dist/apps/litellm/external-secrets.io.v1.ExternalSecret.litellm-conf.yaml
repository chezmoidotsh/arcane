---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-conf
  namespace: litellm
spec:
  data:
  - remoteRef:
      key: lungmen.akn/litellm/auth/keys
      property: master_key
    secretKey: master_key
  - remoteRef:
      key: lungmen.akn/litellm/auth/keys
      property: salt_key
    secretKey: salt_key
  - remoteRef:
      key: lungmen.akn/litellm/auth/oidc-client
      property: client_id
    secretKey: oidc_client_id
  - remoteRef:
      key: lungmen.akn/litellm/auth/oidc-client
      property: client_secret
    secretKey: oidc_client_secret
  - remoteRef:
      key: lungmen.akn/litellm/providers/openrouter
      property: api_key
    secretKey: openrouter_api_key
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: litellm-conf
    template:
      data:
        GENERIC_CLIENT_ID: '{{ .oidc_client_id }}'
        GENERIC_CLIENT_SECRET: '{{ .oidc_client_secret }}'
        LITELLM_SALT_KEY: '{{ .salt_key }}'
        OPENROUTER_API_KEY: '{{ .openrouter_api_key }}'
        masterkey: '{{ .master_key }}'
      engineVersion: v2
      type: Opaque

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows LiteLLM to connect to Pocket-Id for OIDC authentication.
  name: allow-litellm-to-sso
  namespace: litellm
spec:
  egress:
  - toFQDNs:
    - matchName: auth.chezmoi.sh
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm

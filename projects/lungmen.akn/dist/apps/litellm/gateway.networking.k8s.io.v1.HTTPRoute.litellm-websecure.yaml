---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://llm.lab.chezmoi.sh
  name: litellm-websecure
  namespace: litellm
spec:
  hostnames:
  - llm.lab.chezmoi.sh
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: lab.chezmoi.sh-websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: litellm
      port: 4000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://bookmarks.chezmoi.sh
  labels:
    app.kubernetes.io/instance: linkding
    app.kubernetes.io/name: linkding
  name: linkding-websecure
  namespace: linkding
spec:
  hostnames:
  - bookmarks.chezmoi.sh
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: chezmoi.sh-websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: linkding
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

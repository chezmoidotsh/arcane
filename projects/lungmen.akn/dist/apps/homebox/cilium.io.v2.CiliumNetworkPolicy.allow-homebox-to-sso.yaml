---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Homebox to connect to Pocket-Id for OIDC authentication.
  labels:
    app.kubernetes.io/instance: homebox
    app.kubernetes.io/name: homebox
  name: allow-homebox-to-sso
  namespace: homebox
spec:
  egress:
  - toFQDNs:
    - matchName: auth.chezmoi.sh
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homebox

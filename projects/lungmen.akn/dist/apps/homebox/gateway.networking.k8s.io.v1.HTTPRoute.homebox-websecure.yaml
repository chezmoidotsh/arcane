---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://homebox.chezmoi.sh
  labels:
    app.kubernetes.io/instance: homebox
    app.kubernetes.io/name: homebox
  name: homebox-websecure
  namespace: homebox
spec:
  hostnames:
  - homebox.chezmoi.sh
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: chezmoi.sh-websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: homebox
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/instance: homebox
    app.kubernetes.io/name: homebox
  name: homebox-oidc-credentials
  namespace: homebox
spec:
  dataFrom:
  - extract:
      key: lungmen.akn/homebox/auth/oidc-client
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: homebox-oidc-credentials
    template:
      data:
        oidc_client_id: '{{ .client_id }}'
        oidc_client_secret: '{{ .client_secret }}'
      engineVersion: v2
      type: Opaque

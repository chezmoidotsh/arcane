---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: spoolman
    app.kubernetes.io/name: spoolman
    app.kubernetes.io/part-of: spoolman
  name: spoolman
  namespace: spoolman
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: spoolman
      app.kubernetes.io/name: spoolman
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: spoolman
        app.kubernetes.io/name: spoolman
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SPOOLMAN_DB_TYPE
          value: postgres
        - name: SPOOLMAN_DB_NAME
          valueFrom:
            secretKeyRef:
              key: dbname
              name: spoolman-database-spoolman
        - name: SPOOLMAN_DB_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: spoolman-database-spoolman
        - name: SPOOLMAN_DB_PORT
          valueFrom:
            secretKeyRef:
              key: port
              name: spoolman-database-spoolman
        - name: SPOOLMAN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: spoolman-database-spoolman
        - name: SPOOLMAN_DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: spoolman-database-spoolman
        image: oci.chezmoi.sh/ghcr.io/donkie/spoolman:0.26.1
        livenessProbe:
          httpGet:
            path: /health
            port: http
        name: spoolman
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 23281
          runAsNonRoot: true
          runAsUser: 23281
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /home/app/.local/share/spoolman
          name: spoolman-data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 23281
        runAsGroup: 23281
        runAsUser: 23281
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: spoolman-data
      - emptyDir: {}
        name: tmp

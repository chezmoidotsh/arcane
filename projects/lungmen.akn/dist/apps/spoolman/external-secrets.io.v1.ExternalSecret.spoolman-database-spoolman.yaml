---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/instance: spoolman
    app.kubernetes.io/name: spoolman
  name: spoolman-database-spoolman
  namespace: spoolman
spec:
  dataFrom:
  - extract:
      key: lungmen.akn/spoolman/database/postgresql
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: spoolman-database-spoolman

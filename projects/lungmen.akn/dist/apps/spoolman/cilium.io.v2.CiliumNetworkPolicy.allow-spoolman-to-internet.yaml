---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Spoolman to sync the external filament/material database from
      donkie.github.io/SpoolmanDB on startup and periodically thereafter.
  labels:
    app.kubernetes.io/instance: spoolman
    app.kubernetes.io/name: spoolman
  name: allow-spoolman-to-internet
  namespace: spoolman
spec:
  egress:
  - toFQDNs:
    - matchName: donkie.github.io
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spoolman

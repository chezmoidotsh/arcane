---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: n8n-mcp
  namespace: n8n
spec:
  allowPrivateEndpoint: true
  authServerRef:
    kind: MCPExternalAuthConfig
    name: n8n-mcp-auth
  oidcConfigRef:
    audience: https://n8n.mcp.chezmoi.sh
    name: n8n-mcp
    resourceUrl: https://n8n.mcp.chezmoi.sh
  remoteUrl: http://n8n-main.n8n.svc.cluster.local:5678/mcp-server/http
  transport: streamable-http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/proxy-class: restricted
  name: n8n-tailscale
  namespace: n8n
spec:
  defaultBackend:
    service:
      name: n8n-main
      port:
        number: 5678
  ingressClassName: tailscale
  tls:
  - hosts:
    - n8n

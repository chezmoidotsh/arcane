---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-mcp-auth
  namespace: n8n
spec:
  data:
  - remoteRef:
      key: lungmen.akn/n8n/mcp/auth-server
      property: hmac
    secretKey: hmac
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: n8n-mcp-auth

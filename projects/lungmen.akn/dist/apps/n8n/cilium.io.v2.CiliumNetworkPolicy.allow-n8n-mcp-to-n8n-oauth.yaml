---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the n8n MCP proxy to reach the OAuth endpoints of n8n (token and dynamic client
      registration on n8n.chezmoi.sh) through the Gateway. Uses "cluster", not toFQDNs: the
      Gateway's LB IP is shared by every *.chezmoi.sh hostname, and a toFQDNs rule breaks Cilium's
      Gateway API hairpin routing (a pod reaching its own cluster's Gateway VIP) with an
      unconditional 403 from Envoy.
  name: allow-n8n-mcp-to-n8n-oauth
  namespace: n8n
spec:
  egress:
  - toEntities:
    - cluster
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: n8n-mcp

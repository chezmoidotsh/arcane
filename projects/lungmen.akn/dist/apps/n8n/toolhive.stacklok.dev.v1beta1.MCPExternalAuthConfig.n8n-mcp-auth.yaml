---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: n8n-mcp-auth
  namespace: n8n
spec:
  embeddedAuthServer:
    hmacSecretRefs:
    - key: hmac
      name: n8n-mcp-auth
    issuer: https://n8n.mcp.chezmoi.sh
    upstreamProviders:
    - name: n8n
      oauth2Config:
        allowPrivateIPs: true
        authorizationEndpoint: https://n8n.chezmoi.sh/mcp-oauth/authorize
        dcrConfig:
          registrationEndpoint: https://n8n.chezmoi.sh/mcp-oauth/register
        redirectUri: https://n8n.mcp.chezmoi.sh/oauth/callback
        tokenEndpoint: https://n8n.chezmoi.sh/mcp-oauth/token
      type: oauth2
  type: embeddedAuthServer

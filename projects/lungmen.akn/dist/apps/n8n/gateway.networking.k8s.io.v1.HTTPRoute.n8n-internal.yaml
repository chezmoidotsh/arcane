---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-internal
  namespace: n8n
spec:
  hostnames:
  - n8n.chezmoi.sh
  - cilium-gateway-external.kube-system.svc.cluster.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: web
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: n8n-webhook-processor
      port: 5678
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /webhook/
    - path:
        type: PathPrefix
        value: /webhook-waiting/
    - path:
        type: PathPrefix
        value: /form/
    - path:
        type: PathPrefix
        value: /form-waiting/
    - path:
        type: PathPrefix
        value: /mcp/
  - backendRefs:
    - group: ""
      kind: Service
      name: n8n-main
      port: 5678
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-conf
  namespace: n8n
spec:
  dataFrom:
  - extract:
      key: lungmen.akn/n8n/auth/encryption-key
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: n8n-conf
    template:
      data:
        N8N_ENCRYPTION_KEY: '{{ .encryption_key }}'
        N8N_HOST: n8n.chezmoi.sh
        N8N_PORT: "5678"
        N8N_PROTOCOL: https
      engineVersion: v2
      type: Opaque

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://n8n.chezmoi.sh
  name: n8n-websecure
  namespace: n8n
spec:
  hostnames:
  - n8n.chezmoi.sh
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: kube-system
    sectionName: chezmoi.sh-websecure
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: n8n-main
      port: 5678
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /

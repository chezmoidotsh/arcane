---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows n8n to access its database on the mutualized apps-secured PostgreSQL cluster, and the
      workflows database of the dedicated n8n-workflows cluster.
  name: allow-n8n-to-databases
  namespace: n8n
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: apps-secured-20260530
        io.kubernetes.pod.namespace: databases
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: n8n-workflows-20261027
        io.kubernetes.pod.namespace: databases
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: n8n

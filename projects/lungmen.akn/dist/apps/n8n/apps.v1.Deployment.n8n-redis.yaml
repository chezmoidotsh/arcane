---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-redis
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-redis
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - redis-server
        - --save
        - ""
        - --appendonly
        - "no"
        image: oci.chezmoi.sh/docker.io/library/redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 52678
          runAsNonRoot: true
          runAsUser: 52678
        volumeMounts:
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 52678
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: data

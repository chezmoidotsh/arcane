---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: webhook-processor
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: n8n
    app.kubernetes.io/version: 2.44.5
    helm.sh/chart: n8n-1.17.0
  name: n8n-webhook-processor
  namespace: n8n
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook-processor
      app.kubernetes.io/instance: n8n
      app.kubernetes.io/name: n8n
  template:
    metadata:
      annotations:
        checksum/config: 185114e55b3517235405d023dfefcd92e2f2e4125453f347038a5b6b04eea754
        checksum/secret: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
      labels:
        app.kubernetes.io/component: webhook-processor
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: n8n
        app.kubernetes.io/version: 2.44.5
        helm.sh/chart: n8n-1.17.0
    spec:
      containers:
      - args:
        - webhook
        command:
        - n8n
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              key: TZ
              name: n8n
        - name: DB_TYPE
          valueFrom:
            configMapKeyRef:
              key: DB_TYPE
              name: n8n
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            configMapKeyRef:
              key: DB_POSTGRESDB_DATABASE
              name: n8n
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_POSTGRESDB_HOST
              name: n8n
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_POSTGRESDB_PORT
              name: n8n
        - name: DB_POSTGRESDB_USER
          valueFrom:
            configMapKeyRef:
              key: DB_POSTGRESDB_USER
              name: n8n
        - name: DB_POSTGRESDB_SCHEMA
          valueFrom:
            configMapKeyRef:
              key: DB_POSTGRESDB_SCHEMA
              name: n8n
        - name: EXECUTIONS_MODE
          valueFrom:
            configMapKeyRef:
              key: EXECUTIONS_MODE
              name: n8n
        - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
          valueFrom:
            configMapKeyRef:
              key: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
              name: n8n
        - name: QUEUE_BULL_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              key: QUEUE_BULL_REDIS_HOST
              name: n8n
        - name: QUEUE_BULL_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              key: QUEUE_BULL_REDIS_PORT
              name: n8n
        - name: QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD
          valueFrom:
            configMapKeyRef:
              key: QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD
              name: n8n
        - name: QUEUE_WORKER_LOCK_DURATION
          valueFrom:
            configMapKeyRef:
              key: QUEUE_WORKER_LOCK_DURATION
              name: n8n
        - name: QUEUE_WORKER_LOCK_RENEW_TIME
          valueFrom:
            configMapKeyRef:
              key: QUEUE_WORKER_LOCK_RENEW_TIME
              name: n8n
        - name: QUEUE_WORKER_STALLED_INTERVAL
          valueFrom:
            configMapKeyRef:
              key: QUEUE_WORKER_STALLED_INTERVAL
              name: n8n
        - name: QUEUE_WORKER_MAX_STALLED_COUNT
          valueFrom:
            configMapKeyRef:
              key: QUEUE_WORKER_MAX_STALLED_COUNT
              name: n8n
        - name: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
          valueFrom:
            configMapKeyRef:
              key: N8N_GRACEFUL_SHUTDOWN_TIMEOUT
              name: n8n
        - name: N8N_WEBHOOK_URL
          valueFrom:
            configMapKeyRef:
              key: N8N_WEBHOOK_URL
              name: n8n
        - name: N8N_WEBHOOK_TIMEOUT
          valueFrom:
            configMapKeyRef:
              key: N8N_WEBHOOK_TIMEOUT
              name: n8n
        - name: N8N_EDITOR_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: N8N_EDITOR_BASE_URL
              name: n8n
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: n8n-database-n8n
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: N8N_ENCRYPTION_KEY
              name: n8n-conf
        - name: N8N_HOST
          valueFrom:
            secretKeyRef:
              key: N8N_HOST
              name: n8n-conf
        - name: N8N_PORT
          valueFrom:
            secretKeyRef:
              key: N8N_PORT
              name: n8n-conf
        - name: N8N_PROTOCOL
          valueFrom:
            secretKeyRef:
              key: N8N_PROTOCOL
              name: n8n-conf
        - name: NODE_OPTIONS
          value: --max-old-space-size-percentage=75
        - name: N8N_PROXY_HOPS
          value: "1"
        - name: N8N_DIAGNOSTICS_ENABLED
          value: "false"
        - name: N8N_VERSION_NOTIFICATIONS_ENABLED
          value: "false"
        - name: N8N_TEMPLATES_ENABLED
          value: "true"
        - name: N8N_EXTERNAL_SECRETS_PREFER_GET
          value: "true"
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/egress-inspection/ca.crt
        - name: N8N_COMMUNITY_PACKAGES_ENABLED
          value: "false"
        - name: N8N_CUSTOM_EXTENSIONS
          value: /opt/n8n-nodes/actual
        - name: N8N_AVAILABLE_BINARY_DATA_MODES
          value: filesystem,s3
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: s3
        - name: N8N_EXTERNAL_STORAGE_S3_HOST
          value: s3.chezmoi.sh
        - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME
          value: n8n-lungmen-akn
        - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_REGION
          value: fr-par-1
        - name: N8N_EXTERNAL_STORAGE_S3_FORCE_PATH_STYLE
          value: "true"
        - name: N8N_SSO_MANAGED_BY_ENV
          value: "true"
        - name: N8N_SSO_OIDC_LOGIN_ENABLED
          value: "true"
        - name: N8N_SSO_OIDC_DISCOVERY_ENDPOINT
          value: https://auth.chezmoi.sh/.well-known/openid-configuration
        - name: N8N_SSO_USER_ROLE_PROVISIONING
          value: instance_role
        envFrom:
        - secretRef:
            name: n8n-enterprise
        image: oci.chezmoi.sh/chezmoidotsh/n8n:2.44.6
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
        name: n8n-webhook-processor
        ports:
        - containerPort: 5678
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        volumeMounts:
        - mountPath: /etc/egress-inspection
          name: egress-inspection-ca
          readOnly: true
        - mountPath: /opt/n8n-nodes/actual
          name: n8n-nodes-actual
          readOnly: true
      - image: oci.chezmoi.sh/chezmoidotsh/n8n-self-license:2.44.6
        name: local-license-server
        resources:
          limits:
            cpu: 50m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 50Mi
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: n8n
      terminationGracePeriodSeconds: 60
      volumes:
      - name: egress-inspection-ca
        secret:
          items:
          - key: ca.crt
            path: ca.crt
          secretName: n8n-egress-inspection-ca
      - image:
          pullPolicy: IfNotPresent
          reference: oci.chezmoi.sh/ghcr.io/chezmoidotsh/n8n-nodes/actual:26.10.9
        name: n8n-nodes-actual

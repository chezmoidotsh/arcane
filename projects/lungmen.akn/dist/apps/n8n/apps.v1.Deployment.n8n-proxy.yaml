---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-proxy
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-proxy
    spec:
      automountServiceAccountToken: false
      containers:
      - image: oci.chezmoi.sh/docker.io/library/nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
        livenessProbe:
          periodSeconds: 10
          tcpSocket:
            port: http
        name: nginx
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 52678
          runAsNonRoot: true
          runAsUser: 52678
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: config
          readOnly: true
          subPath: nginx.conf
        - mountPath: /tmp
          name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: n8n-proxy
        name: config
      - emptyDir: {}
        name: tmp

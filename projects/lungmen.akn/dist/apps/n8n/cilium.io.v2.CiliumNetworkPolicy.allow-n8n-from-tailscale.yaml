---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Tailscale proxy created for the n8n-tailscale Ingress to reach n8n.
      The operator runs the proxy in tailscale-system and labels it with its parent resource.
  name: allow-n8n-from-tailscale
  namespace: n8n
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: tailscale-system
        tailscale.com/parent-resource: n8n-tailscale
        tailscale.com/parent-resource-ns: n8n
    toPorts:
    - ports:
      - port: "5678"
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Egress allowlist of n8n towards external services, over HTTPS (TCP 443) and restricted by
      FQDN, one rule set per pod role. The main and the webhook processor only need the instance
      itself (editor, OIDC login, binary data, logs, secrets); the worker runs the executions, so
      it is the one calling what workflows call. Open any new workflow dependency in the worker
      rule set. Everything not listed stays denied by default-hardened; the database, api.n8n.io
      and inbound traffic have their own policies. Actual Budget is reachable in-cluster
      (n8n-nodes-actual), paired with allow-actual-budget-from-n8n in the actual-budget namespace.
  name: allow-n8n-egress
  namespace: n8n
specs:
- egress:
  - toFQDNs:
    - matchName: s3.chezmoi.sh
    - matchName: auth.chezmoi.sh
    - matchName: data.o11y.chezmoi.sh
    - matchName: vault.chezmoi.sh
    - matchName: github.com
    - matchName: api.github.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - n8n
    - key: app.kubernetes.io/component
      operator: In
      values:
      - main
      - webhook-processor
      - worker
- egress:
  - toFQDNs:
    - matchName: openrouter.ai
    - matchName: api.github.com
    - matchName: github.com
    - matchName: release-assets.githubusercontent.com
    - matchName: objects.githubusercontent.com
    - matchName: api.osv.dev
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: actual-budget
        io.kubernetes.pod.namespace: actual-budget
    toPorts:
    - ports:
      - port: "5006"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/name: n8n

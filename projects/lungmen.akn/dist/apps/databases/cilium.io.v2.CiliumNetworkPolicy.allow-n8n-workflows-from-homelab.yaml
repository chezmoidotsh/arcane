---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the home network to reach the n8n-workflows PostgreSQL cluster through its LoadBalancer
      (n8n-workflows-lb): VLAN 2 (Home, where Dataiku runs) and VLAN 5 (Homelab). Everything else,
      including the other VLANs, stays denied. See docs/reference/IPAM-Reference.md.
  name: allow-n8n-workflows-from-homelab
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: n8n-workflows-20261027
  ingress:
  - fromCIDR:
    - 192.168.10.0/25
    - 10.0.0.0/22
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP

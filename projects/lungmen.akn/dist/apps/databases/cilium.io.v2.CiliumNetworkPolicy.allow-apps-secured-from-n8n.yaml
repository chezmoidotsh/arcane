---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: Allow declared application endpoints to
      connect to CNPG cluster 'apps-secured-20260530' for database 'n8n'.
  labels:
    app.kubernetes.io/instance: apps-secured-20260530
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mutualized-cnpg-databases
    helm.sh/chart: mutualized-cnpg-databases-0.1.0
    mutualized.cloudnative-pg.io/cluster: apps-secured-20260530
    mutualized.cloudnative-pg.io/database: n8n
    mutualized.cloudnative-pg.io/group: apps-secured
  name: allow-apps-secured-from-n8n
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: apps-secured-20260530
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: n8n
        io.kubernetes.pod.namespace: n8n
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP

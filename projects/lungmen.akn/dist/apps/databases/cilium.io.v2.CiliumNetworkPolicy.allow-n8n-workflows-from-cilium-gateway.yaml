---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the home network to reach the n8n-workflows PostgreSQL cluster through the TCPRoute
      n8n-workflows-postgresql. Cilium implements a TCPRoute as a plain L4 load balancer straight to the
      pod (no Envoy), so the clients are seen with the world identity, not reserved:ingress: either with
      their own address (VLAN 2 and 5), or SNATed to the Cilium router IP of the node that received the
      connection (lungmen.akn's pod CIDR, externalTrafficPolicy Cluster). Everything else stays denied.
  name: allow-n8n-workflows-from-cilium-gateway
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: n8n-workflows-20261027
  ingress:
  - fromCIDR:
    - 192.168.10.0/25
    - 10.0.0.0/22
    - 172.30.32.0/19
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP

---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  labels:
    app.kubernetes.io/instance: n8n-workflows-20261027
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mutualized-cnpg-databases
    helm.sh/chart: mutualized-cnpg-databases-0.1.0
    mutualized.cloudnative-pg.io/cluster: n8n-workflows-20261027
    mutualized.cloudnative-pg.io/database: workflows
    mutualized.cloudnative-pg.io/group: n8n-workflows
    mutualized.cloudnative-pg.io/user: n8n
  name: cnpg.n8n-workflows-workflows-n8n-credentials
spec:
  data:
  - conversionStrategy: None
    match:
      remoteRef:
        property: username
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: username
  - conversionStrategy: None
    match:
      remoteRef:
        property: password
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: password
  - conversionStrategy: None
    match:
      remoteRef:
        property: host
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: host
  - conversionStrategy: None
    match:
      remoteRef:
        property: port
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: port
  - conversionStrategy: None
    match:
      remoteRef:
        property: dbname
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: dbname
  - conversionStrategy: None
    match:
      remoteRef:
        property: uri
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: uri
  - conversionStrategy: None
    match:
      remoteRef:
        property: jdbc-uri
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: jdbc-uri
  - conversionStrategy: None
    match:
      remoteRef:
        property: pgpass
        remoteKey: n8n.chezmoi.sh/data/n8n-workflows-datastore-postgres
      secretKey: pgpass
  deletionPolicy: Delete
  refreshInterval: 5m
  secretStoreRefs:
  - kind: ClusterSecretStore
    name: vault.chezmoi.sh
  selector:
    secret:
      name: cnpg.n8n-workflows-workflows-n8n-credentials
  template:
    data:
      dbname: workflows
      host: n8n-workflows-20261027-rw.databases.svc
      jdbc-uri: jdbc:postgresql://n8n-workflows-20261027-rw.databases.svc:5432/workflows?user={{
        .username }}&password={{ .password }}
      password: '{{ .password }}'
      pgpass: n8n-workflows-20261027-rw.databases.svc:5432:workflows:{{ .username
        }}:{{ .password }}
      port: "5432"
      uri: postgresql://{{ .username }}:{{ .password }}@n8n-workflows-20261027-rw.databases.svc:5432/workflows
      username: '{{ .username }}'
  updatePolicy: Replace

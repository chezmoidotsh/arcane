---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the cert-manager controller to query the Quad9 recursive resolvers (9.9.9.9,
      149.112.112.112) on port 53 for its DNS-01 self-check. This network's internal DNS answers
      "chezmoi.sh NS" with ns.chezmoi.sh (a split-horizon-only BIND resolver, not one of the
      zone's real public Cloudflare NS records) - querying it directly for the self-check meant
      the ACME TXT record written via the Cloudflare solver was never found there, stalling every
      DNS-01 challenge forever. cert-manager is configured with
      dns01RecursiveNameservers/dns01RecursiveNameserversOnly (cert-manager.helmvalues/override.yaml,
      cluster-specific — not a repo-wide catalog default) to bypass that split-horizon NS answer
      entirely. The CIDRs here must match that override's nameserver IPs exactly.
  name: allow-cert-manager-to-nameservers
  namespace: cert-manager-system
spec:
  egress:
  - toCIDR:
    - 9.9.9.9/32
    - 149.112.112.112/32
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: cert-manager

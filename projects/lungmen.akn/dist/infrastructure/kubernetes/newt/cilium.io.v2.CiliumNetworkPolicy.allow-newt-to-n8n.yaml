---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Newt to reach n8n main (TCP 5678): the private `n8n` Pangolin resource targets its Service
      directly. It does not go through the Cilium Gateway: Envoy denies (403) requests coming from outside
      the n8n namespace.
  labels:
    app.kubernetes.io/name: newt
  name: allow-newt-to-n8n
  namespace: newt-system
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/component: main
        app.kubernetes.io/name: n8n
        io.kubernetes.pod.namespace: n8n
    toPorts:
    - ports:
      - port: "5678"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: newt

---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: descheduler
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: descheduler
    app.kubernetes.io/version: 0.37.0
    helm.sh/chart: descheduler-0.37.0
  name: descheduler
  namespace: descheduler-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      template:
        metadata:
          annotations:
            checksum/config: 700b041c1b576f5c56572ef93d91c6a78c7f423c4f34a01c9c110c616dc78993
          labels:
            app.kubernetes.io/instance: descheduler
            app.kubernetes.io/name: descheduler
          name: descheduler
        spec:
          containers:
          - args:
            - --policy-config-file=/policy-dir/policy.yaml
            - --dry-run=true
            - --v=3
            command:
            - /bin/descheduler
            image: oci.chezmoi.sh/registry.k8s.io/descheduler/descheduler:v0.37.0
            imagePullPolicy: IfNotPresent
            livenessProbe:
              failureThreshold: 3
              httpGet:
                path: /healthz
                port: 10258
                scheme: HTTPS
              initialDelaySeconds: 5
              periodSeconds: 20
              timeoutSeconds: 5
            name: descheduler
            ports:
            - containerPort: 10258
              protocol: TCP
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 500m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
            volumeMounts:
            - mountPath: /policy-dir
              name: policy-volume
          priorityClassName: system-cluster-critical
          restartPolicy: Never
          serviceAccountName: descheduler
          volumes:
          - configMap:
              name: descheduler
            name: policy-volume
  schedule: 0 */6 * * *
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3

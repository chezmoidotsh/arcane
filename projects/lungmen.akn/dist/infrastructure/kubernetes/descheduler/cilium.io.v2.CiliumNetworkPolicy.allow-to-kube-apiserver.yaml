---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows descheduler-system pods to reach the Kubernetes API server, required to read
      nodes, pods and PodDisruptionBudgets and to create pod evictions.
  name: allow-to-kube-apiserver
  namespace: descheduler-system
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector: {}

---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: atuin
  namespace: velero-system
spec:
  schedule: 0 */12 * * *
  template:
    includedNamespaces:
    - atuin
    includedResources:
    - pods
    - persistentvolumeclaims
    - persistentvolumes
    storageLocation: default
    ttl: 168h0m0s

    targetPort: metrics
  - name: pprof
    port: 8888
    protocol: TCP
    targetPort: pprof
  selector:
    app.kubernetes.io/instance: grafana-operator
    app.kubernetes.io/name: grafana-operator
  type: ClusterIP

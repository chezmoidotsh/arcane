---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Grafana Operator to reach the Kubernetes API server to watch/reconcile
      Grafana, GrafanaDashboard, and GrafanaDatasource custom resources cluster-wide.
  name: allow-o11y-system-to-kubernetes-api
  namespace: o11y-system
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator

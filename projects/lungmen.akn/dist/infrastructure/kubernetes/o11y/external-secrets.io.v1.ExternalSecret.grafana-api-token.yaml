---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-api-token
  namespace: o11y-system
spec:
  data:
  - remoteRef:
      key: lungmen.akn/o11y/grafana/api-token
      property: token
    secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    creationPolicy: Owner
    name: grafana-api-token

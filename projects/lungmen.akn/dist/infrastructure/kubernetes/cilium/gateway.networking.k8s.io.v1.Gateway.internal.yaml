---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    argocd.argoproj.io/description: |
      Cilium Gateway API gateway for lungmen.akn's talosnet-only ingress plane. Gets its
      LoadBalancer IP from the "internal" CiliumLoadBalancerIPPool (lungmen.akn's 2-address slice
      of talosnet, 10.128.0.242/243) instead of "external" (VLAN5, the catch-all default) —
      reachable only from other Talos nodes/SDN-attached hosts, never from VLAN2/VLAN5
      home-network clients. See docs/network/ipam.md "Internal LoadBalancer Pools (talosnet)".
      Same *.chezmoi.sh hostnames as the "external" Gateway — split-horizon: talosnet-dns (BIND,
      RFC2136-updated by external-dns) answers this IP for those names, everyone else gets
      "external"'s VLAN5 IP via Unifi. See
      projects/chezmoi.sh/src/infrastructure/proxmox/lxc/talosnet-dns/modules/bind.nix.
      Apps attach one HTTPRoute here AND to "external" (same hostname, both parentRefs) rather
      than a route per Gateway — external-dns-bind's --gateway-label-filter
      (external-dns.chezmoi.sh/zone=internal) picks this Gateway's parent out of the route's
      status.parents and ignores "external"'s, so no per-route annotation is needed either.
  labels:
    external-dns.chezmoi.sh/zone: internal
  name: internal
  namespace: kube-system
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      io.cilium/lb-ipam-pool: internal
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.chezmoi.sh'
    name: chezmoi.sh-websecure
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard.chezmoi.sh-certificate
      mode: Terminate
  - allowedRoutes:
      namespaces:
        from: All
    hostname: '*.lab.chezmoi.sh'
    name: lab.chezmoi.sh-websecure
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard.chezmoi.sh-certificate
      mode: Terminate

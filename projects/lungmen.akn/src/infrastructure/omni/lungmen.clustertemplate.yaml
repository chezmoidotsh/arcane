# =============================================================================
# Omni cluster template — lungmen.akn (Talos-on-Proxmox-VE).
# =============================================================================
#
# Derived from catalog/omni/clustertemplates/base.yaml. This is a STANDALONE
# FULL COPY — no kustomize overlays, because omnictl rejects the apiVersion /
# metadata fields that kustomize requires. Edits are made in place.
#
# Overrides relative to the base:
#   Cluster.name                   lungmen-akn            (was base-default)
#   cluster.network.podSubnets     172.30.32.0/19         (ADR-014: lungmen pod CIDR — unique per cluster)
#   Workers.machineClass.size      3                      (base default is 2; lungmen's real workload —
#                                                          immich/jellyfin/n8n/paperless/forgejo/databases —
#                                                          measured ~9Gi steady-state on the current
#                                                          all-in-one node, which doesn't fit a single
#                                                          w1.large's ~7.5-7.8Gi allocatable during a
#                                                          one-at-a-time rolling Talos update; 3 nodes
#                                                          leaves 16Gi allocatable on the 2 survivors)
#   machine.kubelet.extraArgs.cloud-provider  external  (REQUIRED from day one — the
#     Proxmox CCM silently no-ops without it, and providerID is immutable once a
#     node registers; fixing this later means delete+recreate the node. See
#     rhodes.clustertemplate.yaml and .agents/sessions/20260720-rhodes-cluster-bringup-planning.md.)
#
# NOTE: serviceSubnets (172.31.0.0/19) and clusterDNS (172.31.0.10) match the SHARED
# defaults in the base template. They are duplicated here because this is a standalone
# full-copy (omnictl requires all fields present — no overlays). All clusters share the
# same service CIDR for ClusterMesh readiness (see ADR-014, ipam.md).
#
# Validate (offline, no Omni connectivity):
#   omnictl cluster template validate -f <file>
# Apply (requires OMNICONFIG from `mise run bao:login:admin` in chezmoi.sh):
#   omnictl cluster template sync -f <file>
# NOTE: `omnictl apply -f` is the generic COSI resource command (metadata/spec YAML) and cannot parse this
# kind:Cluster/ControlPlane/Workers template DSL — it fails with "yaml: construct errors: ... expected 4
# elements node, got N". `cluster template sync -f <single-file>` is scoped to this one cluster only, same
# as apply would have been; the multi-cluster/delete risk only applies when -f points at a directory.
#
# Cross-references:
#   catalog/omni/clustertemplates/base.yaml              (reference base)
#   ADR-014  docs/decisions/014-network-topology.md      (CIDR / DNS decisions)
#   docs/network/ipam.md                                (VLAN 5 / SDN VNet layout)
#   catalog/omni/machineclasses/                          (machine class defs)
# =============================================================================
---
kind: Cluster
name: lungmen-akn
kubernetes:
  version: v1.35.0
talos:
  version: v1.13.2 # v-prefix mandatory for omnictl validate
features:
  diskEncryption: false # PVE VMs have no vTPM by default
  enableWorkloadProxy: false
  # Self-hosted Omni does not run the embedded discovery service (no
  # --embedded-discovery-service-enabled flag), and KubeSpan is unused (native
  # routing). Discovery is disabled entirely via the cluster-common patch below.
  useEmbeddedDiscoveryService: false
  backupConfiguration:
    interval: 6h # requires etcd backup infra configured in Omni; offline validate passes
systemExtensions:
  - siderolabs/qemu-guest-agent # clean PVE ACPI shutdown/restart
  - siderolabs/iscsi-tools # proxmox-csi-plugin
  - siderolabs/util-linux-tools
patches:
  - name: dual-nic
    inline:
      machine:
        network:
          interfaces:
            - interface: eth0 # vmbr1 trunk, NO IP — Proxmox tags VLAN 5; Cilium L2 ARP only
            - interface: eth1 # talosnet SDN VNet (DHCP; MTU 1450 pre-set for future VXLAN migration)
              dhcp: true
              mtu: 1450
  - name: machine-common
    inline:
      machine:
        features:
          hostDNS:
            enabled: true
            forwardKubeDNSToHost: true
            resolveMemberNames: true
        kubelet:
          clusterDNS:
            - 172.31.0.10 # Shared service CIDR default (all clusters, ClusterMesh-ready)
          extraArgs:
            rotate-server-certificates: "true" # enables kubelet-serving-cert-approver
            # REQUIRED from day one — Proxmox CCM silently no-ops otherwise, and
            # providerID is immutable post-registration (see rhodes.clustertemplate.yaml
            # and .agents/sessions/20260720-rhodes-cluster-bringup-planning.md).
            cloud-provider: external
          extraConfig:
            featureGates:
              UserNamespacesSupport: true
              ImageVolume: true
        sysctls:
          user.max_user_namespaces: "11255"
  - name: cluster-common
    inline:
      cluster:
        network:
          cni:
            name: custom
            urls:
              # Pinned to the same SHA rhodes.akn uses (already proven live): the
              # 1.19.5-native.yaml pin previously here predates the fix that adds a
              # toleration for node.cloudprovider.kubernetes.io/uninitialized on the
              # installer Job. Without it, cloud-provider=external (below) taints every
              # node and the Job can never schedule — a permanent deadlock, not a
              # transient delay (see the manifest's own comment).
              - https://raw.githubusercontent.com/chezmoidotsh/arcane/09f0b0a42929e86bedc882f894884b5eb1d80e59/catalog/talos/manifests/cilium/1.20.0-native.yaml
          podSubnets:
            - 172.30.32.0/19
          serviceSubnets:
            - 172.31.0.0/19 # Shared across all clusters (ClusterMesh-ready)
        proxy:
          disabled: true # Cilium kubeProxyReplacement=true replaces kube-proxy
        discovery:
          enabled: false # KubeSpan unused (native routing); embedded service not enabled in Omni — nodes join via the Kubernetes API
        allowSchedulingOnControlPlanes: false # taint stays; only workloads with explicit CP tolerations run there (Cilium, o11y DaemonSets)
        apiServer:
          extraArgs:
            feature-gates: UserNamespacesSupport=true,ImageVolume=true
        extraManifests:
          # Pinned to the same SHA as the Cilium manifest above (matches rhodes.akn).
          - https://raw.githubusercontent.com/chezmoidotsh/arcane/09f0b0a42929e86bedc882f894884b5eb1d80e59/catalog/talos/manifests/kubelet-serving-cert-approver/0.11.0.yaml
          - https://raw.githubusercontent.com/chezmoidotsh/arcane/09f0b0a42929e86bedc882f894884b5eb1d80e59/catalog/talos/manifests/metric-server/0.8.1.yaml
---
kind: ControlPlane
machineClass:
  name: c1.minimal # V2 dual-NIC (catalog/omni/machineclasses/c1.minimal.yaml)
  size: 1 # single control-plane; c1.minimal is sized for etcd + API server
---
kind: Workers
name: workers
machineClass:
  name: w1.large # V2 dual-NIC (catalog/omni/machineclasses/w1.large.yaml)
  size: 3 # lungmen topology: sized to survive a one-at-a-time Talos reboot under real load, see note above
updateStrategy:
  rolling:
    maxParallelism: 1

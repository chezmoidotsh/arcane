---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

resources:
  - ../../../../../../catalog/kustomize/tun-device-plugin

images:
  - name: ghcr.io/squat/generic-device-plugin
    newName: oci.chezmoi.sh/ghcr.io/squat/generic-device-plugin

patches:
  # Log formats of the pods (ADR-020). go-kit logfmt; no line seen in 7 days.
  - target: {kind: DaemonSet, name: tun-device-plugin}
    patch: |-
      - {op: add, path: /spec/template/metadata/annotations, value: {o11y.chezmoi.sh/log-format: logfmt}}

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Newt to reach the n8n MCP proxy (TCP 8080): the private `mcp-n8n` Pangolin resource
      targets its Service (apps/n8n/n8n.mcp.remoteproxy.yaml).
  name: allow-newt-to-n8n-mcp
  namespace: newt-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: newt
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: n8n
            app.kubernetes.io/instance: n8n-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: descheduler-system

resources:
  - security

helmCharts:
  - repo: https://kubernetes-sigs.github.io/descheduler/
    name: descheduler
    # oripathy: type=helm upstream=github.com/kubernetes-sigs/descheduler tagPrefix=v
    version: 0.37.0

    releaseName: descheduler
    namespace: descheduler-system

    valuesFile: descheduler.helmvalues/default.yaml

images:
  - name: registry.k8s.io/descheduler/descheduler
    newName: oci.chezmoi.sh/registry.k8s.io/descheduler/descheduler
    # oripathy: type=oci upstream=github.com/kubernetes-sigs/descheduler tagPrefix=v digest=false
    newTag: v0.37.0

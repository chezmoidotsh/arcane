apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Tailscale operator and proxies to reach the Tailscale control plane and DERP
      relays, and nothing else on the Internet. Direct WireGuard connections to peers (UDP) are
      not allowed: traffic goes through the DERP relays over HTTPS, which is slower but needs
      no wide-open UDP egress.
      Hostnames and ports: https://tailscale.com/kb/1082/firewall-ports (api.tailscale.com is
      used by the operator to mint auth keys with its OAuth client).
  name: allow-tailscale-to-control-plane
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        - matchName: controlplane.tailscale.com
        - matchName: login.tailscale.com
        - matchName: log.tailscale.com
        - matchName: api.tailscale.com
        - matchPattern: derp*.tailscale.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchPattern: derp*.tailscale.com
      toPorts:
        - ports:
            - port: "3478"
              protocol: UDP

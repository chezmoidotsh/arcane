apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Tailscale operator and proxies to reach the Tailscale control plane and API
      over HTTPS: coordination, login, logging and the API used by the operator to mint auth
      keys with its OAuth client. These are reached by name, so a toFQDNs list works.
      The DERP relays and STUN servers are not reached by name, see
      network-policy.allow-tailscale-to-derp.yaml (generated).
      Hostnames and ports: https://tailscale.com/kb/1082/firewall-ports
  name: allow-tailscale-to-control-plane
spec:
  endpointSelector: {}
  egress:
    - toFQDNs:
        - matchName: controlplane.tailscale.com
        - matchName: login.tailscale.com
        - matchName: log.tailscale.com
        - matchName: api.tailscale.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

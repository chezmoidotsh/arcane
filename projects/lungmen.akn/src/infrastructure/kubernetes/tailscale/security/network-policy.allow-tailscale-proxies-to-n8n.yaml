apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Tailscale proxy created for the n8n-tailscale Ingress to reach n8n.
      Proxies carry the tailscale.com/managed label set by the operator.
  name: allow-tailscale-proxies-to-n8n
spec:
  endpointSelector:
    matchLabels:
      tailscale.com/managed: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: n8n
            app.kubernetes.io/name: n8n
      toPorts:
        - ports:
            - port: "5678"
              protocol: TCP

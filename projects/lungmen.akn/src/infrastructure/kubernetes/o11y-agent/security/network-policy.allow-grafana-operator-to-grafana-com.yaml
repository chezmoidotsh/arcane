---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Grafana Operator to fetch published dashboard JSON from grafana.com
      (grafanaCom.id/revision references) or raw.githubusercontent.com (url references, e.g.
      victoriametrics-overview). Its calls to the Grafana API are covered by a per-cluster
      policy: in-cluster instance on rhodes.akn, external instance elsewhere.
  name: allow-grafana-operator-to-grafana-com
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
  egress:
    - toFQDNs:
        - matchName: grafana.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

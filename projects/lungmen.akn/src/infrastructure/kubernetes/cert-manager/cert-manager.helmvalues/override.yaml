---
# talosnet's internal DNS answers "chezmoi.sh NS" with ns.chezmoi.sh (a
# split-horizon-only resolver), not the zone's real Cloudflare nameservers —
# cert-manager's DNS-01 self-check queries whatever NS the lookup returns, so
# it stalls forever checking a server that never has the TXT record. Force
# Quad9 (9.9.9.9 / 149.112.112.112) instead — matches rhodes.akn's override,
# not a repo-wide catalog default.
dns01RecursiveNameservers: "9.9.9.9:53,149.112.112.112:53"
dns01RecursiveNameserversOnly: true

# The other cert-manager images (controller/webhook/cainjector) are mirrored via the
# kustomize images: transformer, which rewrites container image: fields. The acmesolver
# image is passed as a --acme-http01-solver-image= CLI flag value instead, a plain string
# the transformer can't reach, so it needs a real Helm value override here. Dead in
# practice today (lungmen.akn only uses DNS-01), but keeps it correct if HTTP-01 is ever
# used.
acmesolver:
  image:
    repository: oci.chezmoi.sh/quay.io/jetstack/cert-manager-acmesolver

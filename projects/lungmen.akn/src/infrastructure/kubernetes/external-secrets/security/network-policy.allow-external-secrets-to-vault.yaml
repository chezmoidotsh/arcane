apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows external-secrets to reach OpenBao (vault.chezmoi.sh) for Kubernetes-auth login.
      Unlike rhodes.akn (which hosts OpenBao itself and can use toEntities: cluster), lungmen.akn
      reaches it across clusters, so this needs an explicit FQDN egress rule.
  name: allow-external-secrets-to-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toFQDNs:
        - matchName: vault.chezmoi.sh
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

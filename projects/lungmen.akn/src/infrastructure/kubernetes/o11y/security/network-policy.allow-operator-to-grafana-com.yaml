apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Grafana Operator to fetch published dashboard JSON from
      grafana.com (grafanaCom.id/revision references, e.g. node-exporter-full)
      -- distinct from the operator's own API calls to the external rhodes.akn
      Grafana instance, which are covered by allow-operator-to-grafana-api.yaml.
  name: allow-operator-to-grafana-com
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
  egress:
    - toFQDNs:
        - matchName: grafana.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

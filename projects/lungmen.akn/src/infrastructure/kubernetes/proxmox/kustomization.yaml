    newTag: v0.19.1
  - name: ghcr.io/sergelogvinov/proxmox-csi-node
    newName: oci.chezmoi.sh/ghcr.io/sergelogvinov/proxmox-csi-node
    # oripathy: type=oci upstream=github.com/sergelogvinov/proxmox-csi-plugin tagPrefix=v digest=false
    newTag: v0.19.1
  - name: registry.k8s.io/sig-storage/csi-attacher
    newName: oci.chezmoi.sh/registry.k8s.io/sig-storage/csi-attacher
    # oripathy: type=oci upstream=github.com/kubernetes-csi/external-attacher tagPrefix=v digest=false
    newTag: v4.10.0
  - name: registry.k8s.io/sig-storage/csi-node-driver-registrar

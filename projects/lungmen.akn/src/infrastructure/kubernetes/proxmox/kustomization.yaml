    # oripathy: type=oci upstream=github.com/kubernetes-csi/external-provisioner tagPrefix=v digest=false
    newTag: v5.3.0
  - name: registry.k8s.io/sig-storage/csi-resizer
    newName: oci.chezmoi.sh/registry.k8s.io/sig-storage/csi-resizer
    # oripathy: type=oci upstream=github.com/kubernetes-csi/external-resizer tagPrefix=v digest=false
    newTag: v1.14.0
  - name: registry.k8s.io/sig-storage/livenessprobe

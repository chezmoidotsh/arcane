---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://paperless.chezmoi.sh
  name: paperless-ngx-websecure
spec:
  hostnames:
    - paperless.chezmoi.sh
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: kube-system
      sectionName: chezmoi.sh-websecure
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: kube-system
      sectionName: chezmoi.sh-websecure
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: paperless-ngx
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

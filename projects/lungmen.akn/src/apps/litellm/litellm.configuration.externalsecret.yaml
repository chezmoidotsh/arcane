---
# Master/salt keys, OIDC client and OpenRouter API key (created by hand in OpenBao), injected as env vars (environmentSecrets) and as
# the master key secret, see litellm.helmvalues/default.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-conf
spec:
  data:
    - secretKey: master_key
      remoteRef:
        key: lungmen.akn/litellm/auth/keys
        property: master_key
    - secretKey: salt_key
      remoteRef:
        key: lungmen.akn/litellm/auth/keys
        property: salt_key
    - secretKey: oidc_client_id
      remoteRef:
        key: lungmen.akn/litellm/auth/oidc-client
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: lungmen.akn/litellm/auth/oidc-client
        property: client_secret
    - secretKey: openrouter_api_key
      remoteRef:
        key: lungmen.akn/litellm/providers/openrouter
        property: api_key
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: litellm-conf
    template:
      type: Opaque
      engineVersion: v2
      data:
        masterkey: "{{ .master_key }}"
        LITELLM_SALT_KEY: "{{ .salt_key }}"
        GENERIC_CLIENT_ID: "{{ .oidc_client_id }}"
        GENERIC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OPENROUTER_API_KEY: "{{ .openrouter_api_key }}"

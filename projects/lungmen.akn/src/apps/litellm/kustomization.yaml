---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm

helmCharts:
  # Official chart, maintained by BerriAI (https://github.com/BerriAI/litellm)
  - repo: oci://ghcr.io/berriai
    name: litellm-helm
    # renovate: datasource=docker depName=ghcr.io/berriai/litellm-helm
    version: 1.105.1

    releaseName: litellm
    namespace: litellm
    skipTests: true

    valuesFile: litellm.helmvalues/default.yaml

resources:
  - litellm.configuration.externalsecret.yaml
  - litellm.database.externalsecret.yaml
  - litellm.httproute.yaml

  - security/

images:
  # The chart takes its tag from its appVersion: only the registry is rewritten.
  - name: ghcr.io/berriai/litellm
    newName: oci.chezmoi.sh/ghcr.io/berriai/litellm

patches:
  # Log formats of the pods (ADR-020). No line seen yet to pick a parser.
  - target: {kind: Deployment, name: litellm}
    patch: |-
      - {op: add, path: /spec/template/metadata/annotations/o11y.chezmoi.sh~1log-format, value: none}
  - target: {kind: Job, name: litellm-migrations}
    patch: |-
      - {op: add, path: /spec/template/metadata/annotations, value: {o11y.chezmoi.sh/log-format: none}}

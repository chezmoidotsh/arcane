---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkding

labels:
  - pairs:
      app.kubernetes.io/name: linkding
      app.kubernetes.io/instance: linkding
    includeTemplates: true
    includeSelectors: true

resources:
  - linkding.configuration.externalsecret.yaml
  - linkding.database.externalsecret.yaml
  - linkding.deployment.yaml
  - linkding.httproute.yaml

  - security/

# -- Held at 0 until cutover (issue 1188, PR2) — even though linkding has no PVC of its own
# (bookmarks live in the already-restored CNPG database), starting it now would let it write
# to this cluster's DB clone while the old cluster's live linkding keeps writing to its own,
# diverging the two. Revert in PR3.
replicas:
  - name: linkding
    count: 0

images:
  # renovate: datasource=docker depName=docker.io/sissbruecker/linkding
  - name: docker.io/sissbruecker/linkding
    newName: oci.chezmoi.sh/docker.io/sissbruecker/linkding
    newTag: "1.45.0-alpine"

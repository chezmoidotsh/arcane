---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellyfin

labels:
  - pairs:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
    includeTemplates: true
    includeSelectors: true

resources:
  - jellyfin.httproute.yaml
  - jellyfin.smb-storage.yaml
  - jellyfin.statefulset.yaml
  - security/

# -- Held at 0 until PVs are restored from the old lungmen.akn cluster (issue 1188, PR2).
# Revert in PR3 once volume restoration is validated and it's time to cut over.
replicas:
  - name: jellyfin
    count: 0

images:
  # renovate: datasource=docker depName=ghcr.io/jellyfin/jellyfin
  - name: ghcr.io/jellyfin/jellyfin
    newName: oci.chezmoi.sh/ghcr.io/jellyfin/jellyfin
    newTag: 10.11.10

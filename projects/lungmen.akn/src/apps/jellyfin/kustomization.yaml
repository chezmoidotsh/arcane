---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellyfin

labels:
  - pairs:
      app.kubernetes.io/name: jellyfin
      app.kubernetes.io/instance: jellyfin
    includeTemplates: true
    includeSelectors: true

resources:
  - jellyfin.httproute.yaml
  - jellyfin.smb-storage.yaml
  - jellyfin.statefulset.yaml
  - security/

images:
  - name: ghcr.io/jellyfin/jellyfin
    newName: oci.chezmoi.sh/ghcr.io/jellyfin/jellyfin
    # oripathy: type=oci upstream=github.com/jellyfin/jellyfin tagPrefix=v digest=false
    newTag: "12.3"

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich

labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/instance: immich
    includeTemplates: true
    includeSelectors: true

resources:
  - immich.configuration.externalsecret.yaml
  - immich.database.externalsecret.yaml
  - immich.httproute.yaml
  - immich.machine-learning.yaml
  - immich.redis.yaml
  - immich.server.yaml
  - immich.smb-storage.yaml

  - security/

images:
  # Personal fork of immich-server (github.com/xunleii/immich)
  - name: ghcr.io/immich-app/immich-server
    newName: oci.chezmoi.sh/ghcr.io/xunleii/immich-server
    # oripathy: type=oci upstream=github.com/immich-app/immich tagPrefix=v name=immich digest=false
    newTag: v3.2.0-rc.1-fork-202608291401
  - name: ghcr.io/immich-app/immich-machine-learning
    newName: oci.chezmoi.sh/ghcr.io/immich-app/immich-machine-learning
    # oripathy: type=oci upstream=github.com/immich-app/immich tagPrefix=v digest=false
    newTag: v3.1.0
  - name: docker.io/library/redis
    newName: oci.chezmoi.sh/docker.io/library/redis
    # oripathy: type=oci upstream=github.com/redis/redis digest=true
    newTag: 8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
  - name: ghcr.io/tensorchord/pgvecto-rs
    newTag: pg14-v0.3.0-rootless@sha256:23ac462edc9eba6df7df92d447780950aa20a34ba4a9c11c0f4ddab3a30a64b1

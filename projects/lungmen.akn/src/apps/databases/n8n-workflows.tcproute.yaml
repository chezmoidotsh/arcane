apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: n8n-workflows-postgresql
  annotations:
    # external-dns-unifi publishes the Gateway address under this name (a TCPRoute has no hostnames).
    external-dns.kubernetes.io/hostname: datastore.n8n.chezmoi.sh
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: kube-system
      sectionName: n8n-workflows-postgresql
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: n8n-workflows-20261027-rw
          port: 5432
          weight: 1

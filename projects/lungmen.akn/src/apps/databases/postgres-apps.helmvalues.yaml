---
apiVersion: helm.sh/v1alpha1
kind: CNPGMutualizedCluster

metadata:
  # -- Stable prefix for isolation; ensures unique names for all generated resources.
  name: apps

spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh

  behavior:
    passwords:
      # -- Ensures Vault remains a near-real-time source of truth for app credentials.
      pushInterval: "5m"
    networkPolicies:
      enabled: true

  cluster:
    # -- Unique generation ID; allows for side-by-side cluster deployments during upgrades.
    name: "20260329"
    description: "Shared PostgreSQL database cluster for common applications"
    # -- Disabled to minimize overhead on non-critical workloads.
    enablePDB: false
    imageCatalogRef:
      apiGroup: postgresql.cnpg.io
      kind: ClusterImageCatalog
      name: default
      major: 17
    # -- Optimized for resource efficiency; non-HA is acceptable for this tier.
    instances: 1
    storage:
      size: 2Gi
    # -- WAL archiving is disabled (isWALArchiver: false), so WALs are recycled
    # automatically after each checkpoint. 2Gi is ample for max_wal_size: 100MB.
    walStorage:
      size: 2Gi
    postgresql:
      parameters:
        max_slot_wal_keep_size: 900MB
        max_wal_size: 100MB

    # -- Bootstrap from the old lungmen.akn cluster's last backup, as part of the Omni
    # cluster recreation (issue 1188). CNPG restores the base backup and replays available
    # WALs to reach consistency. After bootstrap this block is ignored on subsequent
    # reconciliations — see docs/procedures/databases/DB-20260723-00.cnpg-restore-from-object-store.md.
    bootstrap:
      recovery:
        source: 2026-03-29T09:29:29.483Z

    # -- Source cluster for bootstrap recovery
    externalClusters:
      - name: 2026-03-29T09:29:29.483Z
        plugin:
          enabled: true
          isWALArchiver: false
          name: barman-cloud.cloudnative-pg.io
          parameters:
            barmanObjectName: apps-selfhosted
            serverName: 01KMWETKMBK0MYNB3X7RH6BT0X # 2026-03-29T09:29:29.483Z

    plugins:
      - enabled: true
        # -- WAL archiving disabled: PostgreSQL recycles WALs automatically after checkpoint.
        # This prevents WAL disk fill-up even when S3 is unavailable.
        # Trade-off: no PITR — recovery relies on daily base backups (see apps.scheduledbackup.yaml).
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: apps-selfhosted
          serverName: 01KZ6Z12N7M9TZ4GK83C992AVD # 2026-08-04T18:02:01.255Z

  databases:
    - name: linkding
      users:
        - name: linkding
          vault:
            path: lungmen.akn/data/linkding/database/postgresql
      allowedApplicationSelector:
        - endpointSelector:
            - matchLabels:
                io.kubernetes.pod.namespace: linkding
                app.kubernetes.io/name: linkding

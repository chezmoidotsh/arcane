# external-dns (v0.23) creates nothing from the hostname annotation of a TCPRoute, so the record of the
# n8n workflows database is declared here. The target is the address of the external Gateway
# (10.0.0.72, first IP of lungmen.akn's "external" pool), which is where the TCPRoute listens on 5432.
# Published in UniFi by external-dns-unifi (A records only), for the clients of VLAN 2.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: n8n-workflows-datastore
spec:
  endpoints:
    - dnsName: datastore.n8n.chezmoi.sh
      recordType: A
      recordTTL: 300
      targets:
        - "10.0.0.72"

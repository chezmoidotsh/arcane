---
# One-shot copy of the n8n database from postgres-apps (apps-20260329) to postgres-apps-secured
# (apps-secured-20260530). n8n is scaled to 0 by the same change, so nothing writes meanwhile.
#
# Runs as a PostSync hook, once the new database exists. Safe to sync again: it does nothing when
# the destination already holds tables, so it can never overwrite data written after the cutover, and
# fails while n8n is still connected to the source database.
# Remove this file (and the PostSync hook with it) once the migration is done.
#
# No NetworkPolicy needed: default-hardened lets pods of this namespace talk to the clusters.
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-db-copy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-db-copy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: oci.chezmoi.sh/ghcr.io/tensorchord/vchord-postgres:pg17-v1.1.1
          imagePullPolicy: Always
          command: [bash, -euo, pipefail, -c]
          args:
            - |
              src() { PGPASSWORD="$(cat /secrets/src/password)" "$@" -h apps-20260329-rw -U n8n -d n8n; }
              dst() { PGPASSWORD="$(cat /secrets/dst/password)" "$@" -h apps-secured-20260530-rw -U n8n -d n8n; }

              # Exact row count of every table, one "table|count" line each.
              counts='select table_name || chr(124) || (xpath($$/row/c/text()$$, query_to_xml(format($$select count(*) as c from %I.%I$$, table_schema, table_name), false, true, $$$$)))[1]::text from information_schema.tables where table_schema = $$public$$ and table_type = $$BASE TABLE$$ order by 1'

              # The role and its password are reconciled by CNPG after the sync: wait until it can log in
              # (bounded by activeDeadlineSeconds).
              echo "waiting for the destination database"
              until dst psql -qAt -c 'select 1' >/dev/null 2>&1; do sleep 5; done

              tables=$(dst psql -qAt -c "select count(*) from information_schema.tables where table_schema = 'public'")
              if [ "$tables" != "0" ]; then
                echo "destination already holds $tables tables: nothing to do"
                exit 0
              fi

              # The scale-down lives in the n8n app, which ArgoCD does not order against this one: refuse to
              # copy while n8n is still connected to the source (its role sees its own sessions).
              active=$(src psql -qAt -c "select count(*) from pg_stat_activity where datname = 'n8n' and usename = 'n8n' and pid <> pg_backend_pid()")
              if [ "$active" != "0" ]; then
                echo "n8n still holds $active connection(s) on the source database: sync the n8n app first (scale to 0), then run this Job again"
                exit 1
              fi

              echo "copying the database"
              src pg_dump --format=custom --no-owner --no-acl --file=/tmp/n8n.dump
              dst pg_restore --no-owner --no-acl --exit-on-error --dbname=n8n /tmp/n8n.dump

              echo "comparing row counts"
              src psql -qAt -c "$counts" >/tmp/src.counts
              dst psql -qAt -c "$counts" >/tmp/dst.counts
              diff /tmp/src.counts /tmp/dst.counts
              echo "done: $(wc -l </tmp/dst.counts) tables copied and identical"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: src-credentials
              mountPath: /secrets/src
              readOnly: true
            - name: dst-credentials
              mountPath: /secrets/dst
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: src-credentials
          secret:
            secretName: cnpg.apps-n8n-n8n-credentials
        - name: dst-credentials
          secret:
            secretName: cnpg.apps-secured-n8n-n8n-credentials

apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: postgresql-vchord
spec:
  images:
    - major: 15
      image: oci.chezmoi.sh/ghcr.io/tensorchord/vchord-postgres:pg15-v1.1.1
    - major: 16
      image: oci.chezmoi.sh/ghcr.io/tensorchord/vchord-postgres:pg16-v1.1.1

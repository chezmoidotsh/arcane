      image: oci.chezmoi.sh/ghcr.io/tensorchord/vchord-postgres:pg17-v1.1.1
    - major: 18
      image: oci.chezmoi.sh/ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1

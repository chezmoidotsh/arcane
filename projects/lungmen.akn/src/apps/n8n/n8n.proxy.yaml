# trunk-ignore-all(checkov/CKV_K8S_10,checkov/CKV_K8S_11,checkov/CKV_K8S_43,trivy/KSV015,trivy/KSV016): Stateless path splitter, small enough not to need limits
# trunk-ignore(checkov/CKV2_K8S_6): Reachable from Newt only (security/network-policy.allow-n8n-proxy-from-newt.yaml)
# Entry point of the private Pangolin resource (n8n.chezmoi.sh). A private resource has a single
# destination, while n8n needs two: main serves the editor (production webhooks are disabled on it),
# the webhook processor serves webhooks, forms and MCP. Same split as n8n.httproute.yaml, but the
# Cilium Gateway cannot be used here: Envoy answers 403 to any client outside the n8n namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-proxy
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    events {}
    http {
      include /etc/nginx/mime.types;
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      map $http_upgrade $connection_upgrade { default upgrade; "" close; }

      server {
        listen 8080;
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location ~ ^/(webhook|webhook-waiting|form|form-waiting|mcp)(/|$) {
          proxy_pass http://n8n-webhook-processor:5678;
        }
        location / {
          proxy_pass http://n8n-main:5678;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-proxy
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: docker.io/library/nginx
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: n8n-proxy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-proxy
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: n8n-proxy

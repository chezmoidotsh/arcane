---
# Standalone mode: a single n8n process (UI, webhooks and executions) backed by
# the mutualized PostgreSQL cluster. Queue mode (workers + Valkey) can be enabled
# later without migrating data, everything lives in PostgreSQL.
queueMode:
  enabled: false
redis:
  enabled: false

# docker.n8n.io (the chart default) is not mirrored by the OCI registry.
image:
  repository: ghcr.io/n8n-io/n8n

# Standalone mode with a single process: never run two pods at once (duplicated
# triggers during a rollout).
strategy:
  type: Recreate

# No local persistent storage: workflows/credentials live in PostgreSQL, binary
# data in S3 (see `config.extraEnv`) and the pod only gets an emptyDir.
persistence:
  enabled: false

resources:
  main:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 2Gi

database:
  type: postgresdb
  useExternal: true
  host: apps-20260329-rw.databases.svc.cluster.local
  port: 5432
  database: n8n
  user: n8n
  passwordSecret:
    name: n8n-database-n8n
    key: password

# N8N_ENCRYPTION_KEY, N8N_HOST, N8N_PORT and N8N_PROTOCOL come from the
# `n8n-conf` Secret (see n8n.configuration.externalsecret.yaml).
secretRefs:
  existingSecret: n8n-conf

editor:
  url: https://n8n.chezmoi.sh
webhook:
  url: https://n8n.chezmoi.sh

config:
  timezone: Europe/Paris
  extraEnv:
    # Traffic reaches n8n through Pangolin (Traefik) or the Cilium Gateway.
    - name: N8N_PROXY_HOPS
      value: "1"

    # Keep calls to n8n's servers (api.n8n.io, telemetry) to the strict minimum: only the
    # templates and MCP servers catalogs are wanted (see security/).
    - name: N8N_DIAGNOSTICS_ENABLED
      value: "false"
    - name: N8N_VERSION_NOTIFICATIONS_ENABLED
      value: "false"
    - name: N8N_TEMPLATES_ENABLED
      value: "true"

    # vault.chezmoi.sh sits behind Cilium's Envoy, whose HTTP/1 parser rejects the non-standard
    # `LIST` verb (400): make n8n list KV secrets with `GET ?list=true` instead.
    - name: N8N_EXTERNAL_SECRETS_PREFER_GET
      value: "true"

    # Trust the egress-inspection CA (Cilium inspects the TLS traffic to api.n8n.io).
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/egress-inspection/ca.crt

    # Community nodes are baked into OCI images (catalog/flakes/n8n/) and mounted below: n8n
    # must never install packages by itself.
    - name: N8N_COMMUNITY_PACKAGES_ENABLED
      value: "false"
    - name: N8N_CUSTOM_EXTENSIONS
      value: /opt/n8n-nodes/actual

    # Binary data in S3 (Enterprise external storage). Credentials in `n8n-enterprise`.
    - name: N8N_AVAILABLE_BINARY_DATA_MODES
      value: filesystem,s3
    - name: N8N_DEFAULT_BINARY_DATA_MODE
      value: s3
    - name: N8N_EXTERNAL_STORAGE_S3_HOST
      value: s3.chezmoi.sh
    - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME
      value: n8n-lungmen-akn
    - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_REGION
      value: fr-par-1
    - name: N8N_EXTERNAL_STORAGE_S3_FORCE_PATH_STYLE
      value: "true"

    # OIDC through Pocket-Id, applied at every startup (UI controls locked).
    # Client id/secret come from `n8n-enterprise`.
    - name: N8N_SSO_MANAGED_BY_ENV
      value: "true"
    - name: N8N_SSO_OIDC_LOGIN_ENABLED
      value: "true"
    - name: N8N_SSO_OIDC_DISCOVERY_ENDPOINT
      value: https://auth.chezmoi.sh/.well-known/openid-configuration

    # Instance role from the `n8n_instance_role` claim (set on Pocket-Id groups, see
    # chezmoi.sh stack/pocket-id.ts); no claim means global:member.
    - name: N8N_SSO_USER_ROLE_PROVISIONING
      value: instance_role

  extraEnvFrom:
    - secretRef:
        name: n8n-enterprise

extraContainers:
  - name: local-license-server
    image: oci.chezmoi.sh/chezmoidotsh/n8n-self-license:2.43.5
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 50m
        memory: 50Mi

extraVolumes:
  - name: egress-inspection-ca
    secret:
      secretName: n8n-egress-inspection-ca
      items:
        - key: ca.crt
          path: ca.crt
  - name: n8n-nodes-actual
    image:
      reference: oci.chezmoi.sh/ghcr.io/chezmoidotsh/n8n-nodes/actual:26.10.9
      pullPolicy: IfNotPresent
extraVolumeMounts:
  - name: egress-inspection-ca
    mountPath: /etc/egress-inspection
    readOnly: true
  - name: n8n-nodes-actual
    mountPath: /opt/n8n-nodes/actual
    readOnly: true

# Ingress is handled by the Gateway API (n8n.httproute.yaml); network policies
# by Cilium (security/).
ingress:
  enabled: false
networkPolicy:
  enabled: false

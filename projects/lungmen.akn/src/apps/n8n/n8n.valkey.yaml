---
# trunk-ignore-all(checkov/CKV_K8S_10,checkov/CKV_K8S_11,checkov/CKV_K8S_12,checkov/CKV_K8S_13,trivy/KSV015,trivy/KSV016,trivy/KSV018): Cache only, we will address resource limits when we have consumption data
# trunk-ignore(checkov/CKV2_K8S_6): Reachable from the n8n namespace only (security/network-policy.default-hardened.yaml)
# Key-value store for the data workflows can rebuild (intermediate results, dedup keys, rate-limit
# counters), used through the Redis node. Kept apart from n8n-redis: the Bull queue must never be
# subject to the eviction below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-valkey
spec:
  replicas: 1
  # ponytail: no persistence, everything is lost on restart. Workflows must treat it as a cache.
  # Add a PVC and --save if some data ever has to survive.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-valkey
    spec:
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: docker.io/valkey/valkey
          args:
            [
              valkey-server,
              --save,
              "",
              --appendonly,
              "no",
              --maxmemory,
              256mb,
              --maxmemory-policy,
              allkeys-lru,
            ]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 52678
            runAsNonRoot: true
            runAsUser: 52678
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        fsGroup: 52678
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-valkey
spec:
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    app.kubernetes.io/name: n8n-valkey

---
# ToolHive proxy in front of n8n's instance-level MCP server (/mcp-server/http). No vMCP: single
# backend (ADR-019). Each user signs in with their own n8n account: the proxy embeds an OAuth
# authorization server that delegates the login to n8n's own OAuth (/mcp-oauth/*) and forwards the
# resulting n8n token to the backend, so there is no shared token.
# Reachable on mcp-n8n.chezmoi.sh from the LAN (HTTPRoute) and through a private Pangolin resource.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: n8n-mcp-auth
spec:
  type: embeddedAuthServer
  embeddedAuthServer:
    issuer: https://mcp-n8n.chezmoi.sh
    hmacSecretRefs:
      - name: n8n-mcp-auth
        key: hmac
    upstreamProviders:
      - name: n8n
        type: oauth2
        oauth2Config:
          # Browser-facing endpoint: the public n8n hostname. The server-side endpoints use the
          # in-cluster Service, as the Cilium Gateway answers 403 to pods outside the n8n namespace.
          authorizationEndpoint: https://n8n.chezmoi.sh/mcp-oauth/authorize
          tokenEndpoint: http://n8n-main.n8n.svc.cluster.local:5678/mcp-oauth/token
          redirectUri: https://mcp-n8n.chezmoi.sh/oauth/callback
          insecureAllowHTTP: true
          allowPrivateIPs: true
          dcrConfig:
            registrationEndpoint: http://n8n-main.n8n.svc.cluster.local:5678/mcp-oauth/register
---
# Validates the tokens issued by the embedded authorization server (same issuer).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: n8n-mcp
spec:
  type: inline
  inline:
    issuer: https://mcp-n8n.chezmoi.sh
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: n8n-mcp
spec:
  remoteUrl: http://n8n-main.n8n.svc.cluster.local:5678/mcp-server/http
  allowPrivateEndpoint: true
  transport: streamable-http
  authServerRef:
    kind: MCPExternalAuthConfig
    name: n8n-mcp-auth
  oidcConfigRef:
    name: n8n-mcp
    audience: https://mcp-n8n.chezmoi.sh
    resourceUrl: https://mcp-n8n.chezmoi.sh
---
# HMAC key signing the authorization codes, produced by Pulumi (infrastructure/pulumi/stack/n8n/mcp-auth.ts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-mcp-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: n8n-mcp-auth
    creationPolicy: Owner
  data:
    - secretKey: hmac
      remoteRef:
        key: lungmen.akn/n8n/mcp/auth-server
        property: hmac

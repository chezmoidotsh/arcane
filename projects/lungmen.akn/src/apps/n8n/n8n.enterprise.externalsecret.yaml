---
# Enterprise settings: licence, S3 external storage credentials and OIDC client.
# Everything is injected as env vars (config.extraEnvFrom), see n8n.helmvalues/default.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-enterprise
spec:
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: lungmen.akn/n8n/storage/s3.chezmoi.sh
        property: access_key_id
    - secretKey: s3_secret_key # rtunk-ignore(checkov/CKV_SECRET_6): false positive
      remoteRef:
        key: lungmen.akn/n8n/storage/s3.chezmoi.sh
        property: secret_access_key
    - secretKey: oidc_client_id
      remoteRef:
        key: lungmen.akn/n8n/auth/oidc-client
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: lungmen.akn/n8n/auth/oidc-client
        property: client_secret
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault.chezmoi.sh
  target:
    name: n8n-enterprise
    template:
      type: Opaque
      engineVersion: v2
      data:
        N8N_LICENSE_SERVER_URL: http://localhost:3000
        # Any value works: the local license server does not check it, n8n only needs one to activate.
        N8N_LICENSE_ACTIVATION_KEY: self-hosted
        N8N_EXTERNAL_STORAGE_S3_ACCESS_KEY: "{{ .s3_access_key }}"
        N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET: "{{ .s3_secret_key }}"
        N8N_SSO_OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        N8N_SSO_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"

---
# LAN access to the n8n MCP proxy (Gateways external and internal, never published). Remote access goes through the private
# Pangolin resource n8n.mcp.chezmoi.sh. The Service is created by the ToolHive operator
# (mcp-<MCPRemoteProxy name>-remote-proxy, port 8080).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://n8n.mcp.chezmoi.sh
  name: n8n-mcp
spec:
  hostnames:
    - n8n.mcp.chezmoi.sh
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: kube-system
      sectionName: mcp.chezmoi.sh-websecure
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: kube-system
      sectionName: mcp.chezmoi.sh-websecure
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mcp-n8n-mcp-remote-proxy
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

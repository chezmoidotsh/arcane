---
# trunk-ignore-all(checkov/CKV_K8S_10,checkov/CKV_K8S_11,checkov/CKV_K8S_12,checkov/CKV_K8S_13,trivy/KSV015,trivy/KSV016,trivy/KSV018): Queue only, we will address resource limits when we have consumption data
# trunk-ignore(checkov/CKV2_K8S_6): Reachable from the n8n namespace only (security/network-policy.default-hardened.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-redis
spec:
  replicas: 1
  # ponytail: no persistence, jobs queued but not yet picked up are lost if Redis restarts (executions
  # are re-triggered by their source). Add a PVC if that ever matters.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: docker.io/library/redis
          args: [redis-server, --save, "", --appendonly, "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 52678
            runAsNonRoot: true
            runAsUser: 52678
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        fsGroup: 52678
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: n8n-redis

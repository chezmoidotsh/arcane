---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n

helmCharts:
  # Official chart, maintained by n8n-io (https://github.com/n8n-io/n8n-hosting)
  - repo: oci://ghcr.io/n8n-io/n8n-helm-chart
    name: n8n
    # oripathy: ignore
    version: 1.17.0

    releaseName: n8n
    namespace: n8n
    skipTests: true

    valuesFile: n8n.helmvalues/default.yaml

resources:
  - n8n.configuration.externalsecret.yaml
  - n8n.database.externalsecret.yaml
  - n8n.egress-inspection-ca.certificate.yaml
  - n8n.enterprise.externalsecret.yaml
  - n8n.httproute.yaml
  - n8n.redis.yaml

  - security/

images:
  - name: docker.io/library/redis
    newName: oci.chezmoi.sh/docker.io/library/redis
    # oripathy: type=oci upstream=github.com/redis/redis digest=true
    newTag: 8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
  - name: ghcr.io/n8n-io/n8n
    newName: oci.chezmoi.sh/chezmoidotsh/n8n
    # oripathy: type=oci upstream=github.com/n8n-io/n8n tagPrefix=n8n@ digest=false
    newTag: 2.44.6
  - name: oci.chezmoi.sh/chezmoidotsh/n8n-self-license
    # oripathy: type=oci upstream=github.com/n8n-io/n8n tagPrefix=n8n@ digest=false
    newTag: 2.44.6

patches:
  # Task runners are disabled, but the chart still renders a Secret holding a random
  # token that changes on every render. Nothing references it, so drop it.
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: n8n-task-runners
        namespace: n8n

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Egress allowlist of n8n towards external services, over HTTPS (TCP 443) and restricted
      by FQDN. Open any new external dependency here (integrations, APIs, licence server, ...)
      rather than in a dedicated policy. Everything not listed stays denied by default-hardened;
      the database and inbound traffic have their own policies.
  name: allow-n8n-egress
  namespace: n8n
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: n8n
  egress:
    - toFQDNs:
        # n8n required access for its feature
        - matchName: s3.chezmoi.sh # Garage S3: binary data storage
        - matchName: auth.chezmoi.sh # Pocket-Id: OIDC login
        - matchName: data.o11y.chezmoi.sh # VictoriaLogs: log streaming
        - matchName: vault.chezmoi.sh # OpenBao: External Secrets
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

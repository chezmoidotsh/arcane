apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows the Cilium Gateways (HTTPRoute n8n-mcp) and Newt (private Pangolin resource
      n8n.mcp.chezmoi.sh) to reach the n8n MCP proxy on TCP 8080. The selector is the instance label
      set by the ToolHive operator on the proxy pods.
  name: allow-n8n-mcp-ingress
  namespace: n8n
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: n8n-mcp
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: newt-system
            app.kubernetes.io/name: newt
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

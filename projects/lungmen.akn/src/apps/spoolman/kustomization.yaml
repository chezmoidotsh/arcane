---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spoolman

labels:
  - pairs:
      app.kubernetes.io/name: spoolman
      app.kubernetes.io/instance: spoolman
    includeTemplates: true
    includeSelectors: true

resources:
  - spoolman.database.externalsecret.yaml
  - spoolman.deployment.yaml
  - spoolman.httproute.yaml

  - security/

images:
  - name: ghcr.io/donkie/spoolman
    newName: oci.chezmoi.sh/ghcr.io/donkie/spoolman
    # oripathy: type=oci upstream=github.com/Donkie/Spoolman tagPrefix=v digest=false
    newTag: "0.27.0"

patches:
  # Log formats of the pods (ADR-020).
  - target: {kind: Deployment, name: spoolman}
    patch: |-
      kind: Deployment
      metadata: {name: spoolman}
      spec: {template: {metadata: {annotations: {o11y.chezmoi.sh/log-format: uvicorn}}}}

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    link.argocd.argoproj.io/external-link: https://spool.lab.chezmoi.sh
  name: spoolman-websecure
spec:
  hostnames:
    - spool.lab.chezmoi.sh
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: kube-system
      sectionName: lab.chezmoi.sh-websecure
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: spoolman
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

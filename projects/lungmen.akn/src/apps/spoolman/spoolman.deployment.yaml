---
# trunk-ignore-all(checkov/CKV_K8S_10,checkov/CKV_K8S_12,checkov/CKV_K8S_13,trivy/KSV-0015,trivy/KSV-0016,trivy/KSV-0018): We will address resource limits when we have consumption data for Spoolman
# trunk-ignore(checkov/CKV_K8S_35): Spoolman cannot be configured using a file for the database credentials.
# trunk-ignore(checkov/CKV2_K8S_6): Network policy will be handled separately
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoolman
  namespace: spoolman
  labels:
    app.kubernetes.io/name: spoolman
    app.kubernetes.io/instance: spoolman
    app.kubernetes.io/part-of: spoolman
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spoolman
      app.kubernetes.io/instance: spoolman
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spoolman
        app.kubernetes.io/instance: spoolman
    spec:
      automountServiceAccountToken: false
      containers:
        # trunk-ignore(trivy/KSV-0125): ghcr.io/donkie is trusted registry for Spoolman official images
        - name: spoolman
          env:
            - name: SPOOLMAN_DB_TYPE
              value: postgres
            - name: SPOOLMAN_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: spoolman-database-spoolman
                  key: dbname
            - name: SPOOLMAN_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: spoolman-database-spoolman
                  key: host
            - name: SPOOLMAN_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: spoolman-database-spoolman
                  key: port
            - name: SPOOLMAN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spoolman-database-spoolman
                  key: password
            - name: SPOOLMAN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spoolman-database-spoolman
                  key: username

            # entrypoint.sh normally starts as root to usermod/gosu down to
            # PUID/PGID (default 1000:1000). Running the container directly
            # as a non-root UID (below) skips that dance entirely; the image's
            # baked-in files are world-readable/executable, so any UID works
            # as long as the data volume itself is writable by that UID/GID.
          image: ghcr.io/donkie/spoolman
          livenessProbe:
            httpGet:
              path: /health
              port: http
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 23281
            runAsNonRoot: true
            runAsUser: 23281
          volumeMounts:
            - name: spoolman-data
              mountPath: /home/app/.local/share/spoolman
            - name: tmp
              mountPath: /tmp
      securityContext:
        fsGroup: 23281
        runAsGroup: 23281
        runAsUser: 23281
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: spoolman-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spoolman
  namespace: spoolman
  labels:
    app.kubernetes.io/name: spoolman
    app.kubernetes.io/instance: spoolman
    app.kubernetes.io/part-of: spoolman
spec:
  selector:
    app.kubernetes.io/name: spoolman
    app.kubernetes.io/instance: spoolman
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

# =============================================================================
# hass Pulumi stack - Mise configuration
# =============================================================================
# Cloudflare API token for Home Assistant, managed as a Pulumi stack (state in
# the Garage S3 backend, see Pulumi.yaml).
#
# `.mise/env.yaml` (SOPS-encrypted PULUMI_STACK/PULUMI_CONFIG_PASSPHRASE,
# loaded via `[env] _.file` below) lets these tasks run without prompting.
#
# `node = "24"` (fuzzy, not an exact patch) overrides the root .mise.toml's
# exact `24.16.0` pin — that specific patch's built-in TypeScript stripping
# refuses .ts files under any node_modules path, breaking the file:-linked
# catalog packages; a later 24.x patch fixed it, so pin loosely instead of to
# a specific version.
#
# pulumi:diff / pulumi:apply go through scripts/pulumi:stack, which refreshes
# only when the last refresh is older than PULUMI_REFRESH_MAX_AGE hours
# (default 24). Force or skip it: `mise run pulumi:apply -- --refresh` /
# `-- --no-refresh`.
# =============================================================================

[tools]
node = "24"

[env]
_.file = "{{ config_root }}/.mise/env.yaml"

[tasks."pulumi:diff"]
description = "Preview pending changes for the current Pulumi stack"
run = "pulumi:stack preview"
dir = "{{ config_root }}"

[tasks."pulumi:apply"]
interactive = true
description = "Apply pending changes to the current Pulumi stack"
run = "pulumi:stack up"
dir = "{{ config_root }}"

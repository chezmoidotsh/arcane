creation_rules:
  # Generic - Encrypt all .decrypted~ files
  - path_regex: projects/.*/\.decrypted~.+\.yaml$
    encrypted_regex: "^(stringData|data)$"
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

  # Generic - Encrypt all .secret.yaml files' data and stringData fields
  - path_regex: projects/[^/]+/src/(apps|infrastructure/kubernetes)/.*/.+\.secret\.yaml$
    encrypted_regex: "^(stringData|data)$"
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

  # Tailscale - Protect some "private" infrastructure information like internal IP addresses.
  - path_regex: projects/[^/]+/src/infrastructure/kubernetes/tailscale/.+\.yaml$
    encrypted_regex: advertiseRoutes
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

  # Ansible Vault password file
  - path_regex: projects/[^/]+/src/infrastructure/ansible/\.vault-password\.sops$
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

  # Proxmox LXC build-time secrets (dotenv format, baked into image at build time)
  - path_regex: projects/[^/]+/src/infrastructure/proxmox/.+/secrets/.*\.sops\.env$
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9,age1es2vf7fjj4jja6mhyc2r8cfp0kzpce2qdru3cz8cllsuw3qmwpqstplq0f

  # Pulumi stack env (PULUMI_CONFIG_PASSPHRASE, PULUMI_STACK) — loaded automatically by
  # mise's `[env] _.file` on cd into the stack directory; mise decrypts SOPS transparently.
  - path_regex: projects/[^/]+/src/infrastructure/pulumi/\.mise/env\.yaml$
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

  # rimbilliton.akn NixOS host secrets (sops-nix, decrypted on the host with its SSH host key).
  # Recipients: the admin key and the host key (`ssh-to-age < extra/etc/ssh/ssh_host_ed25519_key.pub`,
  # see projects/rimbilliton.akn/docs/BOOTSTRAP.md).
  - path_regex: projects/rimbilliton\.akn/src/infrastructure/nixos/secrets/rimbilliton\.sops\.yaml$
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9,age1cpyfsxgl6eer583rhnralx54h60xjjpr3up7hgcd4wc4d44xjcaqdklwxp

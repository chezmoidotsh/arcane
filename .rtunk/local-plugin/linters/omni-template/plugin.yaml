# Repository-local rtunk plugin: linters specific to Arcane (referenced from ../rtunk.yaml, `plugins.sources`).
version: 0.1
lint:
  definitions:
    # Omni cluster templates use the ADR-014 CIDRs (172.16.0.0/12). Every per-cluster template is checked at once,
    # so the linter runs once per run, whatever the changed templates. Needs yq. Findings are `path:line: message` lines.
    - name: omni-template
      files: [yaml]
      commands:
        - name: lint
          run: scripts/omni:template:lint
          output: regex
          parse_regex: "(?P<path>[^:]+):(?P<line>\\d+): (?P<message>.*)"
          success_codes: [0, 1]
          read_output_from: stdout
          batch: true
          cache_results: false
          disable_upstream: true

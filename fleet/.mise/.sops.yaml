# SOPS creation rules for the shared fleet mise config. There is no root .sops.yaml: each element that encrypts files owns one.
# sops looks for it from the *current directory* upward (not from the file's), so run sops from inside this folder.
# path_regex is relative to this file's directory. Recipient copied from fleet/base/.sops.yaml.
creation_rules:
  # Shared Pulumi passphrase (PULUMI_CONFIG_PASSPHRASE) for the fleet stacks.
  - path_regex: pulumi/key\.sops\.json$
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

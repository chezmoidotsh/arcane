# Secrets shared by every fleet Pulumi stack, held in Bitwarden Secrets Manager.
# Values never live here, only the key names. fnox merges the .fnox.toml files found from the stack's directory
# (fleet/hosts/<host>/pulumi/) up to the repository root, the closest one winning.
# The token and project ID come from the root .fnox.toml (macOS Keychain, see `mise run bws:setup`).
#
# Only what every stack needs lives here: the Bitwarden provider, the state backend and the Pulumi passphrase.
# The provider credentials (OCI, Cloudflare, Pocket-Id, ...) are declared by the host that uses them, in
# fleet/hosts/<host>/.fnox.toml, so that a missing secret fails the stack that needs it (no `if_missing`).
[providers.bws]
type = "bitwarden-sm"
project_id = { secret = "BWS_PROJECT_ID" }

[secrets]
# Garage S3 backend of the Pulumi state (Pulumi.yaml `backend.url`).
AWS_ACCESS_KEY_ID = { provider = "bws", value = "pulumi-garage-access-key-id" }
AWS_SECRET_ACCESS_KEY = { provider = "bws", value = "pulumi-garage-secret-access-key" }

# Shared passphrase of the fleet stacks' Pulumi secrets.
PULUMI_CONFIG_PASSPHRASE = { provider = "bws", value = "pulumi-config-passphrase" }

# Root secrets shared by every fleet Pulumi stack, held in Bitwarden Secrets Manager.
# Values never live here, only the key names. fnox finds it by walking up from any stack under fleet/.
# The token and project ID come from the root .fnox.toml (macOS Keychain, see `mise run bws:setup`).
[providers.bws]
type = "bitwarden-sm"
project_id = { secret = "BWS_PROJECT_ID" }

[secrets]
# Garage S3 backend of the Pulumi state (Pulumi.yaml `backend.url`).
AWS_ACCESS_KEY_ID = { provider = "bws", value = "pulumi-garage-access-key-id" }
AWS_SECRET_ACCESS_KEY = { provider = "bws", value = "pulumi-garage-secret-access-key" }

# Cloudflare provider of the stacks that create DNS-01 tokens (Dns01TokenComponent: omni.core,
# oci-registry.core, akn.ptilopsis, ...): email + global API key, which can create account tokens. `warn` so the
# stacks that don't touch Cloudflare keep working while a secret is missing from Bitwarden.
CLOUDFLARE_EMAIL = { provider = "bws", value = "pulumi-cloudflare-email", if_missing = "warn" }
CLOUDFLARE_API_KEY = { provider = "bws", value = "pulumi-cloudflare-api-key", if_missing = "warn" }

# Admin API key of Pocket-Id (auth.chezmoi.sh), read by the pocket-id provider of the stacks that
# manage OIDC clients (akn.closure, ...). `warn` so the stacks that don't use it keep working.
POCKET_ID_API_KEY = { provider = "bws", value = "pulumi-pocket-id-api-key", if_missing = "warn" }

# Shared passphrase of the fleet stacks' Pulumi secrets.
PULUMI_CONFIG_PASSPHRASE = { provider = "bws", value = "pulumi-config-passphrase" }

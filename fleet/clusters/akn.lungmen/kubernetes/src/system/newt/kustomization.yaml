---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: newt-system

resources:
  - ../../../../../../../catalog/kubernetes/newt/kustomize
  - newt.externalsecret.yaml

  # Include security policies
  - security/

helmCharts:
  - repo: https://charts.fossorial.io
    name: newt
    # oripathy: ignore
    version: 1.5.0

    releaseName: newt
    namespace: newt-system

    valuesFile: ../../../../../../../catalog/kubernetes/newt/helm/default.helmvalues.yaml

# kustomize's namespace transformer does not post-process helmCharts resources.
# The newt Deployment template does not call {{ .Release.Namespace }}, so the
# namespace field is absent in the rendered output. This patch injects it.
patches:
  - patch: |
      - op: add
        path: /metadata/namespace
        value: newt-system
    target:
      kind: Deployment
      name: newt-newt-main-tunnel
  # Log formats of the pods (ADR-020).
  - target: { kind: Deployment, name: newt-newt-main-tunnel }
    patch: |-
      - {op: add, path: /spec/template/metadata/annotations, value: {o11y.chezmoi.sh/log-format: golog}}

labels:
  - pairs:
      app.kubernetes.io/name: newt
    includeTemplates: true
    includeSelectors: true

images:
  - name: docker.io/fosrl/newt
    newName: oci.chezmoi.sh/docker.io/fosrl/newt
    # oripathy: type=oci upstream=github.com/fosrl/newt digest=false
    newTag: "1.19.0"

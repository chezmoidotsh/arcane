apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns-system

helmCharts:
  - repo: https://kubernetes-sigs.github.io/external-dns
    name: external-dns
    # oripathy: type=helm upstream=github.com/kubernetes-sigs/external-dns tagPrefix=v
    version: 1.23.0

    releaseName: external-dns-unifi
    namespace: external-dns-system

    valuesFile: unifi.helmvalues/default.yaml
    additionalValuesFiles:
      - ../../../../../../../catalog/kubernetes/external-dns/helm/unifi.hardened.helmvalues.yaml
    includeCRDs: true

  - repo: https://kubernetes-sigs.github.io/external-dns
    name: external-dns
    version: 1.23.0

    releaseName: external-dns-bind
    namespace: external-dns-system

    valuesFile: ../../../../../../../catalog/kubernetes/external-dns/helm/bind.default.helmvalues.yaml
    additionalValuesFiles:
      - ../../../../../../../catalog/kubernetes/external-dns/helm/bind.hardened.helmvalues.yaml
      - bind.helmvalues/override.yaml
    includeCRDs: false # already installed by the unifi release above

resources:
  - ../../../../../../../catalog/kubernetes/external-dns/kustomize
  - unifi.externalsecret.yaml

images:
  - name: registry.k8s.io/external-dns/external-dns
    newName: oci.chezmoi.sh/registry.k8s.io/external-dns/external-dns
    # oripathy: type=oci upstream=github.com/kubernetes-sigs/external-dns tagPrefix=v digest=false
    newTag: v0.23.0
  - name: ghcr.io/kashalls/external-dns-unifi-webhook
    newName: oci.chezmoi.sh/ghcr.io/kashalls/external-dns-unifi-webhook
    # oripathy: type=oci upstream=github.com/kashalls/external-dns-unifi-webhook tagPrefix=v digest=false
    newTag: v0.5.2

patches:
  # Log formats of the pods (ADR-020).
  - target: {kind: Deployment, name: external-dns-bind}
    patch: |-
      - {op: add, path: /spec/template/metadata/annotations, value: {o11y.chezmoi.sh/log-format: logfmt}}
  - target: {kind: Deployment, name: external-dns-unifi}
    patch: |-
      - {op: add, path: /spec/template/metadata/annotations, value: {o11y.chezmoi.sh/log-format: json, o11y.chezmoi.sh/log-format.external-dns: logfmt}}

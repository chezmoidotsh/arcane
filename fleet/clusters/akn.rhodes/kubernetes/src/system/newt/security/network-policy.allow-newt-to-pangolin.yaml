apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  annotations:
    policy.networking.k8s.io/description: |
      Allows Newt to connect to the Pangolin API and tunnel endpoint.
  name: allow-newt-to-pangolin
  namespace: newt-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: newt
  egress:
    - toFQDNs:
        - matchName: "pangolin.chezmoi.sh"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
        - ports:
            # Gerbil (Pangolin's WireGuard manager) listens on two separate UDP
            # ports: 51820 (site/Newt tunnels) and 21820 (direct WireGuard
            # clients) -- see fleet/hosts/akn.horn/nix/modules/pangolin.nix. Newt
            # uses both depending on connection mode, so both must stay open.
            - port: "51820"
              protocol: UDP
            - port: "21820"
              protocol: UDP

# =============================================================================
# Fleet base Pulumi stack - Mise configuration
# =============================================================================
# Resources tied to no machine (project `base`, stack `base.live`, state in
# the Garage S3 backend, see Pulumi.yaml), formerly the chezmoi-sh-infra
# project (retired `projects/chezmoi.sh`).
#
# `pulumi <args>` runs through fnox (alias of fleet/.mise.toml): the state backend credentials come from
# fleet/.fnox.toml, the passphrase included, and the provider credentials
# (OCI TF_VAR_*, Cloudflare, Pocket-Id, Tailscale) from ../.fnox.toml. They are resolved from Bitwarden Secrets
# Manager (token and project ID in the Keychain, see `mise run bws:setup`), created by hand under the names listed
# there, and exist only inside that process.
#
# `node = "24"` (fuzzy, not an exact patch) overrides the root .mise.toml's
# exact `24.16.0` pin — that specific patch's built-in TypeScript stripping
# refuses .ts files under any node_modules path, breaking the file:-linked
# catalog packages; a later 24.x patch fixed it, so pin loosely instead of to
# a specific version.
#
# pulumi:diff / pulumi:apply go through scripts/pulumi:stack, which refreshes
# only when the last refresh is older than PULUMI_REFRESH_MAX_AGE hours
# (default 24). Force or skip it: `mise run pulumi:apply -- --refresh` /
# `-- --no-refresh`.
# =============================================================================

[tools]
node = "24"

[env]
PULUMI_STACK = "base.live"

[tasks."pulumi:diff"]
description = "Preview pending changes for the current Pulumi stack"
dir = "{{ config_root }}"
run = "pulumi:stack preview"

[tasks."pulumi:apply"]
description = "Apply pending changes to the current Pulumi stack"
dir = "{{ config_root }}"
interactive = true
run = "pulumi:stack up"

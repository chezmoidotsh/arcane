# =============================================================================
# pbs.core — Task Automation
# =============================================================================
# Usage:
#   mise run diagram:generate  # Regenerate assets/architecture.png from architecture.d2
# The Pulumi tasks live in pulumi/.mise.toml.
# =============================================================================

# PNG, not SVG: GitHub renders repository SVGs too small and sandboxes them (no icons).
[tasks."diagram:generate"]
description = "Generate the architecture diagram of pbs.core"
dir = "{{ config_root }}"
outputs = ["assets/architecture.png"]
run = "d2 --scale 0.8 architecture.d2 assets/architecture.png"
sources = ["architecture.d2"]

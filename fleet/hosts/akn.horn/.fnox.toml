# horn.akn Pulumi stack secrets, on top of the shared ones of fleet/.fnox.toml (Bitwarden provider, state
# backend, passphrase). Created by hand in the Bitwarden project under these names.

[secrets]
# Cloudflare provider (DNS records and the Traefik DNS-01 token): email + global API key, which can create account tokens.
CLOUDFLARE_API_KEY = { provider = "bws", value = "pulumi-cloudflare-api-key" }
CLOUDFLARE_EMAIL = { provider = "bws", value = "pulumi-cloudflare-email" }

# OCI provider (compartment, network, instance).
TF_VAR_fingerprint = { provider = "bws", value = "pulumi-oci-fingerprint" }
TF_VAR_private_key = { provider = "bws", value = "pulumi-oci-private-key" }
TF_VAR_region = { provider = "bws", value = "pulumi-oci-region" }
TF_VAR_tenancy_ocid = { provider = "bws", value = "pulumi-oci-tenancy-ocid" }
TF_VAR_user_ocid = { provider = "bws", value = "pulumi-oci-user-ocid" }

# API key of the Pangolin Integration API (https://horn-akn.<tailnet>.ts.net), read by the pangolin provider.
# Needed once the Pangolin resources are enabled (see the `pangolin` config key of the stack).
PANGOLIN_API_KEY = { provider = "bws", value = "pulumi-pangolin-api-key" }

# Admin API key of Pocket-Id (auth.chezmoi.sh), read by the pocket-id provider (Pangolin OIDC client).
POCKET_ID_API_KEY = { provider = "bws", value = "pulumi-pocket-id-api-key" }

# Tailscale (first-boot auth key).
TAILSCALE_API_KEY = { provider = "bws", value = "pulumi-tailscale-api-key" }

# SOPS creation rules for oci-registry.core. There is no root .sops.yaml: each element that encrypts files owns one.
# sops looks for it from the *current directory* upward and never merges configs: run sops from this directory.
# path_regex is relative to this file's directory. Recipients shared by every LXC of the fleet.
creation_rules:
  # LXC build-time secrets, baked into the image at build time: dotenv by hand (omni.sops.env),
  # caddy.sops.json is written by pulumi/ (SopsFile, with this same rule)
  - path_regex: secrets/.*\.sops\.(env|json)$
    age: >-

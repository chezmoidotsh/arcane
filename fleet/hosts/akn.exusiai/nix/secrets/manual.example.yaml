# Template -- the values nothing generates. Copy to manual.sops.yaml, fill, then
# `sops --encrypt --in-place manual.sops.yaml` (from nix/). Never commit the plaintext version.
# Everything else (Tailscale key, B2 key, Pocket-Id client) is written by Pulumi in exusiai.sops.json.
restic_password: <openssl rand -base64 32> # keep a copy in OpenBao: losing it = losing the backups
# Wings node credentials: Panel > Admin > Nodes > <node> > Configuration
wings_uuid: <uuid>
wings_token_id: <token_id>
wings_token: <token>

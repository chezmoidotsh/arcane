# SOPS creation rules for nas.core. There is no root .sops.yaml: each element that encrypts files owns one.
# sops looks for it from the *current directory* upward (not from the file's), so run sops from inside this folder.
# path_regex is relative to this file's directory. Recipient copied from projects/chezmoi.sh/.sops.yaml.
creation_rules:
  # Pulumi stack env (PULUMI_CONFIG_PASSPHRASE, PULUMI_STACK) — loaded automatically by
  # mise's `[env] _.file` on cd into pulumi/; mise decrypts SOPS transparently.
  - path_regex: pulumi/\.mise/env\.yaml$
    age: >-
      age1fj0yj3na3n5udfjmnxfwrlkp80tvj49w80wh699x33dh48clnvnshtjxe9

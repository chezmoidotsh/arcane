packages:
  - catalog/pulumi/lib
  - catalog/pulumi/components/*
  - catalog/pulumi/sdks/*
  - projects/*/src/infrastructure/pulumi

allowBuilds:
  "@pulumi/kubernetes": true
  protobufjs: true

overrides:
  serialize-javascript: ^7.0.7

catalog:
  "@axnic/pulumi-garage": ^1.0.1
  "@axnic/pulumi-pocket-id": ^0.1.0
  "@pulumi/cloudflare": ^6.17.0
  "@pulumi/kubernetes": ^4.34.1
  "@pulumi/oci": ^4.20.0
  "@pulumi/pulumi": ^3.262.0
  "@pulumiverse/grafana": ^2.39.1
  "@pulumi/random": ^4.18.0
  "@pulumi/tailscale": ^0.28.0
  "@pulumi/vault": ^7.12.0
  "@types/chai": ^4.3.0
  "@types/mocha": ^10.0.0
  "@types/node": ^22.0.0
  chai: ^4.4.0
  handlebars: ^4.7.9
  mocha: ^10.0.0
  ts-node: ^10.9.0
  typescript: ^5.9.3

onlyBuiltDependencies:
  - "@pulumi/b2"
  - "@pulumi/kubernetes"
  - "@pulumi/truenas"
  - "@pulumi/proxmox-backup-server"
  - "@pulumi/proxmox"
  - "@pulumi/pangolin"
  - protobufjs

minimumReleaseAgeExclude:
  - "@axnic/pulumi-pocket-id@0.1.0"
